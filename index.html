        <form class="card card-pad" id="st-pin" style="display:flex;flex-direction:column;gap:14px" autocomplete="off">
          <h2 style="font-size:18px">เปลี่ยน PIN แอดมิน</h2>
          <label class="field"><span>PIN เดิม</span><input class="input mono" type="password" name="old" inputmode="numeric" maxlength="6" required></label>
          <div class="grid g2">
            <label class="field"><span>PIN ใหม่ 6 หลัก</span><input class="input mono" type="password" name="n1" inputmode="numeric" maxlength="6" required></label>
            <label class="field"><span>ยืนยัน PIN ใหม่</span><input class="input mono" type="password" name="n2" inputmode="numeric" maxlength="6" required></label>
          </div>
          <span class="hint muted small">ลืม PIN? เปิด Apps Script แล้วเรียกใช้ฟังก์ชัน resetAdminPin (ดูในคู่มือ)</span>
          <button class="btn btn-primary" type="submit">${icon('lock', 18)}เปลี่ยน PIN</button>
        </form>
        <section class="card card-pad" style="display:flex;flex-direction:column;gap:14px">
          <h2 style="font-size:18px">ลิงก์สำหรับคนขับ</h2>
          <div class="copy-box"><input class="input" readonly value="${esc(link)}" aria-label="ลิงก์สำหรับคนขับ" id="st-link"><button type="button" class="btn sq" data-copy aria-label="คัดลอกลิงก์">${icon('copy', 18)}</button></div>
          <div class="actions">
            <a class="btn" href="https://line.me/R/msg/text/?${encodeURIComponent('ลิงก์แอปรับงาน ' + link)}" target="_blank" rel="noopener">${icon('chat', 18)}ส่งทาง LINE</a>
            <a class="btn" href="${esc(link)}" target="_blank" rel="noopener">${icon('external', 18)}เปิดลิงก์</a>
          </div>
          <ol class="steps-mini"><li>ส่งลิงก์นี้ให้คนขับ (ลิงก์ผูกกับระบบของบริษัทแล้ว)</li><li>คนขับเปิดใน Chrome / Safari แล้วกด "เพิ่มลงหน้าจอหลัก"</li><li>เลือกชื่อตัวเอง ใส่ PIN ที่แอดมินตั้งให้</li></ol>
        </section>
        <section class="card card-pad" style="display:flex;flex-direction:column;gap:12px">
          <h2 style="font-size:18px">การเชื่อมต่อระบบ</h2>
          <div class="kv">
            <div><span class="k">ที่เก็บข้อมูล</span><span class="v">${API.isDemo() ? 'โหมดตัวอย่าง (เครื่องนี้)' : 'Google Sheet'}</span></div>
            <div><span class="k">เวอร์ชันระบบหลังบ้าน</span><span class="v" id="st-ver">…</span></div>
          </div>
          ${API.isDemo() ? '' : `<div class="small muted" style="overflow-wrap:anywhere">${esc(API.apiUrl().replace(/(\/s\/.{8}).+(.{6}\/exec)$/, '$1…$2'))}</div>`}
          <div class="actions">
            <button type="button" class="btn" data-test>${icon('refresh', 18)}ทดสอบการเชื่อมต่อ</button>
            ${API.lockedUrl() ? '' : `<button type="button" class="btn btn-danger" data-change>${API.isDemo() ? 'เชื่อมต่อ Google Sheet จริง' : 'เปลี่ยนลิงก์ระบบหลังบ้าน'}</button>`}
          </div>
        </section>
      </div>`);

    $('[data-copy]').addEventListener('click', () => UI.copyText(link));
    const g = App.gen;
    const ping = async () => {
      try {
        const p = await API.call('ping');
        if (!App.alive(g)) return p;
        $('#st-ver').textContent = p.version;
        const ri = $('#st-radius [name=radius]');
        if (ri && ri.value === '') ri.value = p.checkin_radius_m === undefined ? 100 : p.checkin_radius_m;
        const fd = $('#st-daily');
        if (fd && !fd.dataset.loaded) {
          fd.dataset.loaded = '1';
          fd.daily.checked = p.daily_check !== false; fd.gps.checked = p.gps_tracking !== false;
          fd.gpsmin.value = String(p.gps_interval_min || 3);
          if (!fd.gpsmin.value) { fd.gpsmin.insertAdjacentHTML('beforeend', `<option value="${p.gps_interval_min}">${p.gps_interval_min} นาที</option>`); fd.gpsmin.value = String(p.gps_interval_min); }
        }
        placesStatus(!!p.places_api);
        return p;
      }
      catch (e) { if (App.alive(g)) $('#st-ver').textContent = 'เชื่อมต่อไม่ได้'; throw e; }
    };
    ping().catch(() => {});
    $('[data-test]').addEventListener('click', async (e) => {
      busy(e.currentTarget, true, 'กำลังทดสอบ…');
      const b = e.currentTarget;
      try { const p = await ping(); toast(`เชื่อมต่อปกติ · ${p.company}`, 'good'); } catch (err) { toast(err.message, 'bad'); }
      busy(b, false);
    });
    const ch = $('[data-change]');
    if (ch) ch.addEventListener('click', async () => {
      if (!(await UI.confirmBox('ออกจากระบบและไปหน้าเชื่อมต่อระบบหลังบ้าน?', 'ดำเนินการต่อ'))) return;
      App.state.setupFrom = API.isDemo() ? '' : API.apiUrl();
      API.clearSession();
      location.hash = '#/setup';
    });
    function placesStatus(on) {
      const el = $('#pl-status');
      if (!el) return;
      el.innerHTML = on ? `<div class="banner good">${icon('check', 18)}ใช้ Google Places อยู่ — คำแนะนำขณะพิมพ์เหมือน Google Maps</div>`
        : `<div class="banner info">${icon('search', 18)}ใช้การค้นหาฟรี (ไม่ได้ใส่ API key)</div>`;
      $('#st-places [data-rmkey]').classList.toggle('hidden', !on);
    }
    $('#st-daily').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target, btn = f.querySelector('button[type=submit]');
      busy(btn, true);
      try {
        const r = await API.call('saveSettings', { daily_check: f.daily.checked, gps_tracking: f.gps.checked, gps_interval_min: Number(f.gpsmin.value) });
        toast(`บันทึกแล้ว · ${r.daily_check ? 'บังคับตรวจความพร้อม' : 'ไม่บังคับตรวจความพร้อม'} · ${r.gps_tracking ? 'ส่ง GPS ทุก ' + r.gps_interval_min + ' นาที' : 'ปิด GPS'}`, 'good');
      } catch (err) { toast(err.message, 'bad'); }
      busy(btn, false);
    });
    $('#st-places').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target, btn = f.querySelector('button[type=submit]');
      const key = f.key.value.trim();
      if (!key) return toast('กรุณาวาง API key', 'bad');
      busy(btn, true, 'กำลังทดสอบ…');
      try { const r = await API.call('saveSettings', { places_api_key: key }); f.key.value = ''; placesStatus(r.places_api); toast('ทดสอบผ่าน บันทึก API key แล้ว', 'good'); }
      catch (err) { toast(err.message, 'bad'); }
      busy(btn, false);
    });
    $('#st-places [data-rmkey]').addEventListener('click', async (e) => {
      if (!(await UI.confirmBox('ลบ Google Places API key และกลับไปใช้การค้นหาฟรี?', 'ลบ key', true))) return;
      try { const r = await API.call('saveSettings', { places_api_key: '' }); placesStatus(r.places_api); toast('ลบ key แล้ว', 'good'); }
      catch (err) { toast(err.message, 'bad'); }
    });
    $$('#st-radius [data-r]').forEach((b) => b.addEventListener('click', () => { $('#st-radius [name=radius]').value = b.dataset.r; }));
    $('#st-radius').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      busy(btn, true);
      try {
        const r = await API.call('saveSettings', { checkin_radius_m: Number(e.target.radius.value) });
        toast(r.checkin_radius_m ? `บันทึกแล้ว · รัศมีเช็คอิน ${r.checkin_radius_m} ม.` : 'บันทึกแล้ว · ไม่ตรวจรัศมี', 'good');
      } catch (err) { toast(err.message, 'bad'); }
      busy(btn, false);
    });
    $('#st-company').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      busy(btn, true);
      try {
        const r = await API.call('saveSettings', { company_name: e.target.company.value.trim() });
        API.patchSession({ company: r.company });
        $('.brand-text span').textContent = r.company;
        toast('บันทึกแล้ว', 'good');
      } catch (err) { toast(err.message, 'bad'); }
      busy(btn, false);
    });
    $('#st-pin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target, btn = f.querySelector('button');
      if (!/^\d{6}$/.test(f.n1.value)) return toast('PIN ใหม่ต้องเป็นตัวเลข 6 หลัก', 'bad');
      if (f.n1.value !== f.n2.value) return toast('ยืนยัน PIN ใหม่ไม่ตรงกัน', 'bad');
      busy(btn, true);
      try {
        await API.call('changeAdminPin', { oldPin: f.old.value, newPin: f.n1.value });
        API.patchSession({ pinDefault: false });
        toast('เปลี่ยน PIN แล้ว', 'good');
        V.settings();
      } catch (err) { toast(err.message, 'bad'); busy(btn, false); }
    });
  };
})();

</script>
<script>/* ---- assets/driver.js ---- */
/* หน้าจอฝั่งคนขับ (มือถือ): แผนงาน · ตรวจความพร้อม & GPS · ฉัน */
(function () {
  'use strict';
  const { $, $$, esc, icon, chip, toast, busy } = UI;
  const V = (window.Views = window.Views || {});
  const loading = (t) => `<div class="loading-block"><span class="spinner"></span>${esc(t || 'กำลังโหลด…')}</div>`;

  /* ====================== ข้อมูลประจำวัน (ตรวจความพร้อม / ตั้งค่า GPS) ====================== */
  const Day = {
    data: null, at: 0, token: '',
    async get(force) {
      const s = API.session();
      const tk = s ? s.token : '';
      if (!force && this.data && this.token === tk && Date.now() - this.at < 90000 && this.data.date === UI.today()) return this.data;
      const d = await API.call('myDay');
      this.set(d, tk);
      return d;
    },
    set(d, tk) {
      this.data = d; this.at = Date.now(); this.token = tk || (API.session() || {}).token || '';
      Track.configure(d);
      paintChrome();
    },
    peek() { const s = API.session(); return this.data && s && this.token === s.token ? this.data : null; },
    needCheck() { const d = this.peek(); return !!(d && d.daily_check && !d.check); }
  };

  /* ====================== ส่งตำแหน่ง GPS (เฉพาะตอนเปิดแอปนี้อยู่) ====================== */
  const Track = {
    timer: null, enabled: false, interval: 3, state: 'idle', last: null, lastAcc: null, msg: '', busy: false,
    configure(d) {
      this.interval = Number(d.gps_interval_min) || 3;
      this.enabled = !!d.gps_tracking && (!d.daily_check || !!d.check);
      if (!d.gps_tracking) this.state = 'off';
      else if (!this.enabled) this.state = 'wait';
      if (this.enabled) this.start(); else this.stop();
    },
    start() {
      if (this.timer) return;
      this.onVis = () => { if (document.visibilityState === 'visible') this.tick(); };
      document.addEventListener('visibilitychange', this.onVis);
      this.timer = setInterval(() => this.tick(), 30000);
      this.tick();
    },
    stop() {
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
      if (this.onVis) document.removeEventListener('visibilitychange', this.onVis);
    },
    position(timeout) {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(Object.assign(new Error('อุปกรณ์นี้ไม่รองรับการหาตำแหน่ง'), { code: 2 }));
        navigator.geolocation.getCurrentPosition((p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
          (e) => reject(e), { enableHighAccuracy: true, timeout: timeout || 20000, maximumAge: 30000 });
      });
    },
    async tick(force) {
      const s = API.session();
      if (!s || s.role !== 'driver') { this.stop(); return; }
      if (!force && (!this.enabled || document.visibilityState !== 'visible')) return;
      if (!force && this.last && Date.now() - this.last < this.interval * 60000 - 5000) return;
      if (this.busy) return;
      this.busy = true;
      if (!this.last) { this.state = 'locating'; paintChrome(); }
      try {
        const p = await this.position();
        const r = await API.call('reportLocation', { lat: p.lat, lng: p.lng, acc: p.acc, force: !!force, source: force ? 'manual' : 'gps' }, { noRetry: true });
        if (r.reason === 'off') { this.state = 'off'; this.enabled = false; this.stop(); }
        else { this.state = 'on'; this.last = Date.now(); this.lastAcc = Math.round(p.acc); this.msg = ''; }
      } catch (e) {
        if (e && e.code === 1 && !(e instanceof API.ApiError)) { this.state = 'denied'; this.msg = 'ยังไม่ได้อนุญาตให้แอปเข้าถึงตำแหน่ง'; }
        else { this.state = this.last ? 'on' : 'error'; this.msg = e.message || 'ส่งตำแหน่งไม่สำเร็จ'; }
      } finally {
        this.busy = false;
        paintChrome();
      }
    },
    label() {
      return { on: 'GPS', locating: 'GPS', wait: 'GPS', off: 'GPS ปิด', denied: 'GPS', error: 'GPS', idle: 'GPS' }[this.state] || 'GPS';
    }
  };

  /* อัปเดตป้าย GPS และจุดแจ้งเตือนเมนู โดยไม่ต้องวาดหน้าใหม่ */
  function paintChrome() {
    $$('.gps-pill').forEach((el) => {
      el.className = 'gps-pill ' + Track.state;
      el.querySelector('span').textContent = Track.label();
      el.title = { on: 'กำลังส่งตำแหน่งให้แอดมิน', locating: 'กำลังหาตำแหน่ง', wait: 'จะเริ่มส่งตำแหน่งหลังตรวจความพร้อม', off: 'แอดมินปิดการส่งตำแหน่ง', denied: 'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง', error: 'ส่งตำแหน่งไม่สำเร็จ' }[Track.state] || '';
    });
    $$('.d-nav [data-tab="check"]').forEach((el) => el.classList.toggle('alert', Day.needCheck()));
    const sub = $('#d-hsub');
    const d = Day.peek();
    if (sub && d) {
      const plate = d.check ? d.check.plate : d.plate;
      sub.textContent = [plate ? 'ทะเบียน ' + plate : '', d.company].filter(Boolean).join(' · ');
    }
    if (typeof Day.onPaint === 'function') Day.onPaint();
  }

  /* ข้อมูลที่โหลดช้าจากแท็บก่อนหน้า ห้ามเขียนทับแท็บที่เปิดอยู่ตอนนี้ */
  function live() { const g = App.gen; return () => (App.alive(g) ? $('#d-body') : null); }
  /* จำข้อมูลล่าสุดของแต่ละหน้าไว้ สลับแท็บแล้วโชว์ทันที แล้วค่อยอัปเดตตามหลัง */
  const Cache = {
    tk: '', jobs: null, job: {},
    ok() { const s = API.session(); const tk = s ? s.token : ''; if (tk !== this.tk) { this.tk = tk; this.jobs = null; this.job = {}; } return this; }
  };

  /* ====================== โครงหน้าคนขับ: หัว + เมนูด้านล่าง ====================== */
  function mount(tab, body, opts) {
    opts = opts || {};
    const s = API.session();
    const d = Day.peek();
    const plate = d ? (d.check ? d.check.plate : d.plate) : '';
    const tabs = [['plan', '#/driver', 'แผนงาน', 'calendar'], ['check', '#/driver/check', 'ตรวจความพร้อม', 'shield'], ['me', '#/driver/me', 'ฉัน', 'user']];
    $('#app').innerHTML = `<div class="phone has-nav">${App.demoBar()}
      <div class="d-top"><header class="d-hcard">
        ${opts.back ? `<a class="icon-btn" href="${esc(opts.back)}" aria-label="ย้อนกลับ">${icon('back', 22)}</a>` : UI.avatar(s.user.name, s.user.photo_url, 44, 'border:2px solid rgba(255,255,255,.25)')}
        <div class="t"><h1 id="d-htitle">${esc(opts.title || s.user.name)}</h1><div class="sub" id="d-hsub">${esc(opts.sub || [plate ? 'ทะเบียน ' + plate : '', s.company].filter(Boolean).join(' · '))}</div></div>
        <a class="gps-pill ${Track.state}" href="#/driver/check" aria-label="สถานะ GPS"><i></i><span>${esc(Track.label())}</span></a>
        ${opts.refresh ? `<button type="button" class="icon-btn" id="d-refresh" aria-label="รีเฟรช">${icon('refresh')}</button>` : ''}
      </header></div>
      <main class="d-body" id="d-body">${body || loading()}</main>
      <nav class="d-nav" aria-label="เมนูคนขับ">${tabs.map(([k, h, t, ic]) =>
        `<a href="${h}" data-tab="${k}" class="${k === tab ? 'on' : ''}" ${k === tab ? 'aria-current="page"' : ''}>${icon(ic, 20)}<span>${t}</span></a>`).join('')}</nav>
    </div>`;

    paintChrome();

  /* ====================== แท็บ: แผนงาน (ไทม์ไลน์) ====================== */
  V.driverHome = async function () {
    const B = live();
    mount('plan', loading(), { refresh: true });
    Day.onPaint = null;

    async function load(force) {
      const btn = $('#d-refresh');
      if (btn) btn.disabled = true;
      try {
        const [jobs] = await Promise.all([API.call('listJobs'), Day.get(force).catch(() => null)]);
        if (!B()) return;
        Cache.ok().jobs = jobs;
        draw(jobs);
      } catch (e) {
        if (!B()) return;
        B().innerHTML = `<div class="banner bad">${esc(e.message)}</div><button class="btn btn-lg" id="h-retry">${icon('refresh', 18)}ลองใหม่</button>`;
        $('#h-retry').addEventListener('click', () => load(true));
      } finally { const b = $('#d-refresh'); if (b) b.disabled = false; }
    }
    function startTime(j) {
      if (j.time) return j.time;
      const s = (j.stops || []).find((x) => x.planned_time);
      return s ? s.planned_time : '';
    }
    function item(j) {
      const nx = UI.nextStop(j);
      const done = j.status === 'done';
      const cls = done ? 'done' : j.status === 'in_progress' ? 'now' : 'wait';
      const label = done ? 'เสร็จแล้ว' : j.status === 'in_progress' ? `กำลังทำ · ${j.done_count}/${j.total_count} จุด` : 'รอเริ่มงาน';
      const route = (j.stops || []).length > 1 ? `${j.stops[0].name} → ${j.stops[j.stops.length - 1].name}` : ((j.stops || [])[0] || {}).name || '';
      return `<a class="tl2-item ${cls}" href="#/driver/job/${esc(j.id)}">
        <span class="tl2-time">${esc(startTime(j) || '--:--')}</span>
        <span class="tl2-dot" aria-hidden="true">${done ? icon('check', 16, 'stroke-width="3"') : ''}</span>
        <span class="tl2-body">
          <span class="tl2-st">${esc(label)}</span>
          <span class="tl2-title">${esc(j.title || route)}</span>
          ${j.title && route ? `<span class="tl2-sub">${esc(route)}</span>` : ''}
          <span class="tl2-sub">${esc(j.plate)} · ${j.total_count} จุด${!done && nx && j.status === 'in_progress' ? ' · ถัดไป: ' + esc(nx.name) : ''}</span>
        </span>
        <span class="tl2-go" aria-hidden="true">${icon('back', 18, 'style="transform:rotate(180deg)"')}</span>
      </a>`;
    }
    function draw(jobs) {
      if (!B()) return;
      const t = UI.today();
      const today = jobs.filter((j) => j.date === t);
      const late = jobs.filter((j) => j.date < t && j.status !== 'done');
      const ahead = jobs.filter((j) => j.date > t);
      const doneN = today.filter((j) => j.status === 'done').length;
      let html = '';
      if (Day.needCheck()) {
        html += `<a class="ready-banner" href="#/driver/check">${icon('shield', 26)}<span><b>ยังไม่ได้ตรวจความพร้อมวันนี้</b><span>ถ่ายรูปรถ 3 รูป และยืนยันข้อมูลก่อนเริ่มงาน</span></span><span class="btn btn-sm btn-primary">ตรวจเลย</span></a>`;
      }
      if (late.length) {
        html += `<div class="tl2-head"><h2>ค้างจากวันก่อน</h2><span>${late.length} งาน</span></div><div class="tl2">${late.map(item).join('')}</div>`;
      }
      html += `<div class="tl2-head"><h2>แผนงานวันนี้</h2><span>เสร็จ ${doneN} จาก ${today.length} งาน</span></div>`;
      html += today.length ? `<div class="tl2">${today.map(item).join('')}</div>`
        : `<div class="empty card">${icon('calendar', 40)}<b style="color:var(--ink)">วันนี้ยังไม่มีงาน</b><div>เมื่อแอดมินมอบหมายงาน จะแสดงที่นี่ — กดรีเฟรชเพื่อดูงานใหม่</div></div>`;
      const days = {};
      ahead.forEach((j) => { (days[j.date] = days[j.date] || []).push(j); });
      Object.keys(days).sort().forEach((d) => {
        html += `<div class="tl2-head"><h2>${esc(UI.relDay(d))}</h2><span>${days[d].length} งาน</span></div><div class="tl2">${days[d].map(item).join('')}</div>`;
      });
      html += `<div class="muted small" style="text-align:center">อัปเดตล่าสุด ${UI.bkkNow().time} น.</div>`;
      B().innerHTML = html;
    }
    $('#d-refresh').addEventListener('click', () => load(true));
    if (Cache.ok().jobs) draw(Cache.jobs);
    const onVis = () => { if (document.visibilityState === 'visible') load(); };
    document.addEventListener('visibilitychange', onVis);
    App.onLeave(() => document.removeEventListener('visibilitychange', onVis));
    load();
  };

  /* ====================== ทำงานทีละจุด ====================== */
  V.driverJob = async function (params) {
    const B = live();
    const id = params[0];
    const st = { job: null, focus: null };
    mount('plan', loading(), { back: '#/driver', title: 'กำลังโหลด…', sub: ' ', refresh: true });
    Day.onPaint = null;
    Day.get().then(() => { if (B() && st.job && $('#j-check-area')) draw(); }).catch(() => {});

    async function load() {
      try {
        const j = await API.call('getJob', { id });
        if (!B()) return;
        st.job = j; Cache.ok().job[id] = j; draw();
      }
      catch (e) { if (B() && !st.job) B().innerHTML = `<div class="banner bad">${esc(e.message)}</div><a class="btn btn-lg" href="#/driver">กลับไปแผนงาน</a>`; else if (B()) toast(e.message, 'bad'); }
    }
    if (Cache.ok().job[id]) { st.job = Cache.job[id]; setTimeout(() => { if (B() && st.job) draw(); }, 0); }

    function draw() {
      const j = st.job;
      if (!B()) return;
      $('#d-htitle').textContent = UI.jobTitle(j);
      $('#d-hsub').innerHTML = `<span class="mono">${esc(j.job_no)}</span> · ${esc(j.plate)}`;
      const pending = j.stops.filter((s) => s.status !== 'arrived');
      const cur = j.status === 'cancelled' ? null : (pending.find((s) => s.id === st.focus) || pending[0] || null);
      let html = '';
      if (j.status === 'cancelled') html += '<div class="banner bad">Job นี้ถูกยกเลิกแล้ว</div>';
      html += `<div class="pick-card" style="background:#fff;border:1px solid var(--line)">${UI.vehicleThumb(j.vehicle_photo_url, 84, 56)}<div><div class="s">รถคันนี้</div><div class="t mono" style="font-size:17px">${esc(j.plate)}</div>${j.vehicle_name ? `<div class="s">${esc(j.vehicle_name)}${j.vehicle_seats ? ' · ' + j.vehicle_seats + ' ที่นั่ง' : ''}</div>` : ''}</div></div>`;
      if (j.note) html += `<div class="banner info" style="align-items:flex-start">${icon('note', 18)}<span style="flex:1 1 200px;white-space:pre-line"><b>หมายเหตุจากแอดมิน</b><br>${esc(j.note)}</span></div>`;

      if (j.status === 'cancelled') {
        /* แสดงแค่รายการจุด */
      } else if (j.status === 'done' || !cur) {
        html += `<div class="done-card"><div class="done-ico">${icon('check', 36, 'stroke-width="2.6"')}</div>
          <b style="font-size:22px">ปิดงานเรียบร้อย</b>
          <span class="muted">เช็คอินครบ ${j.total_count} จุด${j.finished_at ? ' · เสร็จ ' + esc(UI.hhmm(j.finished_at)) + ' น.' : ''}</span>
          <a class="btn btn-primary btn-lg btn-block" href="#/driver">กลับไปแผนงาน</a></div>`;
      } else {
        const idx = j.stops.indexOf(cur) + 1;
        const needCheck = Day.needCheck();
        html += `<section class="cur-stop" aria-label="จุดปัจจุบัน">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <span style="font-weight:600;color:var(--brand)">จุดที่ ${idx} จาก ${j.total_count}</span>
            ${cur.planned_time ? `<span class="chip plain st-in_progress">${icon('clock', 14)}นัด ${esc(cur.planned_time)}</span>` : ''}
          </div>
          <div><div class="name">${esc(cur.name)}</div>${cur.address ? `<div class="addr">${esc(cur.address)}</div>` : ''}</div>
          ${cur.note ? `<div class="banner warn" style="padding:10px 12px">${icon('note', 18)}${esc(cur.note)}</div>` : ''}
          <div class="grid g2 keep" style="gap:10px">
            <a class="btn btn-lg" href="${esc(UI.navUrl(cur))}" target="_blank" rel="noopener">${icon('nav')}นำทาง</a>
            <a class="btn btn-lg" href="${esc(UI.routeUrl([cur].concat(pending.filter((s) => s !== cur)), { fromHere: true }))}" target="_blank" rel="noopener">${icon('route')}ทั้งเส้นทาง</a>
          </div>
          <div id="j-check-area">${needCheck
            ? `<a class="btn btn-primary btn-block big-check" href="#/driver/check?next=${esc(j.id)}">${icon('shield', 24)}ตรวจความพร้อมก่อนเริ่มงาน</a>
               <div class="muted small" style="text-align:center;margin-top:8px">ต้องตรวจความพร้อมประจำวัน (ถ่ายรูปรถ 3 รูป) ก่อนเช็คอินจุดแรก</div>`
            : `<button type="button" class="btn btn-primary btn-block big-check" id="btn-check">${icon('camera', 24)}ถึงแล้ว · ถ่ายรูปเช็คอิน</button>
               <div class="muted small" style="text-align:center;margin-top:8px">${radiusText(j, cur)}</div>`}</div>
          <div class="muted small" style="text-align:center">"ทั้งเส้นทาง" เริ่มจากตำแหน่งปัจจุบัน → ${pending.length > 1 ? `จุดที่ ${idx} → … ตามลำดับ` : `จุดที่ ${idx}`}</div>
        </section>`;
      }

      html += `<section class="step-list" aria-label="ทุกจุดใน Job"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>ทุกจุดใน Job นี้</b><span class="muted small">${j.done_count}/${j.total_count} จุด</span></div>
        ${j.stops.map((s) => {
          const done = s.status === 'arrived';
          const now = cur && s.id === cur.id;
          return `<div class="step">
            <div class="num ${done ? 'done' : now ? '' : 'idle'}" style="width:28px;height:28px;font-size:13px">${done ? icon('check', 14) : s.seq}</div>
            <div class="grow"><span style="font-weight:600;${done ? 'color:var(--muted)' : ''}">${esc(s.name)}</span>
              <span class="small muted">${done ? 'เช็คอิน ' + esc(UI.hhmm(s.arrived_at)) + ' น.' + (s.planned_time ? ' · นัด ' + esc(s.planned_time) : '') : (s.planned_time ? 'นัด ' + esc(s.planned_time) + ' น.' : 'ไม่ได้กำหนดเวลา')}${now ? ' · <b style="color:var(--brand)">จุดปัจจุบัน</b>' : ''}</span></div>
            ${!done && !now && j.status !== 'cancelled' ? `<button type="button" class="btn btn-sm" data-focus="${esc(s.id)}">ไปจุดนี้ก่อน</button>` : ''}
          </div>`;
        }).join('')}</section>
        <section class="card map-card" aria-label="แผนที่"><div class="map xs" id="j-map"></div></section>`;
      B().innerHTML = html;
      UI.renderMap($('#j-map'), j.stops, { polyline: j.route_polyline, markNext: true });
      $$('[data-focus]').forEach((b) => b.addEventListener('click', () => { st.focus = b.dataset.focus; draw(); window.scrollTo({ top: 0, behavior: 'smooth' }); }));
      const btn = $('#btn-check');
      if (btn) btn.addEventListener('click', () => openCheckin(cur));
    }

    function openCheckin(stop) {
      const job = st.job;
      const radius = Number(job.checkin_radius_m) || 0;
      const pinned = UI.hasXY(stop);
      const demo = API.isDemo();
      const ck = { photos: [], pos: null, geoErr: '', watch: null, map: null, me: null, sending: false };
      const m = UI.modal({
        title: `เช็คอิน · ${stop.name}`, full: true,
        body: `<div class="geo-box wait" id="ci-geo" role="status"></div>
          ${pinned && window.L ? '<div class="mini-map" id="ci-map" aria-label="แผนที่ตำแหน่งปัจจุบันเทียบกับจุดนัด"></div>' : ''}
          <div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><b>รูปเช็คอิน</b><span class="small muted" id="ci-count"></span></div>
            <div class="ph-grid" id="ci-photos"></div>
            <input type="file" accept="image/*" capture="environment" multiple id="ci-cam" class="file-hidden" tabindex="-1" aria-hidden="true">
          </div>
          <label class="field"><span>หมายเหตุ (ถ้ามี)</span><textarea class="input" id="ci-note" maxlength="300" rows="2" placeholder="เช่น ลูกค้าขึ้นรถครบ 3 คน"></textarea></label>`,
        foot: `<button type="button" class="btn btn-lg" data-close>ยกเลิก</button><button type="button" class="btn btn-good btn-lg" data-ok disabled>${icon('check', 20)}ยืนยันเช็คอิน</button>`,
        onClose: () => {
          if (ck.watch !== null && navigator.geolocation) navigator.geolocation.clearWatch(ck.watch);
          if (ck.map) ck.map.remove();
        }
      });
      const $m = (q) => m.el.querySelector(q);
      const ok = $m('[data-ok]');

      // ---- ตำแหน่งปัจจุบัน (อัปเดตตลอดขณะเปิดหน้านี้) ----
      function startWatch() {
        ck.geoErr = '';
        if (!navigator.geolocation) { ck.geoErr = 'อุปกรณ์นี้ไม่รองรับการหาตำแหน่ง'; return refresh(); }
        if (ck.watch !== null) navigator.geolocation.clearWatch(ck.watch);
        ck.watch = navigator.geolocation.watchPosition(
          (p) => { ck.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; ck.geoErr = ''; refresh(); },
          (err) => { ck.geoErr = err.code === 1 ? 'ยังไม่ได้อนุญาตให้เข้าถึงตำแหน่ง — เปิดสิทธิ์ตำแหน่ง (Location) ให้เบราว์เซอร์ แล้วกด "หาตำแหน่งอีกครั้ง"' : 'หาตำแหน่งไม่ได้ — ไปที่โล่ง แล้วกด "หาตำแหน่งอีกครั้ง"'; refresh(); },
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 }
        );
        refresh();
      }
      function dist() { return ck.pos && pinned ? UI.distanceM(stop, ck.pos) : null; }
      function geoState() {
        const d = dist();
        if (!pinned) return { cls: 'info', ok: true, html: `${icon('pin', 18)}<span>จุดนี้ไม่ได้ปักหมุดพิกัด — ระบบบันทึกตำแหน่งที่ถ่ายรูปไว้ แต่ไม่ตรวจรัศมี${ck.pos ? ` <span class="muted">(ได้ตำแหน่งแล้ว ±${Math.round(ck.pos.acc)} ม.)</span>` : ''}</span>` };
        if (ck.geoErr && !ck.pos) return { cls: 'bad', ok: radius === 0 || demo, html: `${icon('pin', 18)}<span>${esc(ck.geoErr)}${demo ? '<br><b>โหมดตัวอย่าง:</b> เช็คอินได้เพื่อทดลอง' : ''}</span>`, retry: true };
        if (!ck.pos) return { cls: 'wait', ok: false, html: `<span class="spinner sm"></span><span>กำลังหาตำแหน่งปัจจุบัน…</span>` };
        const accTxt = `ความแม่นยำ ±${Math.round(ck.pos.acc)} ม.`;
        if (radius === 0) return { cls: 'good', ok: true, html: `${icon('pin', 18)}<span>อยู่ห่างจากจุดนัด <b>${UI.fmtDist(d)}</b> <span class="muted">· ${accTxt}</span></span>` };
        if (d <= radius) return { cls: 'good', ok: true, html: `${icon('check', 18)}<span>อยู่ห่างจากจุดนัด <b>${UI.fmtDist(d)}</b> · อยู่ในรัศมี ${radius} ม. <span class="muted">· ${accTxt}</span></span>` };
        return { cls: 'bad', ok: demo, retry: true,
          html: `${icon('pin', 18)}<span>อยู่ห่างจากจุดนัด <b>${UI.fmtDist(d)}</b> — ต้องอยู่ในรัศมี <b>${radius} ม.</b> จึงจะเช็คอินได้<br><span class="small">${accTxt}${ck.pos.acc > radius ? ' · สัญญาณ GPS ยังไม่แม่น ลองออกไปที่โล่งสักครู่' : ''} · <a href="${esc(UI.navUrl(stop))}" target="_blank" rel="noopener">นำทางไปจุดนัด</a></span>${demo ? '<br><b>โหมดตัวอย่าง:</b> อนุญาตให้เช็คอินนอกรัศมีเพื่อทดลอง' : ''}</span>` };
      }
      function refresh() {
        const g = geoState();
        const box = $m('#ci-geo');
        if (!box) return;
        box.className = 'geo-box ' + g.cls;
        box.innerHTML = g.html + (g.retry ? '<button type="button" class="btn btn-sm" data-regeo>หาตำแหน่งอีกครั้ง</button>' : '');
        const rb = box.querySelector('[data-regeo]');
        if (rb) rb.addEventListener('click', () => { ck.pos = null; startWatch(); });
        drawMiniMap();
        ok.disabled = ck.sending || !ck.photos.length || !g.ok;
        ok.title = !ck.photos.length ? 'ถ่ายรูปอย่างน้อย 1 รูป' : (!g.ok ? 'ต้องอยู่ในรัศมีจุดนัด' : '');
      }
      function drawMiniMap() {
        const el = $m('#ci-map');
        if (!el) return;
        if (!ck.map) {
          ck.map = L.map(el, { zoomControl: false, attributionControl: false, dragging: true, scrollWheelZoom: false });
          L.tileLayer(UI.CONFIG.TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(ck.map);
          if (radius > 0) L.circle([stop.lat, stop.lng], { radius, color: '#2B7A3B', weight: 2, fillOpacity: 0.1 }).addTo(ck.map);
          L.marker([stop.lat, stop.lng], { icon: L.divIcon({ className: '', html: `<div class="pin">${esc(stop.seq)}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(ck.map);
          ck.map.setView([stop.lat, stop.lng], 16);
          setTimeout(() => ck.map && ck.map.invalidateSize(), 80);
        }
        if (ck.pos) {
          const ll = [ck.pos.lat, ck.pos.lng];
          if (!ck.me) ck.me = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#7C3AED', fillOpacity: 1 }).addTo(ck.map);
          else ck.me.setLatLng(ll);
          ck.map.fitBounds(L.latLngBounds([[stop.lat, stop.lng], ll]).pad(0.6), { maxZoom: 17 });
        }
      }

      // ---- รูปเช็คอิน (หลายรูป) ----
      function drawPhotos() {
        const grid = $m('#ci-photos');
        grid.innerHTML = ck.photos.map((p, i) => `<div class="ph"><img src="${p}" alt="รูปที่ ${i + 1}"><button type="button" class="ph-del" data-del="${i}" aria-label="ลบรูปที่ ${i + 1}">${icon('x', 16)}</button></div>`).join('') +
          (ck.photos.length < MAX_PHOTOS ? `<label for="ci-cam" class="ph-add" role="button" tabindex="0">${icon('camera', 26)}<span>${ck.photos.length ? 'เพิ่มรูป' : 'ถ่ายรูป'}</span></label>` : '');
        $m('#ci-count').textContent = `${ck.photos.length}/${MAX_PHOTOS} รูป`;
        grid.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => { ck.photos.splice(Number(b.dataset.del), 1); drawPhotos(); refresh(); }));
        const add = grid.querySelector('.ph-add');
        if (add) add.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $m('#ci-cam').click(); } });
      }
      $m('#ci-cam').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []).slice(0, MAX_PHOTOS - ck.photos.length);
        e.target.value = '';
        for (const f of files) {
          const holder = document.createElement('div');
          holder.className = 'ph loading';
          holder.innerHTML = '<span class="spinner sm"></span>';
          $m('#ci-photos').insertBefore(holder, $m('.ph-add'));
          try {
            const d = dist();
            const line2 = `${UI.fmtDate(UI.today(), { noDay: true })} ${UI.bkkNow().time} น. · ${job.job_no} · ${job.plate}${d !== null ? ' · ห่างจุด ' + UI.fmtDist(d) : ''}`;
            ck.photos.push(await processPhoto(f, [stop.name, line2], demo ? 560 : 1280));
          } catch (err) { toast('อ่านรูปไม่ได้ กรุณาถ่ายใหม่', 'bad'); }
        }
        drawPhotos(); refresh();
      });

      ok.addEventListener('click', async () => {
        if (ok.disabled) return;
        ck.sending = true;
        busy(ok, true, ck.photos.length > 1 ? `กำลังส่ง ${ck.photos.length} รูป…` : 'กำลังส่งรูป…');
        try {
          st.job = await API.call('checkIn', {
            stopId: stop.id, photos: ck.photos, note: $m('#ci-note').value.trim(),
            lat: ck.pos ? ck.pos.lat : null, lng: ck.pos ? ck.pos.lng : null, acc: ck.pos ? ck.pos.acc : null
          });
          m.close();
          st.focus = null;
          toast(st.job.status === 'done' ? 'เช็คอินครบทุกจุด ปิดงานแล้ว' : `เช็คอิน "${stop.name}" แล้ว`, 'good');
          draw();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          if (err.code === 'NEED_DAILY') {
            m.close(); toast(err.message, 'bad');
            Day.get(true).catch(() => {});
            location.hash = '#/driver/check?next=' + encodeURIComponent(job.id);
            return;
          }
          if (err.code === 'NETWORK' || err.code === 'TIMEOUT' || err.code === 'BAD_RESPONSE') {
            // สัญญาณหลุดระหว่างส่ง: เช็คก่อนว่าระบบได้รับแล้วหรือยัง จะได้ไม่ต้องถ่ายใหม่
            try {
              const fresh = await API.call('getJob', { id: job.id });
              const s2 = fresh.stops.find((x) => x.id === stop.id);
              if (s2 && s2.status === 'arrived') {
                st.job = fresh; m.close(); st.focus = null;
                toast(`เช็คอิน "${stop.name}" แล้ว`, 'good'); draw(); return;
              }
            } catch (e2) { /* ยังออฟไลน์ */ }
            toast('ส่งไม่สำเร็จเพราะสัญญาณอินเทอร์เน็ต — รูปยังอยู่ กด "ยืนยันเช็คอิน" อีกครั้ง', 'bad');
          } else toast(err.message, 'bad');
          ck.sending = false;
          busy(ok, false);
          refresh();
        }
      });

      drawPhotos();
      startWatch();
    }

    $('#d-refresh').addEventListener('click', load);
    load();
  };

  async function loadImage(file) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* ใช้วิธีสำรอง */ }
    }
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  /* ย่อรูปและพิมพ์ชื่อสถานที่ + เวลา ลงบนรูป */
  async function processPhoto(file, lines, maxSide) {
    const img = await loadImage(file);
    const w0 = img.width, h0 = img.height;
    const k = Math.min(1, maxSide / Math.max(w0, h0));
    const w = Math.round(w0 * k), h = Math.round(h0 * k);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    try { await document.fonts.load('600 20px "IBM Plex Sans Thai"'); } catch (e) { /* ใช้ฟอนต์ระบบ */ }
    const band = Math.max(54, Math.round(h * 0.12));
    ctx.fillStyle = 'rgba(11,31,51,.62)';
    ctx.fillRect(0, h - band, w, band);
    const f1 = Math.round(band * 0.34), f2 = Math.round(band * 0.25), pad = Math.round(band * 0.28);
    ctx.fillStyle = '#fff';
    ctx.textBaseline = 'alphabetic';
    ctx.font = `600 ${f1}px "IBM Plex Sans Thai", sans-serif`;
    ctx.fillText(fit(ctx, lines[0], w - pad * 2), pad, h - band + pad + f1 * 0.8);
    ctx.font = `400 ${f2}px "IBM Plex Sans Thai", sans-serif`;
    ctx.fillStyle = '#DCE6F0';
    ctx.fillText(fit(ctx, lines[1], w - pad * 2), pad, h - pad * 0.7);
    if (img.close) img.close();
    return c.toDataURL('image/jpeg', 0.76);
  }
  function fit(ctx, text, max) {
    let t = String(text || '');
    if (ctx.measureText(t).width <= max) return t;
    while (t.length > 1 && ctx.measureText(t + '…').width > max) t = t.slice(0, -1);
    return t + '…';
  }
})();

</script>
<script>/* ---- assets/app.js ---- */
/* ตัวควบคุมหลัก: เส้นทางหน้า เข้าสู่ระบบ และเชื่อมต่อระบบ */
(function () {
  'use strict';
  const { $, $$, esc, icon, toast, busy } = UI;
  const V = window.Views;
  const CONFIG = window.STJ_CONFIG || {};
  if (CONFIG.BRAND) document.documentElement.style.setProperty('--brand', CONFIG.BRAND);

  let leaveFns = [];
  const App = (window.App = {
    state: {},
    gen: 0, // เพิ่มทุกครั้งที่เปลี่ยนหน้า — ข้อมูลที่โหลดช้าจากหน้าก่อนจะไม่เขียนทับหน้าใหม่
    alive(g) { return g === App.gen; },
    onLeave(fn) { leaveFns.push(fn); },
    doLogout() { return logout(); },
    demoBar() {
      if (!API.isDemo()) return '';
      return `<div class="demo-bar"><span><b>โหมดตัวอย่าง</b> — ข้อมูลเก็บในเครื่องนี้เท่านั้น</span>
        <button type="button" data-demo-reset>รีเซ็ตข้อมูลตัวอย่าง</button>
        <button type="button" data-demo-exit>ออกจากโหมดตัวอย่าง</button></div>`;
    },
    bindCommon() {
      $$('[data-logout]').forEach((b) => b.addEventListener('click', logout));
      $$('[data-demo-reset]').forEach((b) => b.addEventListener('click', async () => {
        if (!(await UI.confirmBox('ล้างข้อมูลตัวอย่างทั้งหมดแล้วเริ่มใหม่?', 'รีเซ็ต'))) return;
        DemoBackend.reset(); API.clearSession(); App.state = {};
        go('#/login');
      }));
      $$('[data-demo-exit]').forEach((b) => b.addEventListener('click', () => {
        API.disableDemo(); App.state = {};
        go(API.ready() ? '#/login' : '#/setup');
      }));
    }
  });

  function go(h) { if (location.hash === h) route(); else location.hash = h; }

  async function logout() {
    if (!(await UI.confirmBox('ออกจากระบบ?', 'ออกจากระบบ'))) return;
    try { await API.call('logout'); } catch (e) { /* ไม่เป็นไร */ }
    API.clearSession();
    App.state = {};
    location.hash = '#/login';
  }

  /* ====================== เชื่อมต่อระบบ ====================== */
  V.setup = function () {
    $('#app').innerHTML = `<div class="auth"><div class="auth-card" style="max-width:560px">
      <div class="auth-top">${UI.brandMark(28)}
        <div><h1>เชื่อมต่อระบบ</h1><div class="muted">ใส่ลิงก์เว็บแอปจาก Google Apps Script ที่สร้างจาก Google Sheet ของบริษัท</div></div></div>
      <div class="auth-body">
        <form id="su-form" style="display:flex;flex-direction:column;gap:14px">
          <label class="field"><span>ลิงก์เว็บแอป (ลงท้ายด้วย /exec)</span>
            <input class="input" name="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(App.state.setupFrom || '')}" required></label>
          <button class="btn btn-primary btn-lg" type="submit">${icon('link', 20)}ทดสอบและเชื่อมต่อ</button>
        </form>
        <a href="${esc(CONFIG.GUIDE_URL || '#')}" target="_blank" rel="noopener" style="text-align:center">ยังไม่มีลิงก์? ดูวิธีติดตั้ง Google Sheet (5 ขั้นตอน)</a>
        <div style="display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px"><span style="flex:1;height:1px;background:var(--line)"></span>หรือ<span style="flex:1;height:1px;background:var(--line)"></span></div>
        <button type="button" class="btn btn-lg" id="su-demo">${icon('van', 20)}ลองระบบตัวอย่าง (ไม่ต้องตั้งค่า)</button>
        <div class="muted small" style="text-align:center">โหมดตัวอย่างมีข้อมูลรถและคนขับตัวอย่าง เก็บไว้ในเครื่องนี้เท่านั้น</div>
      </div></div></div>`;
    $('#su-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = e.target.url.value.trim();
      const btn = e.target.querySelector('button');
      busy(btn, true, 'กำลังทดสอบ…');
      try {
        const info = await API.testUrl(url);
        API.setApiUrl(url);
        App.state = {};
        toast(`เชื่อมต่อสำเร็จ · ${info.company || 'Smart Tracking'}`, 'good');
        location.hash = '#/login';
      } catch (err) { toast(err.message, 'bad'); busy(btn, false); }
    });
    $('#su-demo').addEventListener('click', () => { API.enableDemo(); App.state = {}; go('#/login'); });
  };

  /* ====================== เข้าสู่ระบบ ====================== */
  V.login = async function () {
    const st = { tab: App.state.loginTab || 'driver', drivers: null, driver: null, pin: '', company: '', busy: false };
    let lastId = null;
    try { lastId = localStorage.getItem('stj_last_driver'); } catch (e) { /* ไม่เป็นไร */ }

    $('#app').innerHTML = `${App.demoBar()}<div class="auth"><div class="auth-card">
      <div class="auth-top">${UI.brandMark(28)}
        <div><h1 id="lg-company">Smart Tracking Jobs</h1><div class="muted">ระบบจ่ายงานและเช็คอินรถตู้</div></div></div>
      <div class="auth-body" id="lg-body"><div class="loading-block"><span class="spinner"></span>กำลังโหลด…</div></div>
    </div></div>`;
    App.bindCommon();

    try {
      const [ping, drivers] = await Promise.all([API.call('ping'), API.call('publicDrivers')]);
      st.company = ping.company; st.drivers = drivers;
      $('#lg-company').textContent = ping.company || 'Smart Tracking Jobs';
      if (lastId) st.driver = drivers.find((d) => d.id === lastId) || null;
    } catch (e) {
      $('#lg-body').innerHTML = `<div class="banner bad">${esc(e.message)}</div>
        <button class="btn" id="lg-retry">${icon('refresh', 18)}ลองใหม่</button>
        ${API.lockedUrl() ? '' : '<a href="#/setup" style="text-align:center">ตั้งค่าการเชื่อมต่อระบบ</a>'}`;
      $('#lg-retry').addEventListener('click', () => V.login());
      return;
    }

    function draw() {
      const tabs = `<div class="tabs" role="tablist" aria-label="ประเภทผู้ใช้">
        <button type="button" role="tab" aria-selected="${st.tab === 'driver'}" class="${st.tab === 'driver' ? 'on' : ''}" data-tab="driver">คนขับ</button>
        <button type="button" role="tab" aria-selected="${st.tab === 'admin'}" class="${st.tab === 'admin' ? 'on' : ''}" data-tab="admin">แอดมิน / เจ้าของ</button></div>`;
      let body = '';
      if (st.tab === 'driver' && !st.driver) {
        body = `<div class="field"><span>เลือกชื่อของคุณ</span></div>
          ${st.drivers.length > 8 ? '<input class="input" id="lg-q" placeholder="ค้นหาชื่อ" autocomplete="off" aria-label="ค้นหาชื่อ">' : ''}
          <div class="name-grid" id="lg-names"></div>`;
      } else {
        body = `${st.tab === 'driver'
          ? `<div class="who-chip"><span style="display:flex;align-items:center;gap:10px;font-weight:600">${UI.avatar(st.driver.name, st.driver.photo_url, 40)}${esc(st.driver.name)}</span><button type="button" class="btn btn-sm btn-ghost" id="lg-change">เปลี่ยนชื่อ</button></div>`
          : '<div style="font-weight:600">ใส่ PIN แอดมิน 6 หลัก</div>'}
          <div style="text-align:center;color:var(--muted);font-size:14px">${st.tab === 'driver' ? 'ใส่ PIN 6 หลัก' : ''}</div>
          <div class="pin-dots" id="lg-dots" aria-hidden="true">${'<i></i>'.repeat(6)}</div>
          <div id="lg-err" role="alert" style="min-height:22px;text-align:center;color:var(--bad);font-size:14px"></div>
          <div class="keypad" id="lg-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button type="button" data-k="${n}">${n}</button>`).join('')}
            <button type="button" class="fn" data-k="clear">ล้าง</button><button type="button" data-k="0">0</button>
            <button type="button" class="fn" data-k="back" aria-label="ลบตัวเลข">⌫</button></div>`;
      }
      const hint = API.isDemo() ? `<div class="banner info small" style="font-size:13px">ลองใช้: แอดมิน PIN <b>000000</b> · คนขับ สมชาย <b>111111</b>, วิชัย <b>222222</b>, ประเสริฐ <b>333333</b>, อนุชา <b>444444</b></div>` : '';
      $('#lg-body').innerHTML = tabs + body + hint;

      $$('[data-tab]').forEach((b) => b.addEventListener('click', () => { st.tab = b.dataset.tab; App.state.loginTab = st.tab; st.pin = ''; draw(); }));
      if (st.tab === 'driver' && !st.driver) {
        const drawNames = () => {
          const q = ($('#lg-q') ? $('#lg-q').value : '').trim().toLowerCase();
          const list = st.drivers.filter((d) => !q || d.name.toLowerCase().includes(q));
          $('#lg-names').innerHTML = list.length ? list.map((d) => `<button type="button" class="name-btn" data-d="${esc(d.id)}">${UI.avatar(d.name, d.photo_url, 32)}${esc(d.name)}</button>`).join('')
            : `<div class="muted small" style="grid-column:1/-1">${st.drivers.length ? 'ไม่พบชื่อ' : 'ยังไม่มีคนขับในระบบ — แอดมินเพิ่มคนขับได้ที่เมนู "คนขับ"'}</div>`;
          $$('[data-d]').forEach((b) => b.addEventListener('click', () => { st.driver = st.drivers.find((d) => d.id === b.dataset.d); st.pin = ''; draw(); }));
        };
        if ($('#lg-q')) $('#lg-q').addEventListener('input', drawNames);
        drawNames();
      } else {
        if ($('#lg-change')) $('#lg-change').addEventListener('click', () => { st.driver = null; st.pin = ''; draw(); });
        $$('[data-k]').forEach((b) => b.addEventListener('click', () => key(b.dataset.k)));
        dots();
      }
    }
    function dots() {
      $$('#lg-dots i').forEach((d, i) => d.classList.toggle('on', i < st.pin.length));
    }
    function key(k) {
      if (st.busy || !$('#lg-pad')) return;
      if (k === 'back') st.pin = st.pin.slice(0, -1);
      else if (k === 'clear') st.pin = '';
      else if (/^\d$/.test(k) && st.pin.length < 6) st.pin += k;
      $('#lg-err').textContent = '';
      dots();
      if (st.pin.length === 6) submit();
    }
    async function submit() {
      if (st.busy || st.pin.length !== 6) return;
      st.busy = true;
      $('#lg-pad').classList.add('busy');
      const err = $('#lg-err');
      err.innerHTML = '<span class="spinner sm" style="display:inline-block;vertical-align:middle"></span> กำลังเข้าสู่ระบบ…';
      err.style.color = 'var(--muted)';
      const slow = setTimeout(() => { if (st.busy && $('#lg-err')) $('#lg-err').innerHTML = '<span class="spinner sm" style="display:inline-block;vertical-align:middle"></span> ระบบกำลังเริ่มทำงาน อาจใช้เวลาสักครู่…'; }, 6000);
      try {
        const res = await API.call('login', st.tab === 'admin' ? { role: 'admin', pin: st.pin } : { role: 'driver', driverId: st.driver.id, pin: st.pin });
        clearTimeout(slow);
        API.setSession(res);
        if (res.role === 'driver') { try { localStorage.setItem('stj_last_driver', res.user.id); } catch (e) { /* ไม่เป็นไร */ } }
        toast(`ยินดีต้อนรับ ${res.user.name}`, 'good');
        location.hash = res.role === 'admin' ? '#/admin' : '#/driver';
      } catch (e) {
        clearTimeout(slow);
        st.busy = false;
        if ($('#lg-pad')) $('#lg-pad').classList.remove('busy');
        const box = $('#lg-err');
        if (!box) return;
        box.style.color = 'var(--bad)';
        if (e.code === 'NETWORK' || e.code === 'TIMEOUT' || e.code === 'BAD_RESPONSE') {
          // เน็ตสะดุด: เก็บ PIN ไว้ ให้กดลองอีกครั้งได้ทันที ไม่ต้องกดใหม่ทั้งหมด
          box.innerHTML = `${esc(e.message)}<br><button type="button" class="btn btn-sm" id="lg-again" style="margin-top:8px">${icon('refresh', 16)}ลองเข้าสู่ระบบอีกครั้ง</button>`;
          $('#lg-again').addEventListener('click', submit);
          return;
        }
        st.pin = '';
        dots();
        const d = $('#lg-dots');
        if (d) { d.classList.remove('err'); void d.offsetWidth; d.classList.add('err'); }
        box.textContent = e.message;
      }
    }
    const onKey = (e) => {
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      if (/^\d$/.test(e.key)) key(e.key);
      else if (e.key === 'Backspace') key('back');
    };
    document.addEventListener('keydown', onKey);
    App.onLeave(() => document.removeEventListener('keydown', onKey));
    draw();
  };

  /* ====================== เส้นทางหน้า ====================== */
  const ROUTES = [
    [/^#\/admin$/, 'admin', 'dashboard'],
    [/^#\/admin\/jobs$/, 'admin', 'jobs'],
    [/^#\/admin\/jobs\/new$/, 'admin', 'jobEdit'],
    [/^#\/admin\/jobs\/([\w-]+)\/edit$/, 'admin', 'jobEdit'],
    [/^#\/admin\/jobs\/([\w-]+)$/, 'admin', 'jobDetail'],
    [/^#\/admin\/drivers$/, 'admin', 'drivers'],
    [/^#\/admin\/vehicles$/, 'admin', 'vehicles'],
    [/^#\/admin\/settings$/, 'admin', 'settings'],
    [/^#\/driver$/, 'driver', 'driverHome'],
    [/^#\/driver\/check$/, 'driver', 'driverCheck'],
    [/^#\/driver\/me$/, 'driver', 'driverMe'],
    [/^#\/driver\/job\/([\w-]+)$/, 'driver', 'driverJob']
  ];

  function route() {
    App.gen++;
    document.documentElement.classList.remove('modal-open');
    leaveFns.forEach((f) => { try { f(); } catch (e) { /* ไม่เป็นไร */ } });
    leaveFns = [];
    document.querySelectorAll('.modal-bg').forEach((m) => m.remove());
    const [path, qs] = (location.hash || '#/').split('?');
    const query = new URLSearchParams(qs || '');
    window.scrollTo(0, 0);

    if (!API.ready()) { if (path !== '#/setup') { location.replace('#/setup'); return; } return V.setup(); }
    if (path === '#/setup') return API.lockedUrl() ? location.replace('#/login') : V.setup();
    const s = API.session();
    if (!s) { if (path !== '#/login') { location.replace('#/login'); return; } return V.login(); }
    const home = s.role === 'admin' ? '#/admin' : '#/driver';
    if (path === '#/login' || path === '#/' || path === '#') { location.replace(home); return; }
    for (const [re, role, view] of ROUTES) {
      const m = path.match(re);
      if (!m) continue;
      if (role !== s.role) { location.replace(home); return; }
      document.title = (s.company ? s.company + ' · ' : '') + 'Smart Tracking Jobs';
      return V[view](m.slice(1), query);
    }
    location.replace(home);
  }

  window.addEventListener('hashchange', route);
  window.addEventListener('error', (e) => console.error(e.error || e.message));
  route();

  /* ====================== แจ้งเมื่อมีเวอร์ชันใหม่ ======================
     แอปเป็นหน้าเดียว ถ้าเปิดค้างไว้จะไม่โหลดไฟล์ใหม่เอง → เช็คไฟล์ล่าสุดเป็นระยะ ถ้าต่างจากที่เปิดอยู่ ขึ้นแถบให้แตะอัปเดต */
  const BUILD = window.STJ_BUILD || '';
  let lastCheck = 0, shown = false;
  async function checkUpdate() {
    if (!BUILD || shown || !/^https?:/.test(location.protocol) || Date.now() - lastCheck < 60000) return;
    lastCheck = Date.now();
    try {
      const r = await fetch(location.pathname + '?vcheck=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const m = (await r.text()).match(/<meta name="stj-build" content="([^"]+)"/);
      if (m && m[1] && m[1] !== BUILD) showUpdate(m[1]);
    } catch (e) { /* ออฟไลน์ ไว้เช็ครอบหน้า */ }
  }
  function showUpdate(next) {
    shown = true;
    const bar = document.createElement('button');
    bar.type = 'button';
    bar.className = 'update-bar';
    bar.innerHTML = `${icon('refresh', 18)}<span><b>มีเวอร์ชันใหม่</b> · แตะเพื่ออัปเดต</span>`;
    bar.addEventListener('click', () => {
      if (document.querySelector('.modal-bg') && !confirm('มีหน้าต่างที่กำลังกรอกอยู่ — อัปเดตเลยไหม? (ข้อมูลที่ยังไม่บันทึกจะหายไป)')) return;
      const p = new URLSearchParams(location.search);
      p.set('v', next);
      location.replace(location.pathname + '?' + p.toString() + location.hash);
    });
    document.body.appendChild(bar);
  }
  setTimeout(checkUpdate, 8000);
  setInterval(checkUpdate, 5 * 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

  if (CONFIG.SERVICE_WORKER && 'serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* ไม่บังคับ */ });
  }
})();

</script>
