<!-- Smart Tracking Jobs v1.4.0 · ไฟล์นี้สร้างจาก src/ ด้วย dev/build.mjs -->
<style>
/* Smart Tracking Jobs — สไตล์หลัก */
:root {
  --brand: #0E6BA8;
  --brand-dark: #0A4F7D;
  --brand-soft: #E1EFF8;
  --navy: #0B1F33;
  --navy-2: #23415F;
  --ink: #0B1F33;
  --ink-2: #3D4752;
  --muted: #4E5D6C;
  --line: #E1E6EC;
  --line-2: #CBD3DC;
  --bg: #F4F6F9;
  --card: #FFFFFF;
  --good: #2B7A3B;
  --good-soft: #E6F4EA;
  --good-ink: #1F5E2C;
  --warn: #B45309;
  --warn-soft: #FFF1E6;
  --warn-ink: #9A3B07;
  --bad: #B42318;
  --bad-soft: #FDECEC;
  --bad-ink: #9B2222;
  --radius: 14px;
  --font: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: clip; }
/* แตะครั้งเดียวทำงานทันที (ไม่รอดูว่าจะแตะสองครั้งเพื่อซูมหรือไม่) */
a, button, input, select, textarea, label, summary, [role="button"] { touch-action: manipulation; }
html.modal-open, html.modal-open body { overflow: hidden; }
a { color: var(--brand); }
a:hover { color: var(--brand-dark); }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
h1, h2, h3 { margin: 0; line-height: 1.3; }
.mono { font-family: var(--mono); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- โหลด ---------- */
.boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
.spinner.sm { width: 16px; height: 16px; border-width: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-block { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 48px 16px; color: var(--muted); }

/* ---------- หัวเว็บแอดมิน ---------- */
.demo-bar { background: #FFF7D6; color: #6B4E00; font-size: 13px; padding: 7px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; text-align: center; }
.demo-bar button { background: none; border: 0; color: #6B4E00; text-decoration: underline; cursor: pointer; padding: 4px; font-size: 13px; }
.topbar { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 900; }
.topbar-in { max-width: 1360px; margin: 0 auto; padding: 0 20px; min-height: 64px; display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; min-width: 0; }
.brand:hover { color: #fff; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); display: flex; align-items: center; justify-content: center; flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-text b { font-size: 16px; white-space: nowrap; }
.brand-text span { font-size: 12px; color: #A9B8C8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.nav { display: flex; gap: 4px; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { color: #C9D5E2; text-decoration: none; padding: 9px 14px; border-radius: 9px; white-space: nowrap; display: flex; align-items: center; gap: 7px; font-weight: 500; }
.nav a:hover { color: #fff; background: rgba(255,255,255,.06); }
.nav a.on { color: #fff; background: rgba(255,255,255,.13); font-weight: 600; }
.top-user { display: flex; align-items: center; gap: 10px; flex: none; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--navy-2); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; flex: none; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 0; background: transparent; color: inherit; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: rgba(127,127,127,.12); }
.topbar .icon-btn { color: #C9D5E2; }
@media (max-width: 760px) {
  .topbar-in { flex-wrap: wrap; padding: 8px 12px 0; gap: 8px 12px; min-height: 0; }
  .brand { flex: 1 1 auto; }
  .nav { order: 3; flex-basis: 100%; padding-bottom: 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
  .nav a { padding: 6px 2px; font-size: 12px; flex-direction: column; gap: 2px; justify-content: center; text-align: center; }
  .top-user .who { display: none; }
}

/* ---------- เนื้อหา ---------- */
.page { max-width: 1360px; margin: 0 auto; padding: 26px 20px 60px; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.page-head h1 { font-size: 27px; font-weight: 700; }
.page-head .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.back { font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 4px; min-height: 32px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
@media (max-width: 760px) { .page { padding: 18px 12px 48px; gap: 16px; } .page-head h1 { font-size: 23px; } }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.card-pad { padding: 20px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 17px; }
.card h2.title { font-size: 18px; margin-bottom: 14px; }
.split { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.split > .main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.split > .side { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.split.stretch { align-items: stretch; }

/* ---------- ปุ่ม ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line-2); background: #fff; color: var(--ink); font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: #F7F9FB; color: var(--ink); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
.btn-dark { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn-dark:hover { background: #142f4b; color: #fff; }
.btn-good { background: var(--good); border-color: var(--good); color: #fff; }
.btn-good:hover { background: #22652F; color: #fff; }
.btn-danger { color: var(--bad); border-color: #F3C7C7; }
.btn-danger:hover { background: var(--bad-soft); color: var(--bad); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn-lg { min-height: 56px; font-size: 17px; border-radius: 14px; padding: 0 22px; }
.btn-block { width: 100%; }
.btn .spinner { border-color: rgba(255,255,255,.35); border-top-color: #fff; }
.btn:not(.btn-primary):not(.btn-dark):not(.btn-good) .spinner { border-color: var(--line); border-top-color: var(--brand); }
.sq { width: 44px; padding: 0; flex: none; }

/* ---------- ฟอร์ม ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .field > label { font-size: 14px; font-weight: 600; }
.field .hint { font-size: 13px; color: var(--muted); font-weight: 400; }
.input, select.input, textarea.input { width: 100%; padding: 10px 12px; min-height: 46px; border: 1px solid var(--line-2); border-radius: 10px; background: #fff; font-weight: 400; font-size: 16px; }
/* iPhone จะซูมเข้าเองถ้าตัวอักษรในช่องกรอกเล็กกว่า 16px — จึงใช้ 16px ทุกช่อง */
textarea.input { min-height: 80px; resize: vertical; }
.input:focus, .btn:focus-visible, .icon-btn:focus-visible, a:focus-visible { outline: 3px solid rgba(14,107,168,.35); outline-offset: 1px; border-color: var(--brand); }
.input.sm { min-height: 40px; padding: 6px 10px; font-size: 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 900px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; }
.check input { width: 18px; height: 18px; }

/* ---------- ตัวเลขสรุป ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.tile { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.tile .k { color: var(--muted); font-size: 14px; }
.tile .v { font-size: 32px; font-weight: 700; line-height: 1.05; }
.tile.blue .v { color: var(--brand); }
.tile.green .v { color: var(--good); }
.tile.orange { background: var(--warn-soft); border-color: #F7D2B5; }
.tile.orange .k { color: var(--warn-ink); }
.tile.orange .v { color: var(--warn); }

/* ---------- สถานะ ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: #EEF1F4; color: var(--ink-2); }
.chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
.st-pending { background: #EEF1F4; color: #3D4752; }
.st-in_progress { background: var(--brand-soft); color: var(--brand-dark); }
.st-done { background: var(--good-soft); color: var(--good-ink); }
.st-cancelled { background: var(--bad-soft); color: var(--bad-ink); }
.st-arrived { background: var(--good-soft); color: var(--good-ink); }
.chip.plain::before { display: none; }

.banner { border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; }
.banner.warn { background: var(--warn-soft); color: var(--warn-ink); border: 1px solid #F7D2B5; }
.banner.info { background: var(--brand-soft); color: var(--brand-dark); }
.banner.bad { background: var(--bad-soft); color: var(--bad-ink); border: 1px solid #F3C7C7; }
.banner.good { background: var(--good-soft); color: var(--good-ink); }
.banner a { color: inherit; font-weight: 600; }

.progress { height: 8px; background: #E8EDF1; border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
.progress.done > i { background: var(--good); }

/* ---------- ตาราง ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
.tbl th { text-align: left; color: var(--muted); font-size: 13px; font-weight: 600; background: #F8FAFB; padding: 11px 14px; white-space: nowrap; }
.tbl td { padding: 13px 14px; border-top: 1px solid #EEF1F4; vertical-align: middle; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: #F8FAFB; }
.tbl th:first-child, .tbl td:first-child { padding-left: 20px; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty svg { color: #AEB9C5; }

/* ---------- แผนที่ ---------- */
.map { height: 500px; background: #E8EDF1; position: relative; z-index: 0; }
.map.sm { height: 320px; }
.map.xs { height: 240px; }
@media (max-width: 760px) { .map { height: 360px; } }
.map-card { overflow: hidden; display: flex; flex-direction: column; }
.map-note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 500; background: rgba(255,255,255,.94); padding: 10px 16px; border-radius: 10px; font-size: 14px; color: var(--muted); text-align: center; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.pin { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--ink); border: 3px solid var(--brand); display: flex; align-items: center; justify-content: center; font: 700 13px var(--font); box-shadow: 0 2px 6px rgba(11,31,51,.3); }
.pin.done { background: var(--good); border-color: #fff; color: #fff; box-shadow: 0 0 0 2px var(--good), 0 2px 6px rgba(11,31,51,.3); }
.pin.next { background: var(--brand); color: #fff; border-color: #fff; box-shadow: 0 0 0 2px var(--brand), 0 0 0 7px rgba(14,107,168,.22); }
.pin-cam { width: 14px; height: 14px; border-radius: 50%; background: #7C3AED; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.leaflet-popup-content { font-family: var(--font); font-size: 14px; margin: 12px 14px; min-width: 180px; }
.leaflet-popup-content img { border-radius: 8px; margin-top: 8px; width: 220px; max-height: 165px; object-fit: cover; }
.leaflet-container { font-family: var(--font); }

/* ---------- รายการ Job ---------- */
.job-list { display: flex; flex-direction: column; gap: 4px; padding: 8px; }
.job-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px; padding: 10px 12px; min-height: 58px; cursor: pointer; }
.job-row:hover { background: #F4F6F9; }
.job-row.on { background: #EAF2F8; }
.job-row .grow { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.job-row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-row .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kv > div { background: #F4F6F9; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kv .k { font-size: 12px; color: var(--muted); }
.kv .v { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.info-row { display: flex; flex-direction: column; gap: 2px; }
.info-row .k { font-size: 13px; color: var(--muted); }
.info-row .v { font-weight: 600; }

/* ---------- จุดแวะ (ฟอร์ม) ---------- */
.stop-edit { display: flex; gap: 14px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 14px; flex-wrap: wrap; background: #fff; }
.stop-edit.locked { background: #F7FBF8; border-color: #CBE6D2; }
.num { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
.num.done { background: var(--good); }
.num.idle { background: #fff; color: var(--muted); border: 2px solid var(--line-2); }
.stop-edit .body { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.stop-edit .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.stop-edit .tools { display: flex; gap: 6px; flex: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: #EEF1F4; color: var(--ink-2); }
.tag.good { background: var(--good-soft); color: var(--good-ink); }
.tag.warn { background: var(--warn-soft); color: var(--warn-ink); }
.add-box { border: 1px dashed #AEB9C5; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; gap: 4px; background: #EEF1F4; padding: 4px; border-radius: 11px; flex-wrap: wrap; }
.tabs button { flex: 1 1 auto; border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; min-height: 40px; }
.tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(11,31,51,.12); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > .grow { flex: 1 1 240px; min-width: 0; }
.result { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.result .grow { flex: 1 1 auto; min-width: 0; }
.result .t { font-weight: 600; }
.result .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.embed { width: 100%; height: 220px; border: 0; border-radius: 10px; background: #E8EDF1; }

/* ---------- ไทม์ไลน์จุดแวะ ---------- */
.timeline { display: flex; flex-direction: column; }
.tl-item { display: flex; gap: 14px; position: relative; padding-bottom: 18px; }
.tl-item:not(:last-child)::before { content: ''; position: absolute; left: 15px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
.tl-item.done:not(:last-child)::before { background: #B8DCC2; }
.tl-item .body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tl-item .name { font-weight: 600; font-size: 16px; }
.tl-photo { display: flex; gap: 12px; align-items: flex-start; margin-top: 6px; flex-wrap: wrap; }
.tl-photo button { padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 10px; overflow: hidden; flex: none; }
.tl-photo img { width: 148px; height: 111px; object-fit: cover; background: #E8EDF1; }

/* ---------- ฝั่งคนขับ ---------- */
.phone { max-width: 560px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }
.d-head { background: var(--navy); color: #fff; padding: calc(18px + env(safe-area-inset-top)) 16px 18px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 0; z-index: 900; }
.d-head .row1 { display: flex; align-items: center; gap: 8px; }
.d-head h1 { font-size: 22px; font-weight: 700; }
.d-head .sub { font-size: 14px; color: #C9D5E2; }
.d-head .icon-btn { color: #fff; background: rgba(255,255,255,.08); }
.d-head .icon-btn:hover { background: rgba(255,255,255,.16); }
.d-body { flex: 1 1 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
.d-sec { font-size: 14px; font-weight: 600; color: var(--muted); margin-top: 6px; }
.d-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.d-card.active { border: 2px solid var(--brand); }
.d-card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.d-card .title { font-size: 18px; font-weight: 700; line-height: 1.35; }
.cur-stop { background: #fff; border: 2px solid var(--brand); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.cur-stop .name { font-size: 22px; font-weight: 700; line-height: 1.3; }
.cur-stop .addr { font-size: 15px; color: var(--muted); }
.big-check { min-height: 64px; font-size: 19px; border-radius: 16px; }
.step-list { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.step { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; }
.step + .step { border-top: 1px solid #F0F2F5; }
.step .grow { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.done-card { background: #fff; border: 2px solid var(--good); border-radius: 18px; padding: 26px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.done-ico { width: 68px; height: 68px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: flex; align-items: center; justify-content: center; }

/* ---------- เข้าสู่ระบบ ---------- */
.auth { min-height: 100vh; background: var(--navy); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.auth-card { width: 100%; max-width: 440px; background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.auth-top { padding: 28px 26px 18px; display: flex; flex-direction: column; gap: 14px; }
.auth-top .brand-mark { width: 52px; height: 52px; border-radius: 14px; }
.auth-top h1 { font-size: 24px; }
.auth-body { padding: 4px 26px 28px; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 480px) {
  .auth { padding: 0; align-items: stretch; }
  .auth-card { border-radius: 0; max-width: none; display: flex; flex-direction: column; }
  .auth-top { background: var(--navy); color: #fff; padding: calc(40px + env(safe-area-inset-top)) 24px 30px; }
  .auth-top .muted { color: #C9D5E2; }
  .auth-body { flex: 1 1 auto; border-radius: 22px 22px 0 0; margin-top: -16px; background: #fff; padding-top: 24px; }
}
.name-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-height: 340px; overflow-y: auto; }
.name-btn { min-height: 56px; border: 1px solid var(--line-2); border-radius: 12px; background: #fff; font-weight: 600; font-size: 16px; cursor: pointer; padding: 8px 10px; display: flex; align-items: center; gap: 10px; text-align: left; }
.name-btn:hover { border-color: var(--brand); background: #F5FAFD; }
.name-btn .avatar { background: var(--brand-soft); color: var(--brand-dark); width: 32px; height: 32px; font-size: 14px; }
.pin-dots { display: flex; justify-content: center; gap: 14px; padding: 6px 0; }
.pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-2); }
.pin-dots i.on { background: var(--navy); border-color: var(--navy); }
.pin-dots.err { animation: shake .35s; }
.pin-dots.err i { border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.keypad button { min-height: 60px; border-radius: 14px; border: 0; background: #F0F3F6; font-size: 24px; font-weight: 600; cursor: pointer; }
.keypad button:hover { background: #E4E9EE; }
.keypad button:active { background: #D6DDE4; }
.keypad button.fn { background: transparent; font-size: 15px; color: var(--muted); }
.keypad.busy { opacity: .45; pointer-events: none; }
.who-chip { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #F4F6F9; border-radius: 12px; padding: 8px 8px 8px 14px; }

/* ---------- หน้าต่างลอย ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(11,31,51,.55); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .15s; }
.modal { background: #fff; border-radius: 18px; width: 100%; max-width: 520px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: hidden; display: flex; flex-direction: column; }
.modal.wide { max-width: 860px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 12px 8px 18px; flex: none; }
.modal-head h3 { font-size: 19px; min-width: 0; overflow-wrap: anywhere; }
.modal-body { padding: 8px 18px 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; flex: 1 1 auto; min-height: 0; }
.modal-foot { padding: 12px 18px 16px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; flex: none; border-top: 1px solid var(--line); background: #fff; }
@media (max-width: 560px) {
  .modal-bg { align-items: flex-end; padding: 0; }
  .modal { border-radius: 20px 20px 0 0; max-width: none; max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); }
  .modal.full { border-radius: 0; height: 100vh; height: 100dvh; max-height: none; padding-top: env(safe-area-inset-top); }
  .modal-body { padding: 6px 16px 16px; }
  .modal-foot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
  .modal-foot .btn { flex: 1 1 0; min-height: 50px; font-size: 16px; }
}
@keyframes fade { from { opacity: 0; } }
.photo-preview { width: 100%; max-height: 52vh; object-fit: contain; background: #0B1F33; border-radius: 12px; }

/* ---------- แจ้งเตือน ---------- */
body:has(.d-nav) #toasts { bottom: calc(96px + env(safe-area-inset-bottom)); }
#toasts { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 3000; display: flex; flex-direction: column; gap: 8px; align-items: center; width: calc(100% - 32px); max-width: 460px; pointer-events: none; }
.toast { background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: up .2s; pointer-events: auto; max-width: 100%; }
.toast.bad { background: var(--bad); }
.toast.good { background: var(--good); }
@keyframes up { from { transform: translateY(10px); opacity: 0; } }

/* ---------- ตั้งค่า ---------- */
.setting-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; align-items: start; }
.copy-box { display: flex; gap: 8px; }
.copy-box .input { font-family: var(--mono); font-size: 13px; }
.steps-mini { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); font-size: 14px; }

/* ---------- ปรับแต่งเพิ่มเติม ---------- */
.map-card > .map { flex: 1 1 auto; min-height: 500px; }
.map-card > .map.sm { min-height: 320px; }
.map-card > .map.xs { min-height: 240px; }
@media (max-width: 760px) { .map-card > .map { min-height: 360px; } }
.g2.keep { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
@media (min-width: 1000px) { .side.sticky { position: sticky; top: 84px; } }
img.img-broken { object-fit: contain !important; background: #EEF1F4; }
.tbl td.mono { white-space: nowrap; }

/* ---------- เช็คอิน: ตำแหน่งและรูปหลายรูป ---------- */
.geo-box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
.geo-box > span { flex: 1 1 200px; min-width: 0; }
.geo-box svg { flex: none; }
.geo-box.wait { background: #EEF1F4; color: var(--ink-2); }
.geo-box.good { background: var(--good-soft); color: var(--good-ink); border: 1px solid #CBE6D2; }
.geo-box.bad { background: var(--bad-soft); color: var(--bad-ink); border: 1px solid #F3C7C7; }
.geo-box.info { background: var(--brand-soft); color: var(--brand-dark); }
.geo-box a { color: inherit; font-weight: 600; }
.geo-box .muted { color: inherit; opacity: .75; }
.mini-map { height: 170px; border-radius: 12px; overflow: hidden; background: #E8EDF1; z-index: 0; position: relative; }
.ph-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ph { position: relative; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; background: #0B1F33; display: flex; align-items: center; justify-content: center; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph.loading { background: #EEF1F4; }
.ph-del { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(11,31,51,.72); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }

.veh-img { border-radius: 10px; object-fit: cover; flex: none; background: #EEF1F4; display: flex; align-items: center; justify-content: center; color: #8A96A3; }

.veh-card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
.veh-card.off { opacity: .6; }
.veh-card .pic { aspect-ratio: 16 / 10; background: #EEF1F4; display: flex; align-items: center; justify-content: center; color: #8A96A3; }
.veh-card .pic img { width: 100%; height: 100%; object-fit: cover; }
.veh-card .info { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; }
.veh-card .plate { font-size: 18px; font-weight: 700; }
.veh-card .tools { display: flex; gap: 6px; padding: 0 14px 14px; flex-wrap: wrap; }
.photo-field { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.photo-field .prev { width: 88px; height: 88px; border-radius: 12px; overflow: hidden; background: #EEF1F4; display: flex; align-items: center; justify-content: center; color: #8A96A3; flex: none; }
.photo-field .prev.round { border-radius: 50%; }
.photo-field .prev img { width: 100%; height: 100%; object-fit: cover; }
.pick-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #F4F6F9; min-height: 64px; }
.pick-card .t { font-weight: 600; }
.pick-card .s { font-size: 13px; color: var(--muted); }
.name-btn .avatar-img { width: 32px; height: 32px; }

/* ====================== v1.3: มือถือใช้ง่ายขึ้น ====================== */
.link-btn { border: 0; background: none; color: var(--brand); font-weight: 600; font-size: 13px; padding: 4px 2px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; }
.link-btn:hover { color: var(--brand-dark); text-decoration: underline; }
.src-ico { width: 32px; height: 32px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-dark); display: flex; align-items: center; justify-content: center; flex: none; }

.switch-row { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.switch-row input { width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: var(--brand); }
.switch-row > span { display: flex; flex-direction: column; gap: 2px; }
.switch-row .hint { font-size: 13px; color: var(--muted); }
.pick-map { height: 58vh; min-height: 280px; border-radius: 12px; overflow: hidden; background: #E8EDF1; position: relative; z-index: 0; }
.modal.full .pick-map { flex: 1 1 auto; height: auto; }
.car-pin { display: inline-flex; align-items: center; gap: 5px; background: var(--navy); color: #fff; border: 2px solid #fff; border-radius: 999px; padding: 3px 9px 3px 6px; font: 600 12px var(--font); white-space: nowrap; box-shadow: 0 2px 8px rgba(11,31,51,.4); transform: translate(-4px, -4px); }
.car-pin.stale { background: #6B7785; }

.crew-card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: #fff; }
.crew-card.on { border: 2px solid var(--brand); }
.crew-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.crew-photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.crew-photos button, .ck-photos.done button { position: relative; padding: 0; border: 0; border-radius: 10px; overflow: hidden; cursor: zoom-in; aspect-ratio: 4 / 3; background: #E8EDF1; }
.crew-photos img, .ck-photos.done img { width: 100%; height: 100%; object-fit: cover; }
.crew-photos span, .ck-photos.done span { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(11,31,51,.66); color: #fff; font-size: 11px; padding: 2px 6px; text-align: left; }
.crew-loc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.crew-loc > span { flex: 1 1 160px; min-width: 0; }
.only-m { display: none; }

}

.gps-pill { display: inline-flex; align-items: center; gap: 6px; border: 2px solid rgba(255,255,255,.75); color: #fff; border-radius: 999px; padding: 4px 11px; font-weight: 700; font-size: 13px; text-decoration: none; flex: none; min-height: 34px; }

.gps-pill.off { opacity: .6; }
@keyframes blink { 50% { opacity: .3; } }
.d-nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); width: calc(100% - 24px); max-width: 536px; background: var(--navy); border-radius: 24px; padding: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; z-index: 950; box-shadow: 0 10px 30px rgba(11,31,51,.3); }
.d-nav a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; border-radius: 19px; color: #C9D5E2; text-decoration: none; font-weight: 600; font-size: 13px; }
.d-nav a:hover { color: #fff; }
.d-nav a.on { background: #CFE8F7; color: var(--navy); }
.d-nav a.alert::after { content: ''; position: absolute; top: 8px; right: calc(50% - 20px); width: 10px; height: 10px; border-radius: 50%; background: #F87171; border: 2px solid var(--navy); }
.d-nav a.on.alert::after { border-color: #CFE8F7; }
.tl2-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 4px; }
.tl2-head h2 { font-size: 21px; font-weight: 700; }
.tl2-head span { color: var(--muted); font-size: 14px; }
.tl2 { display: flex; flex-direction: column; }
.tl2-item { display: grid; grid-template-columns: 52px 30px minmax(0, 1fr) 18px; gap: 0 10px; color: var(--ink); text-decoration: none; position: relative; padding: 4px 0 20px; border-radius: 14px; }
.tl2-item:hover { color: var(--ink); }
@media (hover: hover) { .tl2-item:not(.now):hover .tl2-title { color: var(--brand); } }
.tl2-item:not(:last-child)::before { content: ''; position: absolute; left: 76px; top: 36px; bottom: -4px; width: 2px; background: var(--line-2); }
.tl2-item.done:not(:last-child)::before { background: #9CCFAA; }
.tl2-time { font-size: 17px; font-weight: 600; color: var(--ink-2); padding-top: 4px; font-variant-numeric: tabular-nums; }
.tl2-dot { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line-2); background: #fff; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 2px; z-index: 1; }
.tl2-item.done .tl2-dot { background: var(--good); border-color: var(--good); }
.tl2-item.now .tl2-dot { border-color: var(--brand); box-shadow: 0 0 0 5px rgba(14,107,168,.18); background: var(--brand); }
.tl2-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tl2-item.now .tl2-body { background: #fff; border: 2px solid var(--brand); border-radius: 14px; padding: 10px 12px; margin: -6px 0 0; }
.tl2-st { font-size: 13px; font-weight: 700; color: var(--muted); }
.tl2-item.done .tl2-st { color: var(--good-ink); }
.tl2-item.now .tl2-st { color: var(--brand); }
.tl2-title { font-size: 18px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.tl2-item.done .tl2-title { color: var(--ink-2); }
.tl2-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.tl2-go { color: #AEB9C5; padding-top: 6px; }
.ready-banner { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--warn-soft); border: 1px solid #F7D2B5; color: var(--warn-ink); text-decoration: none; }
.ready-banner:hover { color: var(--warn-ink); }
.ready-banner > span:nth-child(2) { flex: 1 1 auto; display: flex; flex-direction: column; font-size: 13px; }
.ready-banner b { font-size: 15px; }
.ready-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 10px 8px 2px; }
.ready-head h2 { font-size: 22px; font-weight: 700; }
.ready-head p { margin: 0; color: var(--muted); font-size: 14px; }
.ready-ico { width: 60px; height: 60px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; }

.ready-info { display: flex; flex-direction: column; gap: 10px; }

.ri-row { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 10px; }
.ri-row > span { font-size: 14px; color: var(--muted); }
.ri-row > b { font-size: 17px; }
.ck-photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ck-slot { position: relative; aspect-ratio: 1 / 1.05; border-radius: 16px; border: 2px dashed #AEB9C5; background: #F7F9FB; color: var(--brand-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; overflow: hidden; text-align: center; padding: 6px; }
.ck-slot:first-child:not(.has) { border-style: solid; border-color: var(--brand); background: var(--brand-soft); }
.ck-slot .lb { font-size: 13px; font-weight: 600; line-height: 1.25; }
.ck-slot.has { border: 0; padding: 0; background: var(--navy); }
.ck-slot.has img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ck-slot.has .lb { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(11,31,51,.7); color: #fff; padding: 4px 6px; font-size: 12px; }
.ck-slot .re { position: absolute; top: 6px; right: 6px; background: rgba(11,31,51,.72); color: #fff; border-radius: 999px; font-size: 11px; padding: 3px 8px; display: inline-flex; gap: 3px; align-items: center; }
.ck-list { display: flex; flex-direction: column; gap: 8px; }
.ck-item { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border: 1px solid var(--line-2); border-radius: 14px; cursor: pointer; font-size: 16px; background: #fff; }
.ck-item input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ck-item .box { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line-2); display: flex; align-items: center; justify-content: center; color: transparent; flex: none; }
.ck-item input:checked + .box { background: var(--good); border-color: var(--good); color: #fff; }
.ck-item:has(input:checked) { border-color: #9CCFAA; background: #F7FBF8; }
.ck-item input:focus-visible + .box { outline: 3px solid rgba(14,107,168,.35); outline-offset: 2px; }
.ready-done { background: #fff; border: 2px solid var(--good); border-radius: 18px; padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.ck-photos.done { width: 100%; }
.gps-card { display: flex; flex-direction: column; gap: 10px; }
.gps-row { display: flex; align-items: center; gap: 12px; }
.gps-ico { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; background: #EEF1F4; color: var(--muted); }
.gps-ico.good { background: var(--good-soft); color: var(--good); }
.gps-ico.bad { background: var(--bad-soft); color: var(--bad); }
.me-card { display: flex; align-items: center; gap: 16px; }
@media (max-width: 380px) {
  .tl2-item { grid-template-columns: 46px 26px minmax(0, 1fr) 12px; gap: 0 8px; }
  .tl2-item:not(:last-child)::before { left: 66px; }
  .tl2-dot { width: 26px; height: 26px; }
  .tl2-time { font-size: 15px; }
  .ri-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}

<script>/* ---- assets/ui.js ---- */
/* ตัวช่วยหน้าจอ: รูปแบบวันที่ ไอคอน ปุ่ม หน้าต่าง แผนที่ */
(function () {
  'use strict';
  const CONFIG = window.STJ_CONFIG || {};
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = (s) => String(s === null || s === undefined ? '' : s)
    .replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- วันเวลา (เวลาไทย) ---------- */
  const MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const DAYS = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
  function bkkNow() {
    const t = new Date(Date.now() + 7 * 3600000);
    const p = (n) => String(n).padStart(2, '0');
    return {
      date: `${t.getUTCFullYear()}-${p(t.getUTCMonth() + 1)}-${p(t.getUTCDate())}`,
      time: `${p(t.getUTCHours())}:${p(t.getUTCMinutes())}`,
      stamp: `${t.getUTCFullYear()}-${p(t.getUTCMonth() + 1)}-${p(t.getUTCDate())} ${p(t.getUTCHours())}:${p(t.getUTCMinutes())}:${p(t.getUTCSeconds())}`
    };
  }
  const today = () => bkkNow().date;
  function addDays(date, n) {
    const d = new Date(date + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function fmtDate(date, opts) {
    if (!date) return '-';
    const d = new Date(String(date).slice(0, 10) + 'T00:00:00Z');
    if (isNaN(d)) return String(date);
    const y = d.getUTCFullYear() + 543;
    const s = `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${opts && opts.short ? String(y).slice(2) : y}`;
    return opts && opts.noDay ? s : `${DAYS[d.getUTCDay()]} ${s}`;
  }
  function relDay(date) {
    const t = today();
    if (date === t) return 'วันนี้';
    if (date === addDays(t, 1)) return 'พรุ่งนี้';
    if (date === addDays(t, -1)) return 'เมื่อวาน';
    return fmtDate(date);
  }
  const hhmm = (ts) => (ts ? String(ts).slice(11, 16) : '');
  function fmtStamp(ts) {
    if (!ts) return '-';
    const d = String(ts).slice(0, 10);
    return (d === today() ? 'วันนี้' : fmtDate(d, { noDay: true, short: true })) + ' ' + hhmm(ts);
  }
  function minutesDiff(planned, stamp) {
    if (!planned || !stamp) return null;
    const [ph, pm] = planned.split(':').map(Number);
    const [ah, am] = hhmm(stamp).split(':').map(Number);
    return (ah * 60 + am) - (ph * 60 + pm);
  }

  /* เวลาที่ผ่านมาจากเวลาไทยแบบ "YYYY-MM-DD HH:MM:SS" */
  function stampMs(ts) { const t = Date.parse(String(ts || '').replace(' ', 'T') + '+07:00'); return isNaN(t) ? null : t; }
  function timeAgo(ts) {
    const t = stampMs(ts);
    if (t === null) return '';
    const m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return 'เมื่อสักครู่';
    if (m < 60) return `${m} นาทีที่แล้ว`;
    const h = Math.floor(m / 60);
    return h < 24 ? `${h} ชม. ${m % 60 ? (m % 60) + ' นาที' : ''}ที่แล้ว`.replace('  ', ' ') : fmtStamp(ts);
  }

  function fmtMin(m) {
    const h = Math.floor(m / 60), r = m % 60;
    return h ? `${h} ชม.${r ? ' ' + r + ' นาที' : ''}` : `${m} นาที`;
  }
  // รูปที่โหลดไม่ได้ (เช่น ไฟล์ใน Drive ถูกจำกัดสิทธิ์) แสดงเป็นภาพแทน
  document.addEventListener('error', (e) => {
    const img = e.target;
    if (!img || img.tagName !== 'IMG' || img.classList.contains('img-broken') || img.classList.contains('leaflet-tile')) return;
    img.classList.add('img-broken');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120"><rect width="160" height="120" fill="#EEF1F4"/><g fill="none" stroke="#8A96A3" stroke-width="4" stroke-linejoin="round"><path d="M50 48h12l6-9h24l6 9h12v34H50z"/><circle cx="80" cy="64" r="10"/></g><text x="80" y="104" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#4E5D6C">แตะเพื่อเปิดรูป</text></svg>');
  }, true);

  /* ---------- สถานะ ---------- */
  const STATUS = {
    pending: 'รอเริ่ม', in_progress: 'กำลังทำ', done: 'เสร็จสิ้น', cancelled: 'ยกเลิก', arrived: 'เช็คอินแล้ว'
  };
  const chip = (st) => `<span class="chip st-${esc(st)}">${esc(STATUS[st] || st)}</span>`;
  function jobTitle(j) {
    if (j.title) return j.title;
    const s = j.stops || [];
    if (!s.length) return 'Job ' + j.job_no;
    return s.length === 1 ? s[0].name : `${s[0].name} → ${s[s.length - 1].name}`;
  }
  const nextStop = (j) => (j.stops || []).find((s) => s.status !== 'arrived') || null;

  function icon(name, size, extra) {
    return `<svg width="${size || 20}" height="${size || 20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra || ''}>${P[name] || ''}</svg>`;
  }
  const brandMark = (size) => (window.STJ_ICON
    ? `<span class="brand-mark logo"><img src="${window.STJ_ICON}" alt=""></span>`
    : `<span class="brand-mark">${icon('pin', size || 19, 'stroke="#fff"')}</span>`);

  /* ---------- แจ้งเตือนและปุ่ม ---------- */
  function toast(msg, type) {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, type === 'bad' ? 4200 : 2600);
    setTimeout(() => el.remove(), type === 'bad' ? 4600 : 3000);
  }
  function busy(btn, on, text) {
    if (!btn) return;
    if (on) {
      btn.dataset.html = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner sm"></span>${esc(text || 'กำลังบันทึก…')}`;
    } else {
      btn.disabled = false;
      if (btn.dataset.html) btn.innerHTML = btn.dataset.html;
    }
  }

  function modal({ title, body, foot, wide, full, onClose }) {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''} ${full ? 'full' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title || '')}">
      <div class="modal-head"><h3>${esc(title || '')}</h3><button type="button" class="icon-btn" data-close aria-label="ปิด">${icon('x')}</button></div>
      <div class="modal-body">${body || ''}</div>
      ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
    </div>`;
    const prevFocus = document.activeElement;
    function close() {
      bg.remove();
      if (!document.querySelector('.modal-bg')) document.documentElement.classList.remove('modal-open');

  function confirmBox(message, okText, danger) {

        onClose: () => { if (!done) resolve(false); }

      m.el.querySelector('[data-ok]').addEventListener('click', () => { done = true; m.close(); resolve(true); });
    });
  }

  /* ---------- ลิงก์ Google Maps ---------- */
  const hasXY = (s) => s && s.lat !== null && s.lat !== undefined && s.lng !== null && s.lng !== undefined && s.lat !== '' && s.lng !== '';
  function placeIdOf(s) {
    if (!s) return '';
    if (s.place_id) return s.place_id;
    const m = String(s.map_url || '').match(/[?&]query_place_id=([^&#]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function navUrl(stop) {
    const pid = placeIdOf(stop);
    if (hasXY(stop)) return `https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}${pid ? '&destination_place_id=' + encodeURIComponent(pid) : ''}&travelmode=driving`;
    if (stop.map_url) return stop.map_url;
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((stop.name || '') + ' ' + (stop.address || ''))}`;
  }
  function placeUrl(stop) {
    if (stop.map_url) return stop.map_url;
    if (hasXY(stop)) return `https://www.google.com/maps/search/?api=1&query=${stop.lat},${stop.lng}`;
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.name || '')}`;
  }
  /* ลิงก์เส้นทางทุกจุดตามลำดับ
     opts.fromHere = true (ฝั่งคนขับ): เริ่มจากตำแหน่งปัจจุบันของมือถือ แล้วไปจุดแรก → จุดถัดไป → … → จุดสุดท้าย
     ไม่งั้น (ฝั่งแอดมิน): เริ่มที่จุดแรก */
  function routeUrl(stops, opts) {
    opts = opts || {};
    const list = (stops || []).filter(Boolean);
    if (!list.length) return '';
    const pt = (s) => (hasXY(s) ? `${s.lat},${s.lng}` : `${s.name || ''} ${s.address || ''}`.trim());
    const enc = encodeURIComponent;
    let origin = null, rest = list;
    if (!opts.fromHere && list.length > 1) { origin = list[0]; rest = list.slice(1); }
    rest = rest.slice(0, 10); // Google Maps รับจุดแวะได้สูงสุด 9 จุด + ปลายทาง
    const dest = rest[rest.length - 1];
    const mids = rest.slice(0, -1);
    let u = 'https://www.google.com/maps/dir/?api=1';
    if (origin) u += `&origin=${enc(pt(origin))}` + (placeIdOf(origin) ? `&origin_place_id=${enc(placeIdOf(origin))}` : '');
    u += `&destination=${enc(pt(dest))}` + (placeIdOf(dest) ? `&destination_place_id=${enc(placeIdOf(dest))}` : '');
    if (mids.length) {
      u += `&waypoints=${enc(mids.map(pt).join('|'))}`;
      const ids = mids.map(placeIdOf);
      if (ids.every(Boolean)) u += `&waypoint_place_ids=${enc(ids.join('|'))}`;
    }
    return u + '&travelmode=driving';
  }
  function distanceM(a, b) {
    if (!hasXY(a) || !hasXY(b)) return null;
    const R = 6371000, toR = (x) => (x * Math.PI) / 180;
    const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
    return Math.round(2 * R * Math.asin(Math.sqrt(h)));
  }
  const fmtDist = (m) => (m === null ? '' : m < 1000 ? `${m} ม.` : `${(m / 1000).toFixed(1)} กม.`);

  /* อ่านพิกัดจากลิงก์ Google Maps แบบเต็ม (ลิงก์ย่อให้ระบบหลังบ้านอ่าน) */
  function parseMapsUrl(u) {
    let s = String(u || '');
    try { s = decodeURIComponent(s.replace(/\+/g, ' ')); } catch (e) { /* ใช้ข้อความเดิม */ }
    const out = { name: '', lat: null, lng: null };
    const m = s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) ||
      s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
      s.match(/[?&](?:q|query|ll|destination|daddr|center)=(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/) ||
      s.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
    if (m) {
      const lat = Number(m[1]), lng = Number(m[2]);
      if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) { out.lat = lat; out.lng = lng; }
    }
    const n = s.match(/\/place\/([^/@?&]+)/) || s.match(/[?&]q=([^&]+)/);
    if (n && !/^\s*-?\d+(\.\d+)?\s*,/.test(n[1])) out.name = n[1].trim().slice(0, 120);
    return out;
  }

  /* ---------- แผนที่ (Leaflet + OpenStreetMap) ---------- */
  function decodePolyline(str) {
    let index = 0, lat = 0, lng = 0;
    const coords = [];
    while (index < str.length) {
      let b, shift = 0, result = 0;
      do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lat += result & 1 ? ~(result >> 1) : result >> 1;
      shift = 0; result = 0;
      do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lng += result & 1 ? ~(result >> 1) : result >> 1;
      coords.push([lat / 1e5, lng / 1e5]);
    }
    return coords;
  }

  function stopPopup(s) {
    let h = `<b>${esc(s.seq ? s.seq + '. ' : '')}${esc(s.name)}</b>`;
    if (s.planned_time) h += `<div class="muted small">นัด ${esc(s.planned_time)}</div>`;
    if (s.status === 'arrived') h += `<div style="color:var(--good-ink);font-weight:600" class="small">เช็คอิน ${esc(fmtStamp(s.arrived_at))}</div>`;
    if (s.photo_url) h += `<img src="${esc(s.photo_url)}" alt="รูปเช็คอิน" loading="lazy">`;
    if (s.photos && s.photos.length > 1) h += `<div class="small muted">+ อีก ${s.photos.length - 1} รูป</div>`;
    if (s.checkin_dist_m !== null && s.checkin_dist_m !== undefined) h += `<div class="small muted">เช็คอินห่างจุดนัด ${esc(fmtDist(s.checkin_dist_m))}</div>`;
    h += `<div style="margin-top:6px"><a href="${esc(placeUrl(s))}" target="_blank" rel="noopener">เปิดใน Google Maps</a></div>`;
    return h;
  }

  function renderMap(el, stops, opts) {
    opts = opts || {};
    if (!el) return null;
    if (el._map) { try { el._map.off(); el._map.stop(); el._map.remove(); } catch (e) { /* ไม่เป็นไร */ } el._map = null; }
    el.innerHTML = '';
    if (!window.L) {
      el.innerHTML = '<div class="map-note">โหลดแผนที่ไม่ได้ ตรวจสอบอินเทอร์เน็ต</div>';
      return null;
    }
    const map = L.map(el, { scrollWheelZoom: false, zoomControl: true, tap: true });
    el._map = map;
    L.tileLayer(CONFIG.TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: CONFIG.TILE_ATTRIBUTION || '&copy; OpenStreetMap'
    }).addTo(map);
    const list = (stops || []).filter(hasXY);
    const cars = (opts.cars || []).filter(hasXY);
    const carBounds = [];
    cars.forEach((c) => {
      const ic = L.divIcon({ className: '', html: `<div class="car-pin ${c.stale ? 'stale' : ''}">${icon('van', 15)}<span>${esc(c.label || c.name || '')}</span></div>`, iconSize: null, iconAnchor: [14, 14] });
      L.marker([c.lat, c.lng], { icon: ic, zIndexOffset: 800, title: c.name || '' }).addTo(map)
        .bindPopup(`<b>${esc(c.name || '')}</b><div class="small muted">ตำแหน่งล่าสุด ${esc(c.at ? hhmm(c.at) + ' น. · ' + timeAgo(c.at) : '')}${c.acc_m ? ' · ±' + esc(c.acc_m) + ' ม.' : ''}</div>` +
          `<div style="margin-top:6px"><a href="https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}" target="_blank" rel="noopener">เปิดใน Google Maps</a></div>`);
      carBounds.push([c.lat, c.lng]);
    });
    if (opts.trail && opts.trail.length > 1) {
      L.polyline(opts.trail.map((p) => [p[0], p[1]]), { color: '#7C3AED', weight: 3, opacity: 0.75, dashArray: '2 6' }).addTo(map);
    }
    if (!list.length) {
      if (carBounds.length) {
        if (carBounds.length === 1) map.setView(carBounds[0], 14); else map.fitBounds(carBounds, { padding: [40, 40], maxZoom: 15 });
        setTimeout(() => { if (el._map === map) map.invalidateSize(); }, 60);
        return map;
      }
      map.setView([13.7563, 100.5018], 10);
      const note = document.createElement('div');
      note.className = 'map-note';
      note.textContent = opts.emptyText || 'ยังไม่มีพิกัดสถานที่';
      el.appendChild(note);
      setTimeout(() => { if (el._map === map) map.invalidateSize(); }, 60);
      return map;
    }
    const brand = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#0E6BA8';
    const bounds = L.latLngBounds([]);
    if (opts.polyline) {
      const pts = decodePolyline(opts.polyline);
      L.polyline(pts, { color: brand, weight: 5, opacity: 0.85 }).addTo(map);
      pts.forEach((p) => bounds.extend(p));
    } else if (list.length > 1) {
      L.polyline(list.map((s) => [s.lat, s.lng]), { color: brand, weight: 3, opacity: 0.9, dashArray: '8 8' }).addTo(map);
    }
    const next = list.find((s) => s.status !== 'arrived');
    list.forEach((s, i) => {
      const cls = s.status === 'arrived' ? 'done' : (opts.markNext && s === next ? 'next' : '');
      const ic = L.divIcon({ className: '', html: `<div class="pin ${cls}">${esc(s.seq || i + 1)}</div>`, iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -14] });
      if (opts.radius > 0) L.circle([s.lat, s.lng], { radius: opts.radius, color: s.status === 'arrived' ? '#2B7A3B' : brand, weight: 1.5, opacity: 0.7, fillOpacity: 0.07, interactive: false }).addTo(map);
      L.marker([s.lat, s.lng], { icon: ic, title: s.name, zIndexOffset: s === next ? 500 : 0 }).addTo(map).bindPopup(stopPopup(s));
      bounds.extend([s.lat, s.lng]);
      if (opts.showCheckins && s.arrive_lat !== null && s.arrive_lat !== undefined && s.arrive_lng !== null) {
        const cam = L.divIcon({ className: '', html: '<div class="pin-cam"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
        L.polyline([[s.lat, s.lng], [s.arrive_lat, s.arrive_lng]], { color: '#7C3AED', weight: 1.5, dashArray: '3 4', interactive: false }).addTo(map);
        L.marker([s.arrive_lat, s.arrive_lng], { icon: cam, title: 'ตำแหน่งที่เช็คอิน' }).addTo(map)
          .bindPopup(`<b>ตำแหน่งที่เช็คอิน</b><div class="small muted">${esc(s.name)} · ${esc(fmtStamp(s.arrived_at))}${s.checkin_dist_m !== null && s.checkin_dist_m !== undefined ? ' · ห่างจุดนัด ' + esc(fmtDist(s.checkin_dist_m)) : ''}</div>`);
        bounds.extend([s.arrive_lat, s.arrive_lng]);
      }
    });
    if (opts.fitCars) carBounds.forEach((b) => bounds.extend(b));
    if (list.length === 1 && !opts.polyline && !(opts.fitCars && carBounds.length)) map.setView([list[0].lat, list[0].lng], 15);
    else map.fitBounds(bounds, { padding: [36, 36], maxZoom: 16 });
    setTimeout(() => { if (el._map === map) map.invalidateSize(); }, 60);
    return map;
  }

  /* แผนที่รวมทุก Job ของวัน: เส้นทางแยกสีต่อ Job + หมุดรถทุกคัน */
  const JOB_COLORS = ['#0E6BA8', '#D9480F', '#2B8A3E', '#7048E8', '#C2255C', '#E67700', '#1098AD', '#5C940D', '#862E9C', '#495057'];
  const jobColor = (i) => JOB_COLORS[i % JOB_COLORS.length];
  function renderMultiMap(el, jobs, opts) {
    opts = opts || {};
    if (!el) return null;
    if (el._map) { try { el._map.off(); el._map.stop(); el._map.remove(); } catch (e) { /* ไม่เป็นไร */ } el._map = null; }
    el.innerHTML = '';
    if (!window.L) { el.innerHTML = '<div class="map-note">โหลดแผนที่ไม่ได้ ตรวจสอบอินเทอร์เน็ต</div>'; return null; }
    const map = L.map(el, { scrollWheelZoom: false, zoomControl: true, tap: true });
    el._map = map;
    L.tileLayer(CONFIG.TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: CONFIG.TILE_ATTRIBUTION || '&copy; OpenStreetMap' }).addTo(map);
    const bounds = L.latLngBounds([]);
    (jobs || []).forEach((j, i) => {
      const color = opts.colorOf ? opts.colorOf(j) : jobColor(i);
      const pts = (j.stops || []).filter(hasXY);
      if (!pts.length) return;
      const tip = `<b class="mono">${esc(j.job_no)}</b> · ${esc(j.plate)}<div class="small muted">${esc(jobTitle(j))} · ${esc(j.driver_name || '')}</div>` +
        `<div style="margin-top:6px"><a href="#/admin/jobs/${esc(j.id)}">ดูรายละเอียด Job</a></div>`;
      const line = j.route_polyline ? decodePolyline(j.route_polyline) : pts.map((s) => [s.lat, s.lng]);
      if (line.length > 1) {
        L.polyline(line, { color, weight: j.status === 'done' ? 3 : 5, opacity: j.status === 'done' ? 0.45 : 0.85, dashArray: j.route_polyline ? null : '8 8' })
          .addTo(map).bindPopup(tip);
      }
      pts.forEach((s) => {
        const done = s.status === 'arrived';
        const ic = L.divIcon({ className: '', html: `<div class="pin c" style="background:${done ? 'var(--good)' : color};${done ? '' : ''}">${done ? '✓' : esc(s.seq)}</div>`, iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -14] });
        L.marker([s.lat, s.lng], { icon: ic, title: s.name }).addTo(map)
          .bindPopup(`<b>${esc(s.seq)}. ${esc(s.name)}</b>${s.planned_time ? `<div class="small muted">นัด ${esc(s.planned_time)}</div>` : ''}${done ? `<div class="small" style="color:var(--good-ink);font-weight:600">เช็คอิน ${esc(fmtStamp(s.arrived_at))}</div>` : ''}<hr style="border:0;border-top:1px solid #eee;margin:6px 0">${tip}`);
        bounds.extend([s.lat, s.lng]);
      });
      line.forEach((p) => bounds.extend(p));
    });
    (opts.cars || []).filter(hasXY).forEach((c) => {
      const ic = L.divIcon({ className: '', html: `<div class="car-pin ${c.stale ? 'stale' : ''}">${icon('van', 15)}<span>${esc(c.label || c.name || '')}</span></div>`, iconSize: null, iconAnchor: [14, 14] });
      L.marker([c.lat, c.lng], { icon: ic, zIndexOffset: 800 }).addTo(map)
        .bindPopup(`<b>${esc(c.name || '')}</b><div class="small muted">ตำแหน่งล่าสุด ${esc(c.at ? hhmm(c.at) + ' น. · ' + timeAgo(c.at) : '')}</div>`);
      bounds.extend([c.lat, c.lng]);
    });
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [36, 36], maxZoom: 15 });
    else {
      map.setView([13.7563, 100.5018], 10);
      const note = document.createElement('div');
      note.className = 'map-note';
      note.textContent = opts.emptyText || 'ยังไม่มีพิกัดสถานที่';
      el.appendChild(note);
    }
    setTimeout(() => { if (el._map === map) map.invalidateSize(); }, 60);
    return map;
  }

  /* ปักหมุดเองบนแผนที่: แตะเพื่อวางหมุด ลากเพื่อปรับ → คืนค่า {lat, lng} หรือ null ถ้ายกเลิก */
  function pickOnMap(opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      let pos = hasXY(opts) ? { lat: Number(opts.lat), lng: Number(opts.lng) } : null;
      let done = false, map = null, marker = null;
      const m = modal({
        title: opts.title || 'ปักหมุดบนแผนที่', wide: true, full: true,
        body: `<div class="small muted">${esc(opts.hint || 'แตะบนแผนที่ตรงจุดนัด แล้วลากหมุดเพื่อปรับให้ตรง · ซูมด้วยสองนิ้วหรือปุ่ม + −')}</div>
          <div class="pick-map" id="pm-map" aria-label="แผนที่สำหรับปักหมุด"></div>
          <div class="row" style="align-items:center">
            <span class="grow small" id="pm-xy" style="font-family:var(--mono)"></span>
            <button type="button" class="btn btn-sm" id="pm-me">${icon('crosshair', 16)}ตำแหน่งของฉัน</button>
          </div>`,
        foot: `<button type="button" class="btn" data-close>ยกเลิก</button><button type="button" class="btn btn-primary" data-ok disabled>${icon('pin', 18)}ใช้ตำแหน่งนี้</button>`,
        onClose: () => { if (map) map.remove(); if (!done) resolve(null); }
      });
      const q = (s) => m.el.querySelector(s);
      const ok = q('[data-ok]');
      function show() {
        q('#pm-xy').textContent = pos ? `${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)}` : 'ยังไม่ได้ปักหมุด';
        ok.disabled = !pos;
      }
      function place(ll, pan) {
        pos = { lat: Math.round(ll.lat * 1e6) / 1e6, lng: Math.round(ll.lng * 1e6) / 1e6 };
        if (!marker) {
          marker = L.marker([pos.lat, pos.lng], { draggable: true, icon: L.divIcon({ className: '', html: '<div class="pin next">★</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map);
          marker.on('dragend', () => place(marker.getLatLng()));
        } else marker.setLatLng([pos.lat, pos.lng]);
        if (pan) map.setView([pos.lat, pos.lng], Math.max(map.getZoom(), 16));
        show();
      }
      if (!window.L) { q('#pm-map').innerHTML = '<div class="map-note">โหลดแผนที่ไม่ได้ ตรวจสอบอินเทอร์เน็ต</div>'; show(); return; }
      map = L.map(q('#pm-map'), { zoomControl: true, tap: true });
      L.tileLayer(CONFIG.TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: CONFIG.TILE_ATTRIBUTION || '&copy; OpenStreetMap' }).addTo(map);
      (opts.around || []).filter(hasXY).forEach((s) => {
        L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: `<div class="pin">${esc(s.seq || '')}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }), opacity: 0.6, interactive: false }).addTo(map);
      });
      const others = (opts.around || []).filter(hasXY);
      if (pos) map.setView([pos.lat, pos.lng], 16);
      else if (others.length) map.fitBounds(L.latLngBounds(others.map((s) => [s.lat, s.lng])).pad(0.3), { maxZoom: 14 });
      else map.setView([13.7563, 100.5018], 11);
      if (pos) place(pos);
      map.on('click', (e) => place(e.latlng));
      setTimeout(() => map.invalidateSize(), 120);
      q('#pm-me').addEventListener('click', () => {
        const b = q('#pm-me');
        if (!navigator.geolocation) return toast('อุปกรณ์นี้หาตำแหน่งไม่ได้', 'bad');
        busy(b, true, 'กำลังหา…');
        navigator.geolocation.getCurrentPosition((p) => { busy(b, false); place({ lat: p.coords.latitude, lng: p.coords.longitude }, true); },
          () => { busy(b, false); toast('หาตำแหน่งไม่ได้ — ตรวจสอบสิทธิ์ตำแหน่งของเบราว์เซอร์', 'bad'); }, { enableHighAccuracy: true, timeout: 15000 });
      });
      ok.addEventListener('click', () => { done = true; const r = pos; m.close(); resolve(r); });
      show();
    });
  }

  /* ---------- รูปภาพ ---------- */
  async function loadImage(file) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* ใช้วิธีสำรอง */ }
    }
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }
  /* ย่อรูปให้ด้านยาวไม่เกิน maxSide (crop=true ตัดเป็นสี่เหลี่ยมจัตุรัสสำหรับรูปหน้า) */
  async function resizeImage(file, maxSide, crop) {
    const img = await loadImage(file);
    let sx = 0, sy = 0, sw = img.width, sh = img.height;
    if (crop) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
    const k = Math.min(1, maxSide / Math.max(sw, sh));
    const c = document.createElement('canvas');
    c.width = Math.round(sw * k); c.height = Math.round(sh * k);
    c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    if (img.close) img.close();
    return c.toDataURL('image/jpeg', 0.8);
  }
  function pickImage() {
    return new Promise((resolve) => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*'; inp.className = 'file-hidden';
      inp.addEventListener('change', () => { resolve(inp.files && inp.files[0] ? inp.files[0] : null); inp.remove(); });
      document.body.appendChild(inp);
      inp.click();
    });
  }
  function avatar(name, url, size, extra) {
    const s = size || 36;
    const st = `width:${s}px;height:${s}px;font-size:${Math.round(s * 0.42)}px;${extra || ''}`;
    return url ? `<img class="avatar-img" src="${esc(url)}" alt="" style="${st}">`
      : `<span class="avatar soft" style="${st}" aria-hidden="true">${esc(String(name || '?').trim().slice(0, 1))}</span>`;
  }
  function vehicleThumb(url, w, h) {
    return url ? `<img class="veh-img" src="${esc(url)}" alt="" style="width:${w}px;height:${h}px">`
      : `<span class="veh-img empty" style="width:${w}px;height:${h}px">${icon('van', Math.round(h * 0.5))}</span>`;
  }

  window.UI = {
    CONFIG, $, $$, esc, today, addDays, bkkNow, fmtDate, fmtMin, relDay, hhmm, fmtStamp, minutesDiff, stampMs, timeAgo,
    STATUS, chip, jobTitle, nextStop, pct, progressBar, lastCheckin,
    icon, brandMark, toast, busy, modal, confirmBox, showPhoto, copyText,
    hasXY, placeIdOf, navUrl, placeUrl, routeUrl, distanceM, fmtDist, parseMapsUrl, renderMap, renderMultiMap, jobColor, pickOnMap,
    loadImage, resizeImage, pickImage, avatar, vehicleThumb
  };
})();

</script>
<script>/* ---- assets/demo.js ---- */
/* โหมดตัวอย่าง: จำลองระบบหลังบ้านในเบราว์เซอร์ (ข้อมูลเก็บในเครื่องนี้เท่านั้น) */
(function () {
  'use strict';
  const KEY = 'stj_demo_db_v1';

  const PLACES = [
    { name: 'ลานจอดรถบริษัท (บางนา)', address: 'ซ.บางนา-ตราด 14 แขวงบางนา เขตบางนา กรุงเทพฯ', lat: 13.6694, lng: 100.6264 },

    { name: 'ไบเทค บางนา', address: '88 ถ.บางนา-ตราด แขวงบางนา เขตบางนา กรุงเทพฯ', lat: 13.6694, lng: 100.6097 },
    { name: 'นิคมอุตสาหกรรมบางปู ประตู 2', address: 'ถ.สุขุมวิท ต.แพรกษา อ.เมืองสมุทรปราการ', lat: 13.5345, lng: 100.6560 },

    { name: 'ท่าอากาศยานดอนเมือง', address: 'ถ.วิภาวดีรังสิต แขวงสนามบิน เขตดอนเมือง กรุงเทพฯ', lat: 13.9126, lng: 100.6068 },
    { name: 'โรงแรมชาเทรียม ริเวอร์ไซด์', address: '28 ซ.เจริญกรุง 70 เขตบางคอแหลม กรุงเทพฯ', lat: 13.7069, lng: 100.5116 },
    { name: 'สยามพารากอน', address: '991 ถ.พระราม 1 แขวงปทุมวัน เขตปทุมวัน กรุงเทพฯ', lat: 13.7462, lng: 100.5347 },
    { name: 'วัดไชยวัฒนาราม อยุธยา', address: 'ต.บ้านป้อม อ.พระนครศรีอยุธยา', lat: 14.3430, lng: 100.5416 },
    { name: 'วัดมหาธาตุ อยุธยา', address: 'ถ.นเรศวร ต.ท่าวาสุกรี อ.พระนครศรีอยุธยา', lat: 14.3571, lng: 100.5676 },
    { name: 'พระราชวังบางปะอิน', address: 'ต.บ้านเลน อ.บางปะอิน พระนครศรีอยุธยา', lat: 14.2326, lng: 100.5791 },
    { name: 'โรงเรียนนานาชาติบางนา', address: 'ถ.บางนา-ตราด กม.10 อ.บางพลี สมุทรปราการ', lat: 13.6530, lng: 100.7020 },
    { name: 'คอนโดลุมพินี บางนา', address: 'ถ.บางนา-ตราด กม.3 แขวงบางนา เขตบางนา กรุงเทพฯ', lat: 13.6672, lng: 100.6470 }
  ];
  const place = (name) => PLACES.find((p) => p.name.startsWith(name));

  function photo(label, hue) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
      <defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${hue},45%,72%)"/><stop offset="1" stop-color="hsl(${hue},35%,88%)"/></linearGradient></defs>
      <rect width="640" height="480" fill="url(#s)"/><rect y="330" width="640" height="150" fill="hsl(${hue},12%,42%)"/>
      <rect x="40" y="150" width="170" height="190" fill="hsl(${hue},20%,96%)"/><rect x="430" y="110" width="170" height="230" fill="hsl(${hue},18%,90%)"/>
      <g transform="translate(200 230)"><rect width="250" height="100" rx="18" fill="#F5F7FA"/><path d="M180 0h40l30 45v55h-70z" fill="#DDE4EC"/>
      <rect x="20" y="18" width="40" height="32" rx="5" fill="#9FB4C8"/><rect x="72" y="18" width="40" height="32" rx="5" fill="#9FB4C8"/><rect x="124" y="18" width="40" height="32" rx="5" fill="#9FB4C8"/>
      <circle cx="55" cy="102" r="20" fill="#2B2F36"/><circle cx="200" cy="102" r="20" fill="#2B2F36"/></g>
      <rect y="420" width="640" height="60" fill="rgba(0,0,0,.55)"/>

    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function vanPhoto(body, plate) {
    const dark = body === '#1F2937';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
      <rect width="640" height="420" fill="#DCE6EF"/><rect y="300" width="640" height="120" fill="#9AA7B3"/>
      <path d="M80 300V170q0-40 40-40h300q40 0 70 40l60 70q20 22 20 50v10z" fill="${body}" stroke="#4B5563" stroke-width="3"/>
      <path d="M130 160h110v70H130zM260 160h110v70H260zM390 160h40q20 0 35 20l35 50H390z" fill="${dark ? '#94A3B8' : '#6B8299'}"/>
      <circle cx="170" cy="305" r="38" fill="#111827"/><circle cx="170" cy="305" r="16" fill="#9CA3AF"/>
      <circle cx="480" cy="305" r="38" fill="#111827"/><circle cx="480" cy="305" r="16" fill="#9CA3AF"/>

      <text x="320" y="294" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#111">${plate}</text></svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function seed() {
    const t = UI.today();
    const tm = UI.addDays(t, 1);
    const db = { settings: { company_name: 'บริษัท ตัวอย่างทัวร์ จำกัด', admin_pin: '000000', admin_pin_default: 'true', checkin_radius_m: '100',
      daily_check: 'on', gps_tracking: 'on', gps_interval_min: '3' },
      drivers: [], vehicles: [], jobs: [], stops: [], places: [], sessions: [], dailyChecks: [], locations: [] };
    const drv = [['D1', 'สมชาย ใจดี', '111111'], ['D2', 'วิชัย ศรีสุข', '222222'], ['D3', 'ประเสริฐ มั่นคง', '333333'], ['D4', 'อนุชา แก้วมา', '444444']];
    drv.forEach(([id, name, pin], i) => db.drivers.push({ id, name, pin, phone: '08' + String(12345678 + i * 11111111).slice(0, 8), photo_url: '', active: 'true', created_at: t + ' 08:00:00' }));
    [['V1', 'ฮข 4521', 'Toyota Commuter', 13, '#F2F4F7'], ['V2', 'นข 7788', 'Hyundai H-1', 10, '#1F2937'], ['V3', '1กก 9032', 'Toyota Commuter VIP', 9, '#9CA3AF'], ['V4', 'ศร 1150', 'Nissan Urvan', 15, '#E5E7EB']]
      .forEach(([id, plate, name, seats, color]) => db.vehicles.push({ id, plate, name, seats, note: '', photo_url: vanPhoto(color, plate), active: 'true', created_at: t + ' 08:00:00' }));
    const vid = (plate) => (db.vehicles.find((v) => v.plate === plate) || {}).id || '';
    let n = 0;
    function job(no, date, time, title, driver, plate, note, stops) {
      const id = 'J' + (++n);
      const st = stops.map(([p, planned, arrived], i) => {
        const pl = place(p);
        const s = { id: id + 'S' + (i + 1), job_id: id, seq: i + 1, name: pl.name, address: pl.address, lat: pl.lat, lng: pl.lng,
          map_url: `https://www.google.com/maps/search/?api=1&query=${pl.lat},${pl.lng}`, note: '', planned_time: planned,
          status: arrived ? 'arrived' : 'pending', arrived_at: arrived ? date + ' ' + arrived + ':00' : '',
          arrive_lat: arrived ? pl.lat + 0.0003 : null, arrive_lng: arrived ? pl.lng - 0.0002 : null,
          photo_id: '', photo_url: arrived ? photo(`${pl.name} · ${arrived}`, 200 + i * 35) : '', checkin_note: '',
          checkin_dist_m: arrived ? 38 : null, checkin_acc_m: arrived ? 12 : null };
        db.stops.push(s);
        return s;
      });
      const done = st.filter((s) => s.status === 'arrived').length;
      const first = st.find((s) => s.arrived_at);
      db.jobs.push({ id, job_no: 'JOB-' + date.slice(2).replace(/-/g, '') + '-' + String(no).padStart(2, '0'), date, time, title,
        driver_id: driver, plate, vehicle_id: vid(plate), note, status: done === 0 ? 'pending' : done === st.length ? 'done' : 'in_progress',
        route_polyline: '', distance_km: null, duration_min: null, created_at: date + ' 05:00:00', updated_at: date + ' 05:00:00',
        started_at: first ? first.arrived_at : '', finished_at: done === st.length && done ? st[st.length - 1].arrived_at : '' });

  function decorate(db, j) {

  const A = {

    listJobs(db, req) {

    getJob(db, req) {

    saveJob(db, req) {
      auth(db, req, 'admin');
      const inp = req.job || {}, stopsIn = req.stops || [];
      if (!isDate(inp.date)) fail('กรุณาเลือกวันที่');

      if (job && job.status === 'cancelled') fail('Job นี้ถูกยกเลิกแล้ว แก้ไขไม่ได้');

      const old = job ? db.stops.filter((s) => s.job_id === job.id) : [];

      old.forEach((o) => { if (o.status === 'arrived' && !keep.has(o.id)) fail(`ลบ "${o.name}" ไม่ได้ เพราะคนขับเช็คอินแล้ว`); });
      if (job && job.driver_id !== drv.id && job.status !== 'pending') fail('เปลี่ยนคนขับไม่ได้ เพราะเริ่มงานไปแล้ว');
      const id = job ? job.id : 'J' + uid();

        if (o && o.status === 'arrived') arrived++;
        db.stops.push(Object.assign({}, o || {}, {
          id: o ? o.id : 'S' + uid(), job_id: id, seq: i + 1, name, address: clean(s.address, 250),
          lat: num(s.lat), lng: num(s.lng), map_url: clean(s.map_url, 1500), note: clean(s.note, 300),
          planned_time: /^\d{2}:\d{2}$/.test(s.planned_time || '') ? s.planned_time : '',
          status: o ? o.status : 'pending'
        }, o ? {} : { arrived_at: '', arrive_lat: null, arrive_lng: null, photo_id: '', photo_url: '', checkin_note: '' }));
      });
      const status = arrived === 0 ? 'pending' : arrived === stopsIn.length ? 'done' : 'in_progress';
      const rec = { id, job_no: jobNo, date: inp.date, time: /^\d{2}:\d{2}$/.test(inp.time || '') ? inp.time : '', title: clean(inp.title, 120),
        driver_id: drv.id, plate, vehicle_id: veh ? veh.id : '', note: clean(inp.note, 500), status, route_polyline: '', distance_km: null, duration_min: null,
        created_at: job ? job.created_at : now, updated_at: now, started_at: job ? job.started_at : '',

      });
