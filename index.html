      if (photos.some((p) => !/^data:image\//.test(String(p)))) fail('รูปเช็คอินไม่ถูกต้อง กรุณาถ่ายใหม่');
      const st = db.stops.find((x) => x.id === req.stopId);
      if (!st) fail('ไม่พบสถานที่นี้ใน Job');
      const j = db.jobs.find((x) => x.id === st.job_id);
      if (!j || j.driver_id !== s.user_id) fail('สถานที่นี้ไม่ใช่งานของคุณ', 'FORBIDDEN');
      if (j.status === 'cancelled') fail('Job นี้ถูกยกเลิกแล้ว');
      if (st.status === 'arrived') fail('จุดนี้เช็คอินไปแล้ว');
      if (db.settings.daily_check !== 'off' && !db.dailyChecks.some((c) => c.driver_id === s.user_id && c.date === UI.today())) {
        fail('กรุณาตรวจความพร้อมประจำวันก่อนเช็คอิน (เมนู "ตรวจความพร้อม" ด้านล่าง)', 'NEED_DAILY');
      }
      const now = UI.bkkNow().stamp;
      if (num(req.lat) !== null) db.locations.push({ at: now, driver_id: s.user_id, name: s.name, lat: num(req.lat), lng: num(req.lng), acc_m: num(req.acc) === null ? null : Math.round(num(req.acc)), source: 'checkin', job_id: j.id });
      // โหมดตัวอย่างไม่บังคับรัศมี (ผู้ทดลองอยู่ไกลจากสถานที่ตัวอย่าง) แต่บันทึกระยะไว้ให้ดู
      const d = UI.distanceM(st, { lat: num(req.lat), lng: num(req.lng) });
      Object.assign(st, { status: 'arrived', arrived_at: now, arrive_lat: num(req.lat), arrive_lng: num(req.lng),
        photo_id: 'demo', photo_url: photos[0], photos, checkin_note: clean(req.note, 300),
        checkin_dist_m: d, checkin_acc_m: num(req.acc) === null ? null : Math.round(num(req.acc)) });
      const all = db.stops.filter((x) => x.job_id === j.id);
      const done = all.filter((x) => x.status === 'arrived').length;
      if (!j.started_at) j.started_at = now;
      j.status = done >= all.length ? 'done' : 'in_progress';
      if (j.status === 'done') j.finished_at = now;
      j.updated_at = now;
      return decorate(db, j);
    },
    searchPlace(db, req) {
      auth(db, req, 'admin');
      const q = clean(req.q, 150);
      if (q.length < 2) fail('พิมพ์คำค้นหาอย่างน้อย 2 ตัวอักษร');
      const co = UI.parseMapsUrl(q);
      if (co.lat !== null) return [{ name: 'พิกัด ' + q, address: '', lat: co.lat, lng: co.lng, map_url: `https://www.google.com/maps/search/?api=1&query=${co.lat},${co.lng}` }];
      const words = q.toLowerCase().split(/\s+/).filter(Boolean);
      return PLACES.filter((p) => words.every((w) => (p.name + ' ' + p.address).toLowerCase().includes(w))).slice(0, 6)
        .map((p) => ({ name: p.name, address: p.address, lat: p.lat, lng: p.lng, map_url: `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}` }));
    },
    resolveLink(db, req) {
      auth(db, req, 'admin');
      const m = String(req.url || '').match(/https:\/\/\S+/) || [String(req.url || '').trim()];
      const info = UI.parseMapsUrl(m[0]);
      if (info.lat === null && /goo\.gl|g\.co/.test(m[0])) {
        fail('โหมดตัวอย่างอ่านลิงก์แบบย่อ (maps.app.goo.gl) ไม่ได้ — ระบบจริงอ่านได้ ลองลิงก์แบบเต็มหรือพิกัด เช่น 13.7462, 100.5347');
      }
      if (info.lat === null && !/^https:\/\//.test(m[0])) fail('กรุณาวางลิงก์จาก Google Maps (ขึ้นต้นด้วย https://)');
      return { name: info.name, lat: info.lat, lng: info.lng, map_url: /^https:/.test(m[0]) ? m[0] : `https://www.google.com/maps/search/?api=1&query=${info.lat},${info.lng}` };
    },
    listPlaces(db, req) {
      auth(db, req, 'admin');
      return db.places.slice().sort((a, b) => (b.used_count || 0) - (a.used_count || 0));
    },
    suggestPlace(db, req) {
      auth(db, req, 'admin');
      const q = clean(req.q, 150);
      if (q.length < 2) return { source: 'none', items: [] };
      const co = UI.parseMapsUrl(q);
      if (co.lat !== null) return { source: 'coords', items: [{ name: 'พิกัด ' + q, address: '', lat: co.lat, lng: co.lng, map_url: `https://www.google.com/maps/search/?api=1&query=${co.lat},${co.lng}` }] };
      const words = q.toLowerCase().split(/\s+/).filter(Boolean);
      return { source: 'geocoder', items: PLACES.filter((p) => words.every((w) => (p.name + ' ' + p.address).toLowerCase().includes(w))).slice(0, 5)
        .map((p) => ({ name: p.name, address: p.address, lat: p.lat, lng: p.lng, map_url: `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}` })) };
    },
    placeDetails() { fail('โหมดตัวอย่างไม่รองรับ Google Places'); },
    myDay(db, req) {
      const s = auth(db, req, 'driver');
      const t = UI.today();
      const d = db.drivers.find((x) => x.id === s.user_id) || {};
      const mine = db.jobs.filter((j) => j.driver_id === s.user_id && j.date === t && j.status !== 'cancelled').sort((a, b) => ((a.time || '99:99') < (b.time || '99:99') ? -1 : 1));
      const first = mine.find((j) => j.status !== 'done') || mine[0] || null;
      const c = db.dailyChecks.find((x) => x.driver_id === s.user_id && x.date === t);
      const vehicles = db.vehicles.filter((v) => v.active === 'true');
      return Object.assign(settingsOut(db), {
        date: t, version: 'demo', driver: { id: d.id, name: d.name, phone: d.phone || '', photo_url: d.photo_url || '' },
        check: c ? Object.assign({}, c, { vehicle_name: (vehicles.find((v) => v.id === c.vehicle_id) || {}).name || '' }) : null,
        vehicle_id: first ? first.vehicle_id : '', plate: first ? first.plate : '', jobs_today: mine.length,
        vehicles: vehicles.map((v) => ({ id: v.id, plate: v.plate, name: v.name, seats: v.seats, photo_url: v.photo_url })),
        photo_labels: ['รถภายนอก', 'ป้ายทะเบียน', 'ภายในรถ']
      });
    },
    saveDailyCheck(db, req) {
      const s = auth(db, req, 'driver');
      const photos = Array.isArray(req.photos) ? req.photos : [];
      if (photos.length !== 3 || photos.some((p) => !/^data:image\//.test(String(p || '')))) fail('กรุณาถ่ายรูปให้ครบ 3 รูป (รถภายนอก, ป้ายทะเบียน, ภายในรถ)');
      if (!['name', 'phone', 'vehicle', 'gps'].every((k) => req.items && req.items[k] === true)) fail('กรุณาติ๊กยืนยันให้ครบทุกข้อ');
      const t = UI.today();
      if (db.dailyChecks.some((c) => c.driver_id === s.user_id && c.date === t)) fail('วันนี้ตรวจความพร้อมไปแล้ว');
      const v = db.vehicles.find((x) => x.id === req.vehicle_id);
      if (!v && db.vehicles.some((x) => x.active === 'true')) fail('กรุณาเลือกรถที่ใช้วันนี้');
      const d = db.drivers.find((x) => x.id === s.user_id);
      if (d && req.phone) d.phone = clean(req.phone, 20);
      const labels = ['รถภายนอก', 'ป้ายทะเบียน', 'ภายในรถ'];
      const c = { id: 'C' + uid(), date: t, driver_id: s.user_id, driver_name: s.name, vehicle_id: v ? v.id : '', plate: v ? v.plate : clean(req.plate, 20),
        phone: clean(req.phone, 20), photos: photos.map((u, i) => ({ label: labels[i], url: u })), lat: num(req.lat), lng: num(req.lng),
        acc_m: num(req.acc) === null ? null : Math.round(num(req.acc)), created_at: UI.bkkNow().stamp };
      db.dailyChecks.push(c);
      if (c.lat !== null) db.locations.push({ at: c.created_at, driver_id: s.user_id, name: s.name, lat: c.lat, lng: c.lng, acc_m: c.acc_m, source: 'daily_check', job_id: '' });
      return Object.assign({}, c, { vehicle_name: v ? v.name : '' });
    },
    reportLocation(db, req) {
      const s = auth(db, req, 'driver');
      const lat = num(req.lat), lng = num(req.lng);
      if (lat === null || lng === null || Math.abs(lat) > 90 || Math.abs(lng) > 180) fail('ตำแหน่งไม่ถูกต้อง');
      if (db.settings.gps_tracking === 'off') return { saved: false, reason: 'off' };
      const at = UI.bkkNow().stamp;
      db.locations.push({ at, driver_id: s.user_id, name: s.name, lat, lng, acc_m: num(req.acc) === null ? null : Math.round(num(req.acc)), source: req.source === 'manual' ? 'manual' : 'gps', job_id: '' });
      if (db.locations.length > 400) db.locations = db.locations.slice(-300);
      return { saved: true, at, interval_min: Number(db.settings.gps_interval_min) || 3 };
    },
    dayStatus(db, req) {
      auth(db, req, 'admin');
      const date = isDate(req.date) ? req.date : UI.today();
      const latest = {};
      const trail = [];
      db.locations.filter((l) => String(l.at).slice(0, 10) === date).forEach((l) => {
        if (!latest[l.driver_id] || latest[l.driver_id].at <= l.at) latest[l.driver_id] = l;
        if (req.trail && l.driver_id === req.trail) trail.push([l.lat, l.lng, l.at]);
      });
      return Object.assign(settingsOut(db), {
        date, checks: db.dailyChecks.filter((c) => c.date === date).map((c) => Object.assign({}, c, { vehicle_name: (db.vehicles.find((v) => v.id === c.vehicle_id) || {}).name || '' })),
        drivers: db.drivers.filter((d) => d.active === 'true').map((d) => ({ id: d.id, name: d.name, phone: d.phone || '', photo_url: d.photo_url || '' })),
        locations: Object.values(latest), trail
      });
    },
    clientLog() { return true; }
  };

  window.DemoBackend = {
    reset() { localStorage.removeItem(KEY); },
    async handle(req) {
      await new Promise((r) => setTimeout(r, req.action === 'checkIn' ? 700 : 180));
      const db = load();
      try {
        const fn = A[req.action];
        if (!fn) fail('ไม่รู้จักคำสั่ง: ' + req.action);
        const data = fn(db, req);
        save(db);
        return { ok: true, data: JSON.parse(JSON.stringify(data === undefined ? null : data)) };
      } catch (e) {
        if (e.app) return { ok: false, error: e.message, code: e.code };
        console.error(e);
        return { ok: false, error: 'เกิดข้อผิดพลาด: ' + e.message };
      }
    }
  };
})();

</script>
<script>/* ---- assets/api.js ---- */
/* เชื่อมต่อระบบหลังบ้าน (Google Apps Script) หรือโหมดตัวอย่าง */
(function () {
  'use strict';
  const CONFIG = window.STJ_CONFIG || {};
  const K = { api: 'stj_api_url', demo: 'stj_demo_mode', sess: 'stj_session' };
  const mem = {}; // สำรองเมื่อเบราว์เซอร์ไม่ให้เก็บข้อมูล (เช่น โหมดส่วนตัว / เบราว์เซอร์ในแอปแชท)
  const store = {
    get(k) { try { const v = localStorage.getItem(k); return v === null && k in mem ? mem[k] : v; } catch (e) { return k in mem ? mem[k] : null; } },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) { /* ใช้ค่าในหน่วยความจำแทน */ } },
    del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { /* ไม่เป็นไร */ } }
  };

  // ลิงก์ระบบหลังบ้านจาก ?api=... ในลิงก์ (เก็บไว้ในลิงก์ตลอด เพื่อให้บุ๊กมาร์กและไอคอนบนหน้าจอหลักใช้ได้เสมอ)
  function urlParam(name) {
    let v = new URLSearchParams(location.search).get(name);
    if (!v && location.hash.indexOf('?') > -1) v = new URLSearchParams(location.hash.split('?')[1]).get(name);
    return v ? v.trim() : '';
  }
  function setUrlParam(name, value) {
    const p = new URLSearchParams(location.search);
    if (value) p.set(name, value); else p.delete(name);
    const q = p.toString();
    history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
  }
  (function readParams() {
    const a = urlParam('api');
    if (a) { store.set(K.api, a); store.del(K.demo); }
    if (urlParam('demo') === '1') store.set(K.demo, '1');
  })();

  const isDemo = () => store.get(K.demo) === '1';
  const apiUrl = () => (CONFIG.API_URL || (isDemo() ? '' : urlParam('api')) || store.get(K.api) || '').trim();
  const scope = () => (isDemo() ? 'demo' : apiUrl());

  function session() {
    try {
      const s = JSON.parse(store.get(K.sess) || 'null');
      return s && s.scope === scope() ? s : null;
    } catch (e) { return null; }
  }
  function setSession(data) {
    store.set(K.sess, JSON.stringify(Object.assign({}, data, { scope: scope() })));
  }
  function patchSession(patch) {
    const s = session();
    if (s) setSession(Object.assign(s, patch));
  }
  const clearSession = () => store.del(K.sess);

  class ApiError extends Error {
    constructor(msg, code) { super(msg); this.code = code || ''; }
  }

  /* คำสั่งที่ส่งซ้ำได้อย่างปลอดภัย: ถ้าเน็ตสะดุด จะลองใหม่ให้อัตโนมัติ 1 ครั้งก่อนแจ้งผู้ใช้ */
  const SAFE_RETRY = ['ping', 'publicDrivers', 'login', 'me', 'listJobs', 'getJob', 'listDrivers', 'listVehicles', 'listPlaces',
    'myDay', 'dayStatus', 'searchPlace', 'suggestPlace', 'placeDetails', 'resolveLink'];
  const pendingErrors = [];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function call(action, payload, opts) {
    opts = opts || {};
    try {
      const data = await once(action, payload);
      if (pendingErrors.length && action !== 'clientLog') flushErrors();
      return data;
    } catch (e) {
      const net = e.code === 'NETWORK' || e.code === 'TIMEOUT' || e.code === 'BAD_RESPONSE';
      if (net && !opts.noRetry && SAFE_RETRY.indexOf(action) > -1 && (e.code !== 'TIMEOUT' || action === 'login')) {
        await sleep(1200);
        try {
          const data = await once(action, payload);
          noteError(action, e, 'สำเร็จเมื่อลองซ้ำ');
          flushErrors();
          return data;
        } catch (e2) { if (e2.code === 'NETWORK' || e2.code === 'TIMEOUT' || e2.code === 'BAD_RESPONSE') noteError(action, e2, 'ลองซ้ำแล้วไม่สำเร็จ'); throw e2; }
      }
      if (net && action !== 'clientLog') noteError(action, e, '');
      throw e;
    }
  }
  function noteError(action, e, extra) {
    if (isDemo()) return;
    pendingErrors.push(`${action}: ${e.code} ${e.message}${extra ? ' (' + extra + ')' : ''} @${new Date().toISOString().slice(11, 19)}`);
    if (pendingErrors.length > 6) pendingErrors.shift();
  }
  function flushErrors() {
    const msg = pendingErrors.splice(0).join(' | ');
    if (!msg) return;
    once('clientLog', { msg, where: (location.hash || '').split('?')[0], ua: navigator.userAgent }).catch(() => {});
  }

  async function once(action, payload) {
    const s = session();
    const body = Object.assign({ action }, payload || {}, s ? { token: s.token } : {});
    let res;
    if (isDemo()) {
      res = await window.DemoBackend.handle(body);
    } else {
      const url = apiUrl();
      if (!url) throw new ApiError('ยังไม่ได้เชื่อมต่อระบบหลังบ้าน', 'SETUP');
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), action === 'checkIn' || action === 'saveDailyCheck' ? 120000 : action === 'login' ? 25000 : 45000);
      try {
        const r = await fetch(url, {
          method: 'POST', redirect: 'follow', signal: ctrl.signal,
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body)
        });
        const text = await r.text();
        try { res = JSON.parse(text); } catch (e) {
          throw new ApiError('ระบบหลังบ้านตอบกลับไม่ถูกต้อง — ตรวจสอบว่าตั้งสิทธิ์เว็บแอปเป็น "ทุกคน"', 'BAD_RESPONSE');
        }
      } catch (e) {
        if (e instanceof ApiError) throw e;
        if (e.name === 'AbortError') throw new ApiError('ใช้เวลานานเกินไป ลองใหม่อีกครั้ง', 'TIMEOUT');
        throw new ApiError('เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', 'NETWORK');
      } finally {
        clearTimeout(timer);
      }
    }
    if (!res || !res.ok) {
      const err = new ApiError((res && res.error) || 'เกิดข้อผิดพลาด', res && res.code);
      if (err.code === 'AUTH' && action !== 'login') {
        clearSession();
        setTimeout(() => { location.hash = '#/login'; }, 0);
      }
      throw err;
    }
    return res.data;
  }

  async function testUrl(url) {
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/i.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(url)) {
      throw new ApiError('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/macros/s/… และลงท้ายด้วย /exec');
    }
    let r;
    try {
      r = await fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'ping' }) });
    } catch (e) {
      throw new ApiError('เชื่อมต่อไม่ได้ — ตรวจสอบว่าตั้ง "ผู้ที่มีสิทธิ์เข้าถึง: ทุกคน" แล้ว');
    }
    let j;
    try { j = JSON.parse(await r.text()); } catch (e) {
      throw new ApiError('ลิงก์นี้ไม่ใช่ระบบ Smart Tracking หรือยังไม่ได้ตั้งสิทธิ์เป็น "ทุกคน"');
    }
    if (!j.ok) throw new ApiError(j.error || 'ระบบหลังบ้านมีปัญหา');
    return j.data;
  }

  window.API = {
    call, testUrl, isDemo, apiUrl, session, setSession, patchSession, clearSession, ApiError,
    ready: () => isDemo() || !!apiUrl(),
    lockedUrl: () => !!CONFIG.API_URL,
    setApiUrl(url) { store.set(K.api, url.trim()); store.del(K.demo); setUrlParam('demo', ''); if (!CONFIG.API_URL) setUrlParam('api', url.trim()); clearSession(); },
    enableDemo() { store.set(K.demo, '1'); setUrlParam('api', ''); clearSession(); },
    disableDemo() { store.del(K.demo); setUrlParam('demo', ''); clearSession(); },
    driverLink() {
      const base = location.origin + location.pathname;
      return isDemo() ? base + '?demo=1#/login' : base + (CONFIG.API_URL ? '' : '?api=' + encodeURIComponent(apiUrl())) + '#/login';
    }
  };
})();

</script>
<script>/* ---- assets/admin.js ---- */
/* หน้าจอฝั่งเจ้าของ / แอดมิน */
(function () {
  'use strict';
  const { $, $$, esc, icon, chip, toast, busy } = UI;
  const V = (window.Views = window.Views || {});

  /* ---------- โครงหน้า ---------- */
  function shell(active, inner) {
    const s = API.session() || {};
    const items = [['#/admin', 'ภาพรวม', 'home', 'home'], ['#/admin/jobs', 'Job', 'list', 'jobs'],
      ['#/admin/vehicles', 'รถ', 'van', 'vehicles'], ['#/admin/drivers', 'คนขับ', 'users', 'drivers'], ['#/admin/settings', 'ตั้งค่า', 'settings', 'settings']];
    return `${App.demoBar()}
    <header class="topbar"><div class="topbar-in">
      <a class="brand" href="#/admin">${UI.brandMark()}<span class="brand-text"><b>Smart Tracking</b><span>${esc(s.company || '')}</span></span></a>
      <nav class="nav" aria-label="เมนูหลัก">${items.map(([h, t, ic, key]) =>
        `<a href="${h}" class="${key === active ? 'on' : ''}" ${key === active ? 'aria-current="page"' : ''}>${icon(ic, 18)}${t}</a>`).join('')}</nav>
      <div class="top-user"><span class="avatar" aria-hidden="true">A</span>
        <span class="who" style="display:flex;flex-direction:column;line-height:1.2"><b style="font-size:14px">แอดมิน</b><span style="font-size:12px;color:#A9B8C8">เจ้าของ</span></span>
        <button type="button" class="icon-btn" data-logout aria-label="ออกจากระบบ" title="ออกจากระบบ">${icon('logout')}</button></div>
    </div></header>
    <main class="page">${inner}</main>`;
  }
  function mount(active, inner) {
    $('#app').innerHTML = shell(active, inner);
    App.bindCommon();
  }
  const loading = (t) => `<div class="loading-block"><span class="spinner"></span>${esc(t || 'กำลังโหลด…')}</div>`;
  const errorBox = (e) => `<div class="banner bad">${esc(e.message || e)}</div>`;
  function pinBanner() {
    const s = API.session();
    return s && s.pinDefault ? `<div class="banner warn">${icon('lock', 18)}<span>ยังใช้ PIN แอดมินเริ่มต้น <b>000000</b> — เพื่อความปลอดภัยควรเปลี่ยนทันที</span><a href="#/admin/settings">เปลี่ยน PIN</a></div>` : '';
  }
  function isOverdue(job, stop) {
    if (stop.status === 'arrived' || job.status === 'cancelled') return false;
    const now = UI.bkkNow();
    if (job.date < now.date) return true;
    return job.date === now.date && stop.planned_time && stop.planned_time < now.time;
  }
  function overdueMin(job, stop) {
    if (!isOverdue(job, stop) || job.date !== UI.today() || !stop.planned_time) return null;
    const [h, m] = stop.planned_time.split(':').map(Number);
    const [nh, nm] = UI.bkkNow().time.split(':').map(Number);
    return nh * 60 + nm - (h * 60 + m);
  }
  const dotColor = (st) => ({ pending: '#8A96A3', in_progress: 'var(--brand)', done: 'var(--good)', cancelled: 'var(--bad)' }[st]);

  /* ====================== ภาพรวม ====================== */
  V.dashboard = async function () {
    const g = App.gen;
    const st = { date: App.state.dashDate || UI.today(), jobs: [], sel: App.state.dashSel || null, at: '', day: null, focus: null, trail: null,
      mode: App.state.dashMode || '' };
    mount('home', `
      ${pinBanner()}
      <div class="page-head">
        <div><h1>ภาพรวม</h1><div class="sub" id="d-sub">${esc(UI.fmtDate(st.date))}</div></div>
        <div class="actions">
          <label class="sr-only" for="d-date">เลือกวันที่</label>
          <input type="date" id="d-date" class="input" style="width:auto" value="${esc(st.date)}">
          <button type="button" class="btn" id="d-refresh">${icon('refresh', 18)}รีเฟรช</button>
          <a href="#/admin/jobs/new" class="btn btn-primary">${icon('plus', 18)}สร้าง Job</a>
        </div>
      </div>
      <div class="tiles" id="d-tiles">${loading()}</div>
      <div class="split stretch">
        <section class="main card map-card" aria-label="แผนที่เส้นทาง">
          <div class="card-head"><h2 id="d-maptitle">เส้นทาง</h2><div class="legend" id="d-legend"></div></div>
          <div class="map-chips" id="d-chips" role="tablist" aria-label="เลือกเส้นทางที่จะดู"></div>
          <div class="map" id="d-map"></div>
        </section>
        <aside class="side" aria-label="รายละเอียด Job" id="d-side">${loading()}</aside>
      </div>
      <section class="card" aria-label="คนขับวันนี้">
        <div class="card-head"><h2>คนขับ · ความพร้อมและตำแหน่งล่าสุด</h2><span class="muted small" id="d-crew-note"></span></div>
        <div id="d-crew">${loading()}</div>
      </section>
      <section class="card" aria-label="Job ของวัน">
        <div class="card-head"><h2>Job ของวัน</h2><span class="muted small" id="d-at"></span></div>
        <div id="d-table">${loading()}</div>
      </section>`);

    async function load(silent) {
      if (!silent) $('#d-refresh').disabled = true;
      try {
        const [jobs, day] = await Promise.all([
          API.call('listJobs', { from: st.date, to: st.date }),
          API.call('dayStatus', { date: st.date, trail: st.focus || '' }).catch(() => null)
        ]);
        if (!App.alive(g)) return;
        st.jobs = jobs;
        st.day = day;
        st.trail = day && st.focus ? day.trail : null;
        st.at = UI.bkkNow().time;
        if (!st.jobs.some((j) => j.id === st.sel)) {
          const pick = st.jobs.find((j) => j.status === 'in_progress') || st.jobs.find((j) => j.status === 'pending') || st.jobs[0];
          st.sel = pick ? pick.id : null;
        }
        if (!st.mode) st.mode = st.jobs.filter((j) => j.status !== 'cancelled').length > 1 ? 'all' : 'job';
        draw();
      } catch (e) {
        if (!App.alive(g)) return;
        if (!silent) { $('#d-table').innerHTML = errorBox(e); $('#d-side').innerHTML = ''; $('#d-tiles').innerHTML = ''; $('#d-crew').innerHTML = ''; }
      } finally {
        const b = $('#d-refresh'); if (b) b.disabled = false;
      }
    }

    function draw() {
      const live = st.jobs.filter((j) => j.status !== 'cancelled');
      const overdue = live.reduce((n, j) => n + j.stops.filter((s) => isOverdue(j, s)).length, 0);
      $('#d-tiles').innerHTML = `
        <div class="tile"><span class="k">Job ทั้งหมด</span><span class="v">${live.length}</span></div>
        <div class="tile blue"><span class="k">กำลังทำ</span><span class="v">${live.filter((j) => j.status === 'in_progress').length}</span></div>
        <div class="tile green"><span class="k">เสร็จแล้ว</span><span class="v">${live.filter((j) => j.status === 'done').length}</span></div>
        <div class="tile ${overdue ? 'orange' : ''}"><span class="k">จุดที่เลยเวลานัด</span><span class="v">${overdue}</span></div>
        ${st.day && st.day.daily_check ? (() => { const c = crew(); const ok = c.filter((x) => x.check).length; const need = c.filter((x) => x.jobs.length).length; return `<div class="tile ${need && ok < need ? 'orange' : 'green'}"><span class="k">คนขับพร้อมแล้ว</span><span class="v">${ok}<span style="font-size:18px;color:var(--muted)">/${need}</span></span></div>`; })() : ''}`;
      $('#d-at').textContent = `อัปเดตล่าสุด ${st.at} น. · กดรีเฟรชเพื่อดูข้อมูลใหม่`;
      $('#d-sub').textContent = UI.fmtDate(st.date) + (st.date === UI.today() ? ' (วันนี้)' : '');
      drawSide();
      drawMap();
      drawTable();
      drawCrew();
    }

    /* คนขับที่เกี่ยวข้องกับวันที่เลือก: มีงาน / ตรวจความพร้อมแล้ว / มีตำแหน่ง */
    function crew() {
      const day = st.day;
      if (!day) return [];
      const byId = {};
      const add = (id, name, photo) => (byId[id] = byId[id] || { id, name, photo_url: photo || '', jobs: [], check: null, loc: null });
      day.drivers.forEach((d) => add(d.id, d.name, d.photo_url).phone = d.phone);
      st.jobs.filter((j) => j.status !== 'cancelled').forEach((j) => add(j.driver_id, j.driver_name, j.driver_photo_url).jobs.push(j));
      day.checks.forEach((c) => { add(c.driver_id, c.driver_name).check = c; });
      day.locations.forEach((l) => { add(l.driver_id, l.name).loc = l; });
      return Object.values(byId).filter((x) => x.jobs.length || x.check || x.loc)
        .sort((a, b) => (b.jobs.length ? 1 : 0) - (a.jobs.length ? 1 : 0) || a.name.localeCompare(b.name, 'th'));
    }
    function cars() {
      if (!st.day) return [];
      const today = st.date === UI.today();
      return st.day.locations.map((l) => {
        const age = UI.stampMs(l.at) ? (Date.now() - UI.stampMs(l.at)) / 60000 : 999;
        return Object.assign({}, l, { label: String(l.name || '').split(' ')[0], stale: !today || age > 15 });
      });
    }
    function drawCrew() {
      const day = st.day;
      const box = $('#d-crew');
      if (!day) { box.innerHTML = '<div class="empty">โหลดข้อมูลคนขับไม่ได้ — กดรีเฟรช</div>'; return; }
      $('#d-crew-note').textContent = (day.gps_tracking ? `ส่งตำแหน่งทุก ${day.gps_interval_min} นาที เฉพาะตอนคนขับเปิดแอป` : 'ปิดการส่งตำแหน่ง') +
        (day.daily_check ? '' : ' · ไม่ได้บังคับตรวจความพร้อม');
      const list = crew();
      if (!list.length) { box.innerHTML = `<div class="empty">${icon('users', 32)}<div>ยังไม่มีคนขับที่มีงานในวันนี้</div></div>`; return; }
      box.innerHTML = `<div class="crew-grid">${list.map((c) => {
        const ck = c.check;
        const status = !day.daily_check ? '' : ck ? `<span class="chip st-done">พร้อม ${esc(UI.hhmm(ck.created_at))} น.</span>`
          : c.jobs.length ? '<span class="chip st-cancelled">ยังไม่ตรวจความพร้อม</span>' : '<span class="chip">ไม่มีงาน</span>';
        const loc = c.loc;
        return `<article class="crew-card ${st.focus === c.id ? 'on' : ''}">
          <div class="crew-top">${UI.avatar(c.name, c.photo_url, 44)}<div style="min-width:0;flex:1 1 auto"><b>${esc(c.name)}</b>
            <div class="small muted">${c.jobs.length ? c.jobs.length + ' งาน' : 'ไม่มีงาน'}${ck && ck.plate ? ' · <span class="mono">' + esc(ck.plate) + '</span>' : (c.jobs[0] ? ' · <span class="mono">' + esc(c.jobs[0].plate) + '</span>' : '')}</div></div>${status}</div>
          ${ck && ck.photos && ck.photos.length ? `<div class="crew-photos">${ck.photos.map((p) => `<button type="button" data-photo="${esc(p.url)}" data-cap="${esc(c.name + ' · ' + p.label)}" aria-label="ดูรูป ${esc(p.label)}"><img src="${esc(p.url)}" alt="" loading="lazy"><span>${esc(p.label)}</span></button>`).join('')}</div>` : ''}
          <div class="crew-loc">${icon('gps', 16)}${loc ? `<span>ตำแหน่งล่าสุด <b>${esc(UI.hhmm(loc.at))} น.</b> <span class="muted">(${esc(UI.timeAgo(loc.at))})</span></span>
              <button type="button" class="btn btn-sm" data-focus="${esc(c.id)}">${st.focus === c.id ? 'ซ่อนเส้นทาง' : 'ดูบนแผนที่'}</button>` : '<span class="muted">ยังไม่มีตำแหน่งวันนี้</span>'}</div>
        </article>`;
      }).join('')}</div>`;
      $$('[data-photo]', box).forEach((b) => b.addEventListener('click', () => UI.showPhoto(b.dataset.photo, b.dataset.cap)));
      $$('[data-focus]', box).forEach((b) => b.addEventListener('click', async () => {
        const id = b.dataset.focus;
        if (st.focus === id) { st.focus = null; st.trail = null; drawCrew(); drawMap(); return; }
        st.focus = id;
        busy(b, true, 'กำลังโหลด…');
        try { const day2 = await API.call('dayStatus', { date: st.date, trail: id }); if (!App.alive(g)) return; st.day = day2; st.trail = day2.trail; } catch (e) { toast(e.message, 'bad'); }
        if (!App.alive(g)) return;
        drawCrew(); drawMap();
        $('#d-map').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }));
    }

    const colorOf = (j) => UI.jobColor(Math.max(0, st.jobs.indexOf(st.jobs.find((x) => x.id === j.id))));
    function drawChips() {
      const live = st.jobs.filter((j) => j.status !== 'cancelled');
      const box = $('#d-chips');
      if (!box) return;
      if (!live.length) { box.innerHTML = ''; box.classList.add('hidden'); return; }
      box.classList.remove('hidden');
      const allOn = st.mode === 'all' && !st.focus;
      box.innerHTML = `<button type="button" class="map-chip ${allOn ? 'on' : ''}" data-chip="all" role="tab" aria-selected="${allOn}">${icon('route', 16)}ทุก Job (${live.length})</button>` +
        live.map((j) => {
          const on = st.mode === 'job' && st.sel === j.id && !st.focus;
          return `<button type="button" class="map-chip ${on ? 'on' : ''}" data-chip="${esc(j.id)}" role="tab" aria-selected="${on}"><span class="sw" style="background:${colorOf(j)}"></span><span class="mono">${esc(j.plate)}</span><span class="muted">${esc(j.time || '')} ${j.done_count}/${j.total_count}</span></button>`;
        }).join('');
      $$('[data-chip]', box).forEach((b) => b.addEventListener('click', () => {
        st.focus = null; st.trail = null;
        if (b.dataset.chip === 'all') st.mode = 'all';
        else { st.mode = 'job'; st.sel = b.dataset.chip; App.state.dashSel = st.sel; }
        App.state.dashMode = st.mode;
        drawSide(); drawMap(); drawCrew();
      }));
      const on = box.querySelector('.on');
      if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
    function drawMap() {
      drawChips();
      const job = st.jobs.find((j) => j.id === st.sel);
      const focusCar = st.focus ? cars().filter((c) => c.driver_id === st.focus) : [];
      const legendJob = '<span><i class="dot" style="background:var(--good)"></i>เช็คอินแล้ว</span><span><i class="dot" style="background:var(--brand)"></i>จุดถัดไป</span><span><i class="dot" style="background:#fff;border:2px solid var(--brand)"></i>ยังไม่ถึง</span><span><i class="dot" style="background:#7C3AED"></i>ตำแหน่งที่เช็คอิน</span><span><i class="dot" style="background:var(--navy)"></i>ตำแหน่งรถล่าสุด</span>';
      if (!focusCar.length && st.mode === 'all') {
        const live = st.jobs.filter((j) => j.status !== 'cancelled');
        $('#d-maptitle').textContent = `เส้นทาง · ทุก Job (${live.length})`;
        $('#d-legend').innerHTML = '<span>แต่ละสี = 1 Job (ตามปุ่มด้านล่าง)</span><span><i class="dot" style="background:var(--good)"></i>✓ เช็คอินแล้ว</span><span><i class="dot" style="background:var(--navy)"></i>ตำแหน่งรถล่าสุด</span>';
        UI.renderMultiMap($('#d-map'), live, { colorOf, cars: cars(), emptyText: live.length ? 'Job วันนี้ยังไม่มีพิกัดสถานที่' : 'ไม่มี Job ในวันที่เลือก' });
        return;
      }
      $('#d-legend').innerHTML = legendJob;
      $('#d-maptitle').innerHTML = job ? `เส้นทาง · <span class="mono">${esc(job.job_no)}</span> · ${esc(job.plate)}` : 'เส้นทาง';
      const map = UI.renderMap($('#d-map'), focusCar.length ? [] : (job ? job.stops : []), {
        polyline: !focusCar.length && job && job.route_polyline, showCheckins: true, markNext: true, radius: job && job.checkin_radius_m,
        emptyText: job ? 'Job นี้ยังไม่มีพิกัดสถานที่' : 'ไม่มี Job ในวันที่เลือก',
        cars: focusCar.length ? focusCar : cars(), trail: focusCar.length ? st.trail : null
      });
      if (focusCar.length && map && st.trail && st.trail.length > 1 && window.L) {
        map.fitBounds(L.latLngBounds(st.trail.map((p) => [p[0], p[1]]).concat([[focusCar[0].lat, focusCar[0].lng]])), { padding: [40, 40], maxZoom: 16 });
      }
      if (focusCar.length) $('#d-maptitle').innerHTML = `ตำแหน่งและเส้นทางที่ผ่านมา · ${esc(focusCar[0].name)}`;
    }

    function drawSide() {
      const job = st.jobs.find((j) => j.id === st.sel);
      let html = '';
      if (job) {
        const nx = UI.nextStop(job);
        const last = UI.lastCheckin(job);
        const late = nx ? overdueMin(job, nx) : null;
        html += `<div class="card card-pad" style="display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="mono" style="font-size:16px">${esc(job.job_no)}</span>${chip(job.status)}</div>
          <div style="font-size:18px;font-weight:700;line-height:1.35">${esc(UI.jobTitle(job))}</div>
          <div class="grid g2 keep" style="gap:8px">
            <div class="pick-card" style="padding:8px 10px">${UI.avatar(job.driver_name, job.driver_photo_url, 40)}<div style="min-width:0"><div class="s">คนขับ</div><div class="t" style="font-size:14px">${esc(job.driver_name)}</div></div></div>
            <div class="pick-card" style="padding:8px 10px">${UI.vehicleThumb(job.vehicle_photo_url, 52, 38)}<div style="min-width:0"><div class="s">รถ</div><div class="t mono" style="font-size:14px">${esc(job.plate)}</div></div></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;justify-content:space-between;font-size:14px"><span class="muted">ความคืบหน้า</span><b>${job.done_count}/${job.total_count} จุด</b></div>
            ${UI.progressBar(job)}
          </div>
          <div class="kv">
            <div><span class="k">จุดถัดไป</span><span class="v">${nx ? esc(nx.name) : '— ครบทุกจุด'}</span></div>
            <div><span class="k">เวลานัด</span><span class="v">${nx && nx.planned_time ? esc(nx.planned_time) + ' น.' : '-'}</span></div>
          </div>
          ${late !== null && late > 0 ? `<div class="banner warn">${icon('clock', 18)}เลยเวลานัด ${UI.fmtMin(late)} ยังไม่เช็คอิน</div>` : ''}
          ${last ? `<div style="display:flex;gap:12px;align-items:center">
              ${last.photo_url ? `<button type="button" class="tl-photo-btn" data-photo="${esc(last.photo_url)}" data-cap="${esc(last.name)}" style="padding:0;border:0;background:none;cursor:zoom-in;border-radius:10px;overflow:hidden;flex:none"><img src="${esc(last.photo_url)}" alt="รูปเช็คอินล่าสุด" style="width:88px;height:66px;object-fit:cover;background:#E8EDF1"></button>` : ''}
              <div class="info-row"><span class="k">เช็คอินล่าสุด</span><span class="v">${esc(UI.hhmm(last.arrived_at))} น. · ${esc(last.name)}</span></div></div>` : ''}
          <div class="actions">
            <a class="btn btn-primary" href="#/admin/jobs/${esc(job.id)}">ดูรายละเอียด</a>
            <a class="btn" href="${esc(UI.routeUrl(job.stops))}" target="_blank" rel="noopener">${icon('nav', 18)}Google Maps</a>
          </div>
        </div>`;
      }
      html += `<div class="card"><div class="card-head"><h2>Job ทั้งหมดของวัน</h2><span class="muted small">${st.jobs.length} งาน</span></div>`;
      if (!st.jobs.length) {
        html += `<div class="empty">${icon('route', 36)}<div>ยังไม่มี Job ในวันนี้</div><a class="btn btn-primary btn-sm" href="#/admin/jobs/new">${icon('plus', 16)}สร้าง Job</a></div>`;
      } else {
        html += '<div class="job-list">' + st.jobs.map((j) => `
          <button type="button" class="job-row ${j.id === st.sel && st.mode === 'job' ? 'on' : ''}" data-sel="${esc(j.id)}" aria-pressed="${j.id === st.sel && st.mode === 'job'}">
            <i class="dot" style="background:${j.status === 'cancelled' ? dotColor('cancelled') : colorOf(j)};width:12px;height:12px" title="${esc(UI.STATUS[j.status] || '')}"></i>
            <span class="grow"><span class="t"><span class="mono" style="font-size:14px">${esc(j.plate)}</span> · ${esc(UI.jobTitle(j))}</span>
            <span class="s">${esc(j.driver_name)}${j.time ? ' · ' + esc(j.time) + ' น.' : ''}</span></span>
            <span class="muted small" style="flex:none">${j.status === 'cancelled' ? 'ยกเลิก' : j.done_count + '/' + j.total_count}</span>
          </button>`).join('') + '</div>';
      }
      html += '</div>';
      $('#d-side').innerHTML = html;
      $$('[data-sel]', $('#d-side')).forEach((b) => b.addEventListener('click', () => {
        st.sel = b.dataset.sel; App.state.dashSel = st.sel; st.mode = 'job'; App.state.dashMode = 'job'; st.focus = null; st.trail = null; drawSide(); drawMap(); drawCrew();
        if (window.innerWidth < 1000) $('#d-map').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }));
      $$('[data-photo]', $('#d-side')).forEach((b) => b.addEventListener('click', () => UI.showPhoto(b.dataset.photo, b.dataset.cap)));
    }

    function drawTable() {
      if (!st.jobs.length) { $('#d-table').innerHTML = `<div class="empty">ไม่มี Job ในวันที่เลือก</div>`; return; }
      $('#d-table').innerHTML = jobTable(st.jobs);
      bindJobTable($('#d-table'));
    }

    $('#d-date').addEventListener('change', (e) => {
      if (!e.target.value) return;
      st.date = e.target.value; App.state.dashDate = st.date; st.sel = null; st.mode = App.state.dashMode = '';
      load();
    });
    $('#d-refresh').addEventListener('click', () => load());
    const timer = setInterval(() => { if (document.visibilityState === 'visible' && st.date === UI.today()) load(true); }, 120000);
    App.onLeave(() => clearInterval(timer));
    load();
  };

  function jobTable(jobs) {
    return `<div class="table-wrap"><table class="tbl stack"><thead><tr>
      <th>เลข Job</th><th>วันที่</th><th>ชื่องาน / เส้นทาง</th><th>คนขับ</th><th>ทะเบียน</th><th>เวลาเริ่ม</th><th>ความคืบหน้า</th><th>สถานะ</th>
      </tr></thead><tbody>${jobs.map((j) => `
      <tr class="click" data-go="#/admin/jobs/${esc(j.id)}" tabindex="0">
        <td class="mono small st-top"><span>${esc(j.job_no)}</span><span class="only-m">${chip(j.status)}</span></td>
        <td style="white-space:nowrap" data-label="วันที่">${esc(UI.fmtDate(j.date, { short: true }))}${j.time ? '<span class="only-m"> · ' + esc(j.time) + ' น.</span>' : ''}</td>
        <td class="st-title">${esc(UI.jobTitle(j))}<div class="muted small">${j.total_count} จุด</div></td>
        <td data-label="คนขับ">${esc(j.driver_name)}</td>
        <td class="mono small" style="white-space:nowrap" data-label="ทะเบียน">${esc(j.plate)}</td>
        <td class="hide-m">${esc(j.time || '-')}</td>
        <td style="min-width:120px" class="st-prog"><div class="small" style="margin-bottom:4px">${j.done_count}/${j.total_count} จุด</div>${UI.progressBar(j)}</td>
        <td class="hide-m">${chip(j.status)}</td>
      </tr>`).join('')}</tbody></table></div>`;
  }
  function bindJobTable(root) {
    $$('tr[data-go]', root).forEach((tr) => {
      tr.addEventListener('click', () => { location.hash = tr.dataset.go; });
      tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') location.hash = tr.dataset.go; });
    });
  }

  /* ====================== รายการ Job ====================== */
  V.jobs = async function () {
    const t = UI.today();
    const f = App.state.jobsFilter || (App.state.jobsFilter = { from: UI.addDays(t, -7), to: UI.addDays(t, 14), status: '', q: '' });
    let jobs = [];
    mount('jobs', `
      <div class="page-head">
        <div><h1>Job</h1><div class="sub">สร้าง แก้ไข และดูประวัติการเช็คอิน</div></div>
        <div class="actions"><a href="#/admin/jobs/new" class="btn btn-primary">${icon('plus', 18)}สร้าง Job</a></div>
      </div>
      <div class="card card-pad">
        <div class="grid g4">
          <label class="field"><span>ตั้งแต่วันที่</span><input type="date" class="input" id="f-from" value="${esc(f.from)}"></label>
          <label class="field"><span>ถึงวันที่</span><input type="date" class="input" id="f-to" value="${esc(f.to)}"></label>
          <label class="field"><span>สถานะ</span><select class="input" id="f-status">
            <option value="">ทั้งหมด</option>${['pending', 'in_progress', 'done', 'cancelled'].map((s) => `<option value="${s}" ${f.status === s ? 'selected' : ''}>${UI.STATUS[s]}</option>`).join('')}
          </select></label>
          <label class="field"><span>ค้นหา</span><input type="search" class="input" id="f-q" value="${esc(f.q)}" placeholder="เลข Job, ทะเบียน, คนขับ, สถานที่"></label>
        </div>
      </div>
      <section class="card"><div class="card-head"><h2 id="j-count">รายการ</h2><span class="muted small">กดที่แถวเพื่อดูรายละเอียด</span></div><div id="j-list">${loading()}</div></section>`);

    function draw() {
      const q = f.q.trim().toLowerCase();
      const list = jobs.filter((j) => (!f.status || j.status === f.status) && (!q ||
        [j.job_no, j.plate, j.driver_name, j.title, j.note].concat(j.stops.map((s) => s.name)).join(' ').toLowerCase().includes(q)));
      $('#j-count').textContent = `รายการ (${list.length})`;
      $('#j-list').innerHTML = list.length ? jobTable(list) : `<div class="empty">${icon('search', 36)}<div>ไม่พบ Job ตามเงื่อนไข</div></div>`;
      bindJobTable($('#j-list'));
    }
    const g = App.gen;
    async function load() {
      $('#j-list').innerHTML = loading();
      try { const r = await API.call('listJobs', { from: f.from, to: f.to }); if (!App.alive(g)) return; jobs = r; jobs.reverse(); draw(); }
      catch (e) { if (App.alive(g)) $('#j-list').innerHTML = errorBox(e); }
    }
    $('#f-from').addEventListener('change', (e) => { f.from = e.target.value || t; load(); });
    $('#f-to').addEventListener('change', (e) => { f.to = e.target.value || t; load(); });
    $('#f-status').addEventListener('change', (e) => { f.status = e.target.value; draw(); });
    $('#f-q').addEventListener('input', (e) => { f.q = e.target.value; draw(); });
    load();
  };

  /* ====================== สร้าง / แก้ไข Job ====================== */
  V.jobEdit = async function (params, query) {
    const editId = params[0] || null;
    const copyId = query.get('copy');
    mount('jobs', loading('กำลังเตรียมข้อมูล…'));
    const g = App.gen;
    let drivers, places, vehicles, src = null;
    try {
      [drivers, places, vehicles, src] = await Promise.all([
        API.call('listDrivers'), API.call('listPlaces'), API.call('listVehicles'),
        editId || copyId ? API.call('getJob', { id: editId || copyId }) : Promise.resolve(null)
      ]);
    } catch (e) { if (App.alive(g)) mount('jobs', errorBox(e)); return; }
    if (!App.alive(g)) return;
    const st = {
      job: { id: editId || '', date: App.state.dashDate || UI.today(), time: '', title: '', driver_id: '', vehicle_id: '', plate: '', note: '' },
      stops: [], tab: 'search', results: null, preview: null, dirtyRoute: !editId, original: editId ? src : null
    };
    if (src) {
      const keep = ['time', 'title', 'driver_id', 'vehicle_id', 'plate', 'note'];
      keep.forEach((k) => { st.job[k] = src[k] || ''; });
      if (editId) st.job.date = src.date;
      st.stops = src.stops.map((s) => ({
        id: editId ? s.id : '', name: s.name, address: s.address, lat: s.lat, lng: s.lng, map_url: s.map_url,
        note: s.note, planned_time: s.planned_time, status: editId ? s.status : 'pending', arrived_at: editId ? s.arrived_at : ''
      }));
    }
    if (editId && src.status === 'cancelled') { mount('jobs', `<div class="banner bad">Job นี้ถูกยกเลิกแล้ว แก้ไขไม่ได้</div><a class="back" href="#/admin/jobs/${esc(editId)}">← กลับ</a>`); return; }
    const activeDrivers = drivers.filter((d) => d.active || d.id === st.job.driver_id);
    const activeVehicles = vehicles.filter((v) => v.active || v.id === st.job.vehicle_id);
    const started = editId && src.status !== 'pending';

    mount('jobs', `
      <div class="page-head">
        <div><a class="back" href="${editId ? '#/admin/jobs/' + esc(editId) : '#/admin/jobs'}">${icon('back', 16)}${editId ? 'กลับไปหน้า Job' : 'รายการ Job'}</a>
          <h1>${editId ? 'แก้ไข ' + esc(src.job_no) : 'สร้าง Job ใหม่'}</h1>
          <div class="sub">${copyId ? 'คัดลอกจาก ' + esc(src.job_no) + ' — ตรวจสอบวันที่ก่อนบันทึก' : 'กำหนดสถานที่ตามลำดับ คนขับจะเห็นงานนี้ในแอปทันทีที่บันทึก'}</div></div>
        <div class="actions"><a class="btn" href="${editId ? '#/admin/jobs/' + esc(editId) : '#/admin/jobs'}">ยกเลิก</a>
          <button type="button" class="btn btn-primary" data-save>${icon('check', 18)}บันทึก Job</button></div>
      </div>
      <div class="split">
        <div class="main">
          <section class="card card-pad" aria-label="ข้อมูล Job">
            <h2 class="title">ข้อมูล Job</h2>
            <div class="grid g3">
              <label class="field"><span>วันที่ *</span><input type="date" class="input" data-j="date" value="${esc(st.job.date)}" required></label>
              <label class="field"><span>เวลาเริ่มงาน</span><input type="time" class="input" data-j="time" value="${esc(st.job.time)}"></label>
              <label class="field"><span>คนขับ *</span><select class="input" data-j="driver_id" ${started ? 'disabled' : ''}>
                <option value="">— เลือกคนขับ —</option>
                ${activeDrivers.map((d) => `<option value="${esc(d.id)}" ${d.id === st.job.driver_id ? 'selected' : ''}>${esc(d.name)}${d.active ? '' : ' (ปิดใช้งาน)'}</option>`).join('')}
              </select>${started ? '<span class="hint">เริ่มงานแล้ว เปลี่ยนคนขับไม่ได้</span>' : (activeDrivers.length ? '' : '<span class="hint">ยังไม่มีคนขับ — <a href="#/admin/drivers">เพิ่มคนขับ</a></span>')}</label>
            </div>
            <div class="grid g2" style="margin-top:16px">
              <label class="field"><span>รถ *</span><select class="input" data-j="vehicle_id">
                <option value="">— เลือกรถ —</option>
                ${activeVehicles.map((v) => `<option value="${esc(v.id)}" ${v.id === st.job.vehicle_id ? 'selected' : ''}>${esc(v.plate)}${v.name ? ' · ' + esc(v.name) : ''}${v.seats ? ' · ' + v.seats + ' ที่นั่ง' : ''}${v.active ? '' : ' (ปิดใช้งาน)'}</option>`).join('')}
              </select>${activeVehicles.length ? '' : '<span class="hint">ยังไม่มีรถ — <a href="#/admin/vehicles">เพิ่มรถพร้อมทะเบียน</a> ก่อน</span>'}${!st.job.vehicle_id && st.job.plate ? `<span class="hint">Job เดิมใช้ทะเบียน ${esc(st.job.plate)} (ยังไม่ได้ผูกกับรถในระบบ)</span>` : ''}</label>
              <div class="field"><span>&nbsp;</span><div id="pick-preview" style="display:flex;flex-direction:column;gap:8px"></div></div>
            </div>
            <div class="grid g1" style="margin-top:16px">
              <label class="field"><span>ชื่องาน</span><input class="input" data-j="title" value="${esc(st.job.title)}" placeholder="เช่น รับพนักงานกะเช้า, ทัวร์อยุธยา" maxlength="120"></label>
            </div>
            <label class="field" style="margin-top:16px"><span>หมายเหตุถึงคนขับ</span><textarea class="input" data-j="note" maxlength="500" placeholder="เช่น โทรแจ้งลูกค้าก่อนถึง 5 นาที">${esc(st.job.note)}</textarea></label>
          </section>

          <section class="card card-pad" aria-label="สถานที่" style="display:flex;flex-direction:column;gap:14px">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
              <h2 style="font-size:18px">สถานที่ตามลำดับ <span class="muted" style="font-weight:500;font-size:15px" id="s-count"></span></h2>
              <span class="muted small">คนขับต้องถ่ายรูปเช็คอินทุกจุด</span>
            </div>
            <div id="s-list" style="display:flex;flex-direction:column;gap:10px"></div>
            <div class="add-box" id="add-box"></div>
          </section>
        </div>
        <aside class="side sticky">
          <section class="card map-card" aria-label="ตัวอย่างเส้นทาง">
            <div class="card-head"><h2>ตัวอย่างเส้นทาง</h2></div>
            <div class="map sm" id="p-map"></div>
          </section>
          <section class="card card-pad" style="display:flex;flex-direction:column;gap:10px;font-size:14px" id="summary"></section>
          <button type="button" class="btn btn-primary btn-lg" data-save>${icon('check', 18)}บันทึก Job</button>
        </aside>
      </div>`);

    $$('[data-j]').forEach((el) => el.addEventListener('input', () => { st.job[el.dataset.j] = el.value; drawSummary(); }));
    $$('[data-j]').forEach((el) => el.addEventListener('change', () => { st.job[el.dataset.j] = el.value; drawSummary(); drawPick(); }));

    function drawPick() {
      const d = drivers.find((x) => x.id === st.job.driver_id);
      const v = vehicles.find((x) => x.id === st.job.vehicle_id);
      $('#pick-preview').innerHTML = (v ? `<div class="pick-card">${UI.vehicleThumb(v.photo_url, 76, 50)}<div><div class="t">${esc(v.plate)}</div><div class="s">${esc(v.name || 'รถ')}${v.seats ? ' · ' + v.seats + ' ที่นั่ง' : ''}</div></div></div>` : '') +
        (d ? `<div class="pick-card">${UI.avatar(d.name, d.photo_url, 44)}<div><div class="t">${esc(d.name)}</div><div class="s">คนขับ${d.phone ? ' · ' + esc(d.phone) : ''}</div></div></div>` : '');
    }

    function drawStops() {
      $('#s-count').textContent = `(${st.stops.length} จุด)`;
      if (!st.stops.length) {
        $('#s-list').innerHTML = `<div class="empty" style="padding:22px">${icon('pin', 32)}<div>ยังไม่มีสถานที่ — เพิ่มจากกล่องด้านล่าง</div></div>`;
      } else {
        $('#s-list').innerHTML = st.stops.map((s, i) => {
          const locked = s.status === 'arrived';
          return `<div class="stop-edit ${locked ? 'locked' : ''}">
            <div class="num ${locked ? 'done' : ''}">${i + 1}</div>
            <div class="body">
              <input class="input" data-i="${i}" data-f="name" value="${esc(s.name)}" aria-label="ชื่อสถานที่ จุดที่ ${i + 1}" maxlength="120" placeholder="ชื่อสถานที่">
              <div class="meta">
                ${s.address ? `<span>${esc(s.address)}</span>` : ''}
                ${UI.hasXY(s) ? `<span class="tag good">มีพิกัด</span><button type="button" class="link-btn" data-pinmap="${i}">${icon('pin', 14)}ปรับหมุด</button>` : '<span class="tag warn">ไม่มีพิกัด — ไม่ขึ้นแผนที่ ตรวจรัศมีไม่ได้</span>'}
                <a href="${esc(UI.placeUrl(s))}" target="_blank" rel="noopener">ดูใน Google Maps</a>
                ${locked ? `<span class="tag good">${icon('check', 12)}เช็คอินแล้ว ${esc(UI.hhmm(s.arrived_at))}</span>` : ''}
              </div>
              ${UI.hasXY(s) ? '' : `<div class="actions"><button type="button" class="btn btn-sm btn-primary" data-geo="${i}">${icon('search', 16)}หาพิกัดจากชื่อ</button><button type="button" class="btn btn-sm" data-pinmap="${i}">${icon('pin', 16)}ปักหมุดเองบนแผนที่</button></div>`}
              <div class="grid g2" style="gap:10px">
                <label class="field"><span class="small">เวลานัด</span><input type="time" class="input sm" data-i="${i}" data-f="planned_time" value="${esc(s.planned_time)}"></label>
                <label class="field"><span class="small">หมายเหตุจุดนี้</span><input class="input sm" data-i="${i}" data-f="note" value="${esc(s.note)}" maxlength="300" placeholder="เช่น รับ 3 คน, รอหน้าป้อม"></label>
              </div>
            </div>
            <div class="tools">
              <button type="button" class="btn sq btn-sm" data-move="${i}" data-d="-1" aria-label="เลื่อนจุดที่ ${i + 1} ขึ้น" ${i === 0 ? 'disabled' : ''}>${icon('up', 18)}</button>
              <button type="button" class="btn sq btn-sm" data-move="${i}" data-d="1" aria-label="เลื่อนจุดที่ ${i + 1} ลง" ${i === st.stops.length - 1 ? 'disabled' : ''}>${icon('down', 18)}</button>
              <button type="button" class="btn sq btn-sm btn-danger" data-del="${i}" aria-label="ลบจุดที่ ${i + 1}" ${locked ? 'disabled title="เช็คอินแล้ว ลบไม่ได้"' : ''}>${icon('trash', 18)}</button>
            </div>
          </div>`;
        }).join('');
      }
      $$('#s-list [data-f]').forEach((el) => el.addEventListener('input', () => {
        st.stops[Number(el.dataset.i)][el.dataset.f] = el.value; drawSummary();
      }));
      $$('#s-list [data-move]').forEach((b) => b.addEventListener('click', () => {
        const i = Number(b.dataset.move), j = i + Number(b.dataset.d);
        if (j < 0 || j >= st.stops.length) return;
        [st.stops[i], st.stops[j]] = [st.stops[j], st.stops[i]];
        st.dirtyRoute = true; drawStops(); drawMap(); drawSummary();
      }));
      $$('#s-list [data-del]').forEach((b) => b.addEventListener('click', () => {
        st.stops.splice(Number(b.dataset.del), 1);
        st.dirtyRoute = true; drawStops(); drawMap(); drawSummary();
      }));
      $$('#s-list [data-pinmap]').forEach((b) => b.addEventListener('click', () => pinStop(Number(b.dataset.pinmap))));
      $$('#s-list [data-geo]').forEach((b) => b.addEventListener('click', () => geoStop(Number(b.dataset.geo), b)));
    }

    function setXY(i, p, extra) {
      Object.assign(st.stops[i], { lat: p.lat, lng: p.lng }, extra || {});
      st.dirtyRoute = true; drawStops(); drawMap(); drawSummary();
      toast(`ปักหมุด "${st.stops[i].name}" แล้ว`, 'good');
    }
    async function pinStop(i) {
      const s0 = st.stops[i];
      const p = await UI.pickOnMap({ title: `ปักหมุด · ${s0.name || 'จุดที่ ' + (i + 1)}`, lat: s0.lat, lng: s0.lng,
        around: st.stops.map((x, k) => Object.assign({}, x, { seq: k + 1 })).filter((x, k) => k !== i) });
      if (p) setXY(i, p);
    }
    async function geoStop(i, btn) {
      const s0 = st.stops[i];
      const q = `${s0.name || ''} ${s0.address || ''}`.trim();
      if (q.length < 2) return pinStop(i);
      busy(btn, true, 'กำลังค้นหา…');
      let list = [];
      try { list = await API.call('searchPlace', { q }); } catch (e) { toast(e.message, 'bad'); }
      busy(btn, false);
      const m = UI.modal({
        title: `หาพิกัด · ${s0.name}`,
        body: (list.length ? `<div class="muted small">เลือกสถานที่ที่ตรงกับจุดนี้</div>` + list.map((r, k) => `<div class="result"><span class="grow"><span class="t">${esc(r.name)}</span><div class="s">${esc(r.address)}</div></span>
            <a class="btn btn-sm btn-ghost" href="${esc(r.map_url)}" target="_blank" rel="noopener" aria-label="ดูใน Google Maps">${icon('external', 16)}</a>
            <button type="button" class="btn btn-sm btn-primary" data-pickres="${k}">เลือก</button></div>`).join('')
          : `<div class="banner info">ไม่พบพิกัดจากชื่อ "${esc(q)}" — ปักหมุดเองบนแผนที่ได้</div>`),
        foot: `<button type="button" class="btn" data-close>ปิด</button><button type="button" class="btn" data-manual>${icon('pin', 16)}ปักหมุดเองบนแผนที่</button>`
      });
      m.el.querySelectorAll('[data-pickres]').forEach((b) => b.addEventListener('click', () => {
        const r = list[Number(b.dataset.pickres)];
        m.close();
        setXY(i, r, { address: s0.address || r.address, map_url: s0.map_url || r.map_url });
      }));
      m.el.querySelector('[data-manual]').addEventListener('click', () => { m.close(); pinStop(i); });
    }

    function drawMap() {
      UI.renderMap($('#p-map'), st.stops.map((s, i) => Object.assign({}, s, { seq: i + 1 })), {
        polyline: !st.dirtyRoute && st.original ? st.original.route_polyline : '', emptyText: 'เพิ่มสถานที่เพื่อดูเส้นทาง'
      });
    }

    function drawSummary() {
      const times = st.stops.map((s) => s.planned_time).filter(Boolean);
      const o = st.original;
      const drv = drivers.find((d) => d.id === st.job.driver_id);
      $('#summary').innerHTML = `<b style="font-size:16px">สรุป</b>
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">วันที่</span><b>${esc(UI.fmtDate(st.job.date))}${st.job.time ? ' · ' + esc(st.job.time) : ''}</b></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">คนขับ / รถ</span><b>${esc(drv ? drv.name : '-')} · ${esc((vehicles.find((v) => v.id === st.job.vehicle_id) || {}).plate || st.job.plate || '-')}</b></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">จำนวนสถานที่</span><b>${st.stops.length} จุด</b></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">ช่วงเวลานัด</span><b>${times.length ? esc(times[0]) + ' – ' + esc(times[times.length - 1]) : '-'}</b></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">ระยะทางประมาณ</span><b>${!st.dirtyRoute && o && o.distance_km ? o.distance_km + ' กม. · ' + o.duration_min + ' นาที' : 'คำนวณหลังบันทึก'}</b></div>`;
    }

    function addStop(p) {
      st.stops.push({ id: '', name: p.name || '', address: p.address || '', lat: p.lat, lng: p.lng, map_url: p.map_url || '', note: '', planned_time: '', status: 'pending' });
      st.dirtyRoute = true;
      drawStops(); drawMap(); drawSummary();
      toast(`เพิ่ม "${p.name || 'สถานที่'}" เป็นจุดที่ ${st.stops.length} แล้ว`, 'good');
    }

    function drawAdd() {
      const tabs = [['search', 'ค้นหาสถานที่', 'search'], ['link', 'วางลิงก์ Google Maps', 'link'], ['saved', 'สถานที่ที่เคยใช้', 'pin']];
      let body = '';
      if (st.tab === 'search') {
        body = `<form class="row" id="f-search" autocomplete="off">
            <label class="field grow"><span>ค้นหาชื่อสถานที่หรือที่อยู่</span><input class="input" id="q" type="search" enterkeyhint="search" placeholder="พิมพ์ เช่น เซ็นทรัล บางนา, สนามบินสุวรรณภูมิ" value="${esc(st.lastQ || '')}" autocomplete="off"></label>
            <button class="btn btn-dark" type="submit">${icon('search', 18)}ค้นหา</button>
          </form>
          <div class="muted small" id="q-hint">${API.isDemo() ? 'พิมพ์แล้วรายการแนะนำจะขึ้นเอง · โหมดตัวอย่างค้นได้เฉพาะสถานที่ตัวอย่าง เช่น บางนา, สนามบิน, อยุธยา' : 'พิมพ์แล้วรายการแนะนำจะขึ้นเอง (สถานที่ที่เคยใช้ + ผลจาก Google) · ถ้าไม่เจอ ให้คัดลอกลิงก์จาก Google Maps มาวางในแท็บ "วางลิงก์"'}</div>
          <div id="results" style="display:flex;flex-direction:column;gap:8px">${resultsHtml()}</div>`;
      } else if (st.tab === 'link') {
        body = `<form class="row" id="f-link">
            <label class="field grow"><span>ลิงก์จาก Google Maps หรือพิกัด</span><input class="input" id="link" placeholder="https://maps.app.goo.gl/… หรือ 13.7462, 100.5347" autocomplete="off"></label>
            <button class="btn btn-dark" type="submit">${icon('link', 18)}อ่านลิงก์</button>
          </form>
          <div class="muted small">ใน Google Maps: เลือกสถานที่ → กด "แชร์" → "คัดลอกลิงก์" แล้วนำมาวางที่นี่</div>
          <div id="preview">${previewHtml()}</div>`;
      } else {
        body = `<label class="field"><span>ค้นหาในสถานที่ที่เคยใช้ (${places.length})</span><input class="input" id="pq" placeholder="พิมพ์เพื่อกรอง" autocomplete="off"></label>
          <div id="saved" style="display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto"></div>`;
      }
      $('#add-box').innerHTML = `<b>เพิ่มสถานที่</b>
        <div class="tabs" role="tablist">${tabs.map(([k, t, ic]) => `<button type="button" role="tab" aria-selected="${st.tab === k}" class="${st.tab === k ? 'on' : ''}" data-tab="${k}">${t}</button>`).join('')}</div>${body}`;
      $$('[data-tab]', $('#add-box')).forEach((b) => b.addEventListener('click', () => { st.tab = b.dataset.tab; drawAdd(); }));

      if (st.tab === 'search') {
        let timer = null, seq = 0;
        const norm = (x) => String(x || '').toLowerCase().replace(/\s+/g, '');
        const savedMatches = (q) => {
          const words = q.toLowerCase().split(/\s+/).filter(Boolean);
          const nq = norm(q);
          return places.filter((p) => norm(p.name).includes(nq) || words.every((w) => (p.name + ' ' + (p.address || '')).toLowerCase().includes(w))).slice(0, 4)
            .map((p) => Object.assign({}, p, { src: 'saved' }));
        };
        const run = async (q, btn) => {
          if (!$('#results')) return;
          const my = ++seq;
          st.lastQ = q;
          if (q.length < 2) { st.results = null; $('#results').innerHTML = ''; return; }
          const saved = savedMatches(q);
          st.results = saved; st.searching = true;
          $('#results').innerHTML = resultsHtml(); bindResults();
          if (btn) busy(btn, true, 'กำลังค้นหา…');
          if (!st.session) st.session = Math.random().toString(36).slice(2) + Date.now().toString(36);
          try {
            const r = await API.call('suggestPlace', { q, session: st.session });
            if (my !== seq) return;
            const seen = new Set(saved.map((p) => p.name));
            st.results = saved.concat((r.items || []).filter((x) => !seen.has(x.name)).map((x) => Object.assign({ src: r.source }, x)));
          } catch (err) { if (my === seq && btn) toast(err.message, 'bad'); }
          finally { if (btn) busy(btn, false); }
          st.searching = false;
          if (my !== seq || !$('#results')) return;
          $('#results').innerHTML = resultsHtml();
          bindResults();
        };
        $('#q').addEventListener('input', (e) => {
          clearTimeout(timer);
          const q = e.target.value.trim();
          timer = setTimeout(() => run(q), 550);
        });
        $('#f-search').addEventListener('submit', (e) => {
          e.preventDefault();
          clearTimeout(timer);
          const q = $('#q').value.trim();
          if (q.length < 2) { toast('พิมพ์คำค้นหาอย่างน้อย 2 ตัวอักษร', 'bad'); return; }
          run(q, e.submitter || $('#f-search button'));
        });
        bindResults();
      } else if (st.tab === 'link') {
        $('#f-link').addEventListener('submit', async (e) => {
          e.preventDefault();
          const url = $('#link').value.trim();
          if (!url) { toast('กรุณาวางลิงก์', 'bad'); return; }
          const btn = e.submitter || $('#f-link button');
          busy(btn, true, 'กำลังอ่าน…');
          try {
            const r = await API.call('resolveLink', { url });
            st.preview = Object.assign({ address: '' }, r, { name: r.name || '' });
          } catch (err) { toast(err.message, 'bad'); }
          busy(btn, false);
          $('#preview').innerHTML = previewHtml();
          bindPreview();
        });
        bindPreview();
      } else {
        const drawSaved = () => {
          const q = ($('#pq').value || '').trim().toLowerCase();
          const list = places.filter((p) => !q || (p.name + ' ' + (p.address || '')).toLowerCase().includes(q)).slice(0, 60);
          $('#saved').innerHTML = list.length ? list.map((p, i) => `<div class="result"><span class="grow"><span class="t">${esc(p.name)}</span><div class="s">${esc(p.address || (UI.hasXY(p) ? p.lat + ', ' + p.lng : 'มีแค่ลิงก์'))}</div></span>
            <button type="button" class="btn btn-sm" data-add-saved="${places.indexOf(p)}">${icon('plus', 16)}เพิ่ม</button></div>`).join('')
            : '<div class="muted small">ยังไม่มีสถานที่ที่เคยใช้ — สถานที่จะถูกบันทึกอัตโนมัติเมื่อบันทึก Job</div>';
          $$('[data-add-saved]').forEach((b) => b.addEventListener('click', () => addStop(places[Number(b.dataset.addSaved)])));
        };
        $('#pq').addEventListener('input', drawSaved);
        drawSaved();
      }
    }
    function resultsHtml() {
      if (st.results === null) return '';
      const gq = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(st.lastQ || '')}`;
      const wait = st.searching ? `<div class="muted small" style="display:flex;gap:8px;align-items:center"><span class="spinner sm"></span>กำลังหาจาก Google…</div>` : '';
      if (!st.results.length) return wait || `<div class="banner info">ไม่พบสถานที่ — <a href="${esc(gq)}" target="_blank" rel="noopener">ลองค้นใน Google Maps</a> แล้วคัดลอกลิงก์มาวางในแท็บ "วางลิงก์"</div>`;
      return st.results.map((r, i) => `<div class="result">
          <span class="src-ico ${r.src === 'saved' ? 'saved' : ''}" aria-hidden="true">${icon(r.src === 'saved' ? 'clock' : 'pin', 16)}</span>
          <span class="grow"><span class="t">${esc(r.name)}${r.name_from === 'query' ? '<span class="name-from">ชื่อตามที่พิมพ์ — ตั้งชื่อเต็มตอนเพิ่ม</span>' : r.name_from === 'address' ? '<span class="name-from">ยังไม่มีชื่อ</span>' : ''}</span><div class="s">${r.src === 'saved' ? '<b>เคยใช้</b> · ' : ''}${esc(r.address || '')}</div></span>
          ${r.map_url ? `<a class="btn btn-sm btn-ghost" href="${esc(r.map_url)}" target="_blank" rel="noopener" aria-label="ดู ${esc(r.name)} ใน Google Maps">${icon('external', 16)}</a>` : ''}
          <button type="button" class="btn btn-sm btn-primary" data-add-res="${i}">${icon('plus', 16)}เพิ่ม</button></div>`).join('') + wait +
        `<a class="small" href="${esc(gq)}" target="_blank" rel="noopener">ไม่ใช่ที่ต้องการ? เปิดค้นใน Google Maps</a>`;
    }
    function bindResults() {
      $$('[data-add-res]').forEach((b) => b.addEventListener('click', async () => {
        const r = st.results[Number(b.dataset.addRes)];
        if (r.needs_details) {
          busy(b, true, '…');
          try { const d = await API.call('placeDetails', { place_id: r.place_id, session: st.session }); st.session = ''; addStop(d); }
          catch (e) { toast(e.message, 'bad'); busy(b, false); }
          return;
        }
        if (r.name_from === 'query' || r.name_from === 'address') return confirmName(r);
        addStop(r);
      }));
    }
    /* การค้นหาฟรีของ Google ส่งมาแค่ที่อยู่ ไม่มีชื่อสถานที่ → ให้ตั้งชื่อเต็มก่อนเพิ่ม (ชื่อจะถูกจำไว้ใน "สถานที่ที่เคยใช้") */
    function confirmName(r) {
      const m = UI.modal({
        title: 'ตั้งชื่อสถานที่',
        body: `<div class="banner info small">${icon('pin', 16)}<span>Google ส่งมาเป็นที่อยู่ ไม่มีชื่อสถานที่ — พิมพ์ชื่อเต็มให้คนขับเข้าใจง่าย เช่น "เซ็นทรัล ปิ่นเกล้า"</span></div>
          <label class="field"><span>ชื่อสถานที่ *</span><input class="input" id="cn-name" maxlength="120" value="${esc(r.name)}" autocomplete="off"></label>
          <div class="small muted">${esc(r.address || '')}</div>
          ${r.map_url ? `<a class="small" href="${esc(r.map_url)}" target="_blank" rel="noopener">ดูตำแหน่งใน Google Maps เพื่อเช็คชื่อ</a>` : ''}`,
        foot: `<button type="button" class="btn" data-close>ยกเลิก</button><button type="button" class="btn btn-primary" data-ok>${icon('plus', 18)}เพิ่มจุดนี้</button>`
      });
      const inp = m.el.querySelector('#cn-name');
      setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) { /* ไม่เป็นไร */ } }, 60);
      const go = () => {
        const name = inp.value.trim();
        if (!name) { toast('กรุณาใส่ชื่อสถานที่', 'bad'); return; }
        m.close();
        const p = Object.assign({}, r, { name });
        places.unshift(Object.assign({}, p, { used_count: 1 }));
        addStop(p);
      };
      m.el.querySelector('[data-ok]').addEventListener('click', go);
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
    }
    function previewHtml() {
      const p = st.preview;
      if (!p) return '';
      const xy = UI.hasXY(p);
      return `<div class="card card-pad" style="display:flex;flex-direction:column;gap:12px;background:#FAFBFC">
        ${p.approx ? `<div class="banner info">${icon('search', 18)}<span>ลิงก์นี้ (มักเป็นลิงก์แชร์จาก iPhone) ไม่มีพิกัดในตัว — ระบบหาพิกัดจากชื่อสถานที่ให้แล้ว <b>ตรวจดูหมุดว่าตรงจุดหรือไม่</b> ถ้าไม่ตรงกด "ปรับหมุด"</span></div>` : ''}
        ${xy ? `<iframe class="embed" title="ตัวอย่างตำแหน่ง" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${p.lat},${p.lng}&z=16&output=embed"></iframe>
               <div class="row" style="align-items:center"><span class="small muted grow">พิกัด ${Number(p.lat).toFixed(6)}, ${Number(p.lng).toFixed(6)}</span><button type="button" class="btn btn-sm" id="pv-pin">${icon('pin', 16)}ปรับหมุด</button></div>`
             : `<div class="banner warn">${icon('pin', 18)}<span>อ่านพิกัดจากลิงก์นี้ไม่ได้ — <b>ปักหมุดเองบนแผนที่</b> เพื่อให้ขึ้นแผนที่ อยู่ในเส้นทาง และตรวจรัศมีเช็คอินได้</span><button type="button" class="btn btn-sm btn-primary" id="pv-pin">${icon('pin', 16)}ปักหมุดเอง</button></div>`}
        <div class="grid g2">
          <label class="field"><span>ชื่อสถานที่ *</span><input class="input" id="pv-name" value="${esc(p.name)}" placeholder="ตั้งชื่อให้คนขับเข้าใจง่าย" maxlength="120"></label>
          <label class="field"><span>ที่อยู่ / จุดสังเกต</span><input class="input" id="pv-addr" value="${esc(p.address)}" maxlength="250"></label>
        </div>
        <div class="actions"><button type="button" class="btn btn-primary" id="pv-add">${icon('plus', 18)}เพิ่มจุดนี้</button><a href="${esc(p.map_url)}" target="_blank" rel="noopener" class="small">เปิดลิงก์</a></div>
      </div>`;
    }
    function bindPreview() {
      const b = $('#pv-add');
      if (!b) return;
      const pb = $('#pv-pin');
      if (pb) pb.addEventListener('click', async () => {
        const name = $('#pv-name').value.trim(), addr = $('#pv-addr').value.trim();
        const p = await UI.pickOnMap({ title: 'ปักหมุด · ' + (name || 'สถานที่ใหม่'), lat: st.preview.lat, lng: st.preview.lng, around: st.stops.map((x, k) => Object.assign({}, x, { seq: k + 1 })) });
        if (!p) return;
        Object.assign(st.preview, { lat: p.lat, lng: p.lng, approx: false, name, address: addr });
        $('#preview').innerHTML = previewHtml();
        bindPreview();
      });
      b.addEventListener('click', () => {
        const name = $('#pv-name').value.trim();
        if (!name) { toast('กรุณาตั้งชื่อสถานที่', 'bad'); $('#pv-name').focus(); return; }
        addStop(Object.assign({}, st.preview, { name, address: $('#pv-addr').value.trim() }));
        st.preview = null;
        drawAdd();
      });
    }

    async function save(btn) {
      const j = st.job;
      if (!j.date) return toast('กรุณาเลือกวันที่', 'bad');
      if (!j.driver_id) return toast('กรุณาเลือกคนขับ', 'bad');
      if (!j.vehicle_id && !String(j.plate || '').trim()) return toast('กรุณาเลือกรถ', 'bad');
      if (!st.stops.length) return toast('กรุณาเพิ่มสถานที่อย่างน้อย 1 จุด', 'bad');
      const empty = st.stops.findIndex((s) => !String(s.name || '').trim());
      if (empty >= 0) return toast(`สถานที่จุดที่ ${empty + 1} ยังไม่มีชื่อ`, 'bad');
      const noXY = st.stops.map((s, i) => (UI.hasXY(s) ? null : `${i + 1}. ${s.name}`)).filter(Boolean);
      if (noXY.length && !(await UI.confirmBox(`มี ${noXY.length} จุดที่ยังไม่มีพิกัด (${noXY.join(', ')}) — จุดนี้จะไม่ขึ้นบนแผนที่ ไม่อยู่ในเส้นทาง และตรวจรัศมีเช็คอินไม่ได้ แนะนำให้กด "หาพิกัดจากชื่อ" หรือ "ปักหมุดเอง" ก่อน`, 'บันทึกทั้งที่ไม่มีพิกัด'))) return;
      $$('[data-save]').forEach((b) => busy(b, true));
      try {
        const saved = await API.call('saveJob', {
          job: j,
          stops: st.stops.map((s) => ({ id: s.id, name: s.name, address: s.address, lat: s.lat, lng: s.lng, map_url: s.map_url, note: s.note, planned_time: s.planned_time }))
        });
        toast(`บันทึก ${saved.job_no} แล้ว`, 'good');
        location.hash = '#/admin/jobs/' + saved.id;
      } catch (e) {
        toast(e.message, 'bad');
        $$('[data-save]').forEach((b) => busy(b, false));
      }
    }
    $$('[data-save]').forEach((b) => b.addEventListener('click', () => save(b)));

    drawStops(); drawAdd(); drawMap(); drawSummary(); drawPick();
  };

  /* ====================== รายละเอียด Job ====================== */

            <div class="timeline">${job.stops.map((s) => stopTimeline(job, s)).join('')}</div>
          </section>

              <div style="grid-column:1/-1;flex-direction:row;align-items:center;gap:12px">${UI.avatar(job.driver_name, job.driver_photo_url, 48)}<div><span class="k">คนขับ</span><div class="v">${esc(job.driver_name)}</div></div></div>

  function stopTimeline(job, s) {
    const done = s.status === 'arrived';
    const diff = done ? UI.minutesDiff(s.planned_time, s.arrived_at) : null;
    const late = overdueMin(job, s);
    let timing = s.planned_time ? `นัด ${esc(s.planned_time)} น.` : 'ไม่ได้กำหนดเวลานัด';
    if (done) {
      timing += ` · <b style="color:var(--good-ink)">เช็คอิน ${esc(UI.fmtStamp(s.arrived_at))}</b>`;
      if (diff !== null && diff > 5) timing += ` <span class="tag warn">ช้า ${UI.fmtMin(diff)}</span>`;
      else if (diff !== null && diff < -5) timing += ` <span class="tag">ก่อนเวลา ${UI.fmtMin(-diff)}</span>`;
    } else if (late !== null && late > 0) {
      timing += ` <span class="tag warn">เลยเวลานัด ${UI.fmtMin(late)}</span>`;
    } else if (job.status !== 'cancelled' && isOverdue(job, s)) {
      timing += ' <span class="tag warn">ยังไม่เช็คอิน</span>';
    }
    const dist = done ? (s.checkin_dist_m !== null && s.checkin_dist_m !== undefined ? s.checkin_dist_m : UI.distanceM(s, { lat: s.arrive_lat, lng: s.arrive_lng })) : null;
    const radius = Number(job.checkin_radius_m) || 0;
    const photos = s.photos && s.photos.length ? s.photos : (s.photo_url ? [s.photo_url] : []);
    let distTag = '';
    if (done && dist !== null) {
      const inside = radius > 0 ? dist <= radius : dist <= 300;
      distTag = `<span class="tag ${inside ? 'good' : 'warn'}">${icon(inside ? 'check' : 'pin', 12)}เช็คอินห่างจุดนัด ${UI.fmtDist(dist)}${radius > 0 ? (inside ? ` · ในรัศมี ${radius} ม.` : ` · นอกรัศมี ${radius} ม.`) : ''}</span>`;
    } else if (done && s.arrive_lat === null) {
      distTag = `<span class="tag">${UI.hasXY(s) ? 'ไม่มีตำแหน่งตอนเช็คอิน' : 'จุดนี้ไม่ได้ปักหมุด'}</span>`;
    }
    return `<div class="tl-item ${done ? 'done' : ''}">
      <div class="num ${done ? 'done' : 'idle'}">${done ? icon('check', 16) : s.seq}</div>
      <div class="body">
        <span class="name">${esc(s.name)}</span>
        ${s.address ? `<span class="muted small">${esc(s.address)}</span>` : ''}
        <span class="small">${timing}</span>
        ${s.note ? `<span class="small muted">${icon('note', 14)} ${esc(s.note)}</span>` : ''}
        ${done ? `<div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
            ${photos.length ? `<div class="tl-photos">${photos.map((u, i) => `<button type="button" data-photo="${esc(u)}" data-cap="${esc(s.seq + '. ' + s.name + ' · รูปที่ ' + (i + 1) + '/' + photos.length)}" aria-label="ดูรูปเช็คอินที่ ${i + 1} ของ ${esc(s.name)}"><img src="${esc(u)}" alt="" loading="lazy" class="${i === 0 ? 'first' : ''}"></button>`).join('')}</div>` : ''}
            <div style="display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px">
              ${distTag}
              ${photos.length > 1 ? `<span class="tag">${photos.length} รูป</span>` : ''}
              ${s.arrive_lat !== null ? `<a class="small" href="https://www.google.com/maps/search/?api=1&query=${s.arrive_lat},${s.arrive_lng}" target="_blank" rel="noopener">ดูตำแหน่งที่เช็คอิน</a>` : ''}
            </div>
            ${s.checkin_note ? `<span style="font-size:14px">“${esc(s.checkin_note)}”</span>` : ''}
          </div>` : ''}
        <a class="small" href="${esc(UI.placeUrl(s))}" target="_blank" rel="noopener">ดูสถานที่ใน Google Maps</a>
      </div></div>`;
  }

  function photoField(url, round, label) {
    return `<div class="field"><span>${esc(label)}</span><div class="photo-field">
      <div class="prev ${round ? 'round' : ''}" data-prev>${url ? `<img src="${esc(url)}" alt="">` : icon(round ? 'users' : 'van', 32)}</div>
      <div class="actions"><button type="button" class="btn btn-sm" data-pick>${icon('camera', 16)}${url ? 'เปลี่ยนรูป' : 'เลือกรูป / ถ่ายรูป'}</button>
        <button type="button" class="btn btn-sm btn-ghost ${url ? '' : 'hidden'}" data-unpick>ลบรูป</button></div></div></div>`;
  }
  function bindPhotoField(root, round) {
    const st = { photo: null, removePhoto: false };
    const prev = root.querySelector('[data-prev]'), un = root.querySelector('[data-unpick]');
    root.querySelector('[data-pick]').addEventListener('click', async () => {
      const f = await UI.pickImage();
      if (!f) return;
      try {
        st.photo = await UI.resizeImage(f, API.isDemo() ? 360 : (round ? 600 : 1000), round);
        st.removePhoto = false;
        prev.innerHTML = `<img src="${st.photo}" alt="">`;
        un.classList.remove('hidden');
      } catch (e) { toast('อ่านรูปไม่ได้', 'bad'); }
    });
    un.addEventListener('click', () => {
      st.photo = null; st.removePhoto = true;
      prev.innerHTML = icon(round ? 'users' : 'van', 32);
      un.classList.add('hidden');
    });
    return { value: () => (st.photo ? { photo: st.photo } : st.removePhoto ? { removePhoto: true } : {}) };
  }

          <button class="btn btn-primary" type="submit">บันทึก</button>
        </form>
        <form class="card card-pad" id="st-radius" style="display:flex;flex-direction:column;gap:14px">
          <h2 style="font-size:18px">การเช็คอิน</h2>
          <label class="field"><span>รัศมีที่อนุญาตให้เช็คอิน (เมตร จากจุดที่ปักหมุด)</span>
            <input class="input" type="number" name="radius" min="0" max="5000" step="10" inputmode="numeric" value="" placeholder="100" required>
            <span class="hint">คนขับต้องอยู่ในรัศมีนี้ถึงจะถ่ายรูปเช็คอินได้ · ใส่ 0 = ไม่ตรวจรัศมี · แนะนำ 100–200 ม. (GPS ในตึกอาจคลาดเคลื่อน 20–50 ม.)</span></label>
          <div class="actions">${[50, 100, 200, 500].map((r) => `<button type="button" class="btn btn-sm" data-r="${r}">${r} ม.</button>`).join('')}</div>
          <span class="hint muted small">ถ่ายรูปได้สูงสุด 5 รูปต่อจุด · ระบบบันทึกตำแหน่งและระยะห่างจากจุดนัดทุกครั้ง</span>
          <button class="btn btn-primary" type="submit">บันทึก</button>
        </form>
        <form class="card card-pad" id="st-daily" style="display:flex;flex-direction:column;gap:14px">
          <h2 style="font-size:18px">ตรวจความพร้อม & GPS คนขับ</h2>
          <label class="switch-row"><input type="checkbox" name="daily"><span><b>บังคับตรวจความพร้อมประจำวัน</b>
            <span class="hint">คนขับถ่ายรูปรถ 3 รูป (ภายนอก · ป้ายทะเบียน · ภายใน) และติ๊กยืนยันข้อมูล วันละครั้ง ก่อนเช็คอินจุดแรก</span></span></label>
          <label class="switch-row"><input type="checkbox" name="gps"><span><b>ส่งตำแหน่ง GPS ของคนขับ</b>
            <span class="hint">ส่งเฉพาะตอนคนขับเปิดแอปไว้ (ล็อกจอหรือสลับไปแอปอื่นจะหยุดส่งชั่วคราว) · ดูตำแหน่งล่าสุดได้ที่หน้า ภาพรวม</span></span></label>
          <label class="field"><span>ส่งตำแหน่งทุก</span><select class="input" name="gpsmin">${[2, 3, 5, 10].map((n) => `<option value="${n}">${n} นาที</option>`).join('')}</select></label>
          <button class="btn btn-primary" type="submit">บันทึก</button>
        </form>
        <form class="card card-pad" id="st-places" style="display:flex;flex-direction:column;gap:14px" autocomplete="off">
          <h2 style="font-size:18px">ค้นหาสถานที่แบบ Google Maps <span class="muted" style="font-weight:500;font-size:14px">(ไม่บังคับ)</span></h2>
          <div class="hint muted small">ตอนนี้ใช้การค้นหาฟรีของ Google ซึ่งค้นชื่อร้านหรือชื่อย่อได้ไม่เก่งเท่าแอป Google Maps · ใส่ Google Places API key เพื่อให้คำแนะนำขณะพิมพ์เหมือน Google Maps — ใช้ฟรีประมาณ 5,000 ครั้ง/เดือน แต่ต้องเปิดบัญชี Google Cloud และผูกบัตร</div>
          <div id="pl-status"></div>
          <label class="field"><span>Google Places API key</span><input class="input mono" name="key" autocomplete="off" spellcheck="false" placeholder="AIza…"></label>
          <details class="small"><summary style="cursor:pointer;font-weight:600">วิธีขอ API key (5 ขั้นตอน)</summary>
            <ol class="steps-mini" style="margin-top:8px"><li>เข้า <a href="https://console.cloud.google.com/" target="_blank" rel="noopener">console.cloud.google.com</a> แล้วสร้างโปรเจกต์ใหม่</li>
              <li>เปิดการเรียกเก็บเงิน (Billing) และผูกบัตร</li><li>เมนู APIs &amp; Services › Library › เปิดใช้ "Places API (New)"</li>
              <li>Credentials › Create credentials › API key › กด Restrict key ให้ใช้ได้เฉพาะ Places API (New)</li><li>คัดลอก key มาวางที่นี่ แล้วกด บันทึกและทดสอบ</li></ol></details>
          <div class="actions"><button class="btn btn-primary" type="submit">บันทึกและทดสอบ</button><button type="button" class="btn btn-danger hidden" data-rmkey>ลบ key</button></div>
