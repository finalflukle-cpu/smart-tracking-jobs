        started_at: first ? first.arrived_at : '', finished_at: done === st.length && done ? st[st.length - 1].arrived_at : '' });
    }
    // เวลาอ้างอิงจากตอนนี้ เพื่อให้ข้อมูลตัวอย่างดูเหมือนกำลังทำงานจริง
    const nowMin = (() => { const [h, m] = UI.bkkNow().time.split(':').map(Number); return h * 60 + m; })();
    const T = (off) => { const v = Math.min(23 * 60 + 55, Math.max(5, nowMin + off)); return String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0'); };
    job(1, t, T(-180), 'ส่งนักเรียน โรงเรียนนานาชาติ', 'D1', 'ฮข 4521', '', [['ลานจอดรถบริษัท', T(-180), T(-181)], ['คอนโดลุมพินี', T(-165), T(-162)], ['โรงเรียนนานาชาติ', T(-135), T(-138)]]);
    job(2, t, T(-60), 'รับพนักงานกะเช้า', 'D1', 'ฮข 4521', 'โทรแจ้งพนักงานก่อนถึง 5 นาที', [['ลานจอดรถบริษัท', T(-60), T(-59)], ['หมู่บ้านพฤกษา', T(-40), T(-34)], ['เมกาบางนา', T(-10), ''], ['นิคมอุตสาหกรรมบางปู', T(25), '']]);
    job(3, t, T(-90), 'ทัวร์อยุธยา 1 วัน', 'D2', 'นข 7788', 'ลูกค้า 9 ท่าน รับที่ล็อบบี้', [['โรงแรมชาเทรียม', T(-90), T(-88)], ['วัดไชยวัฒนาราม', T(30), ''], ['วัดมหาธาตุ', T(150), ''], ['พระราชวังบางปะอิน', T(330), '']]);
    job(4, t, T(20), 'รับส่งสนามบิน', 'D3', '1กก 9032', 'เที่ยวบิน TG 103 รอที่ประตู 3', [['โรงแรมชาเทรียม', T(20), ''], ['ท่าอากาศยานสุวรรณภูมิ', T(80), '']]);
    job(5, t, T(120), 'รับพนักงานกะบ่าย', 'D4', 'ศร 1150', '', [['เมกาบางนา', T(120), ''], ['หมู่บ้านพฤกษา', T(140), ''], ['นิคมอุตสาหกรรมบางปู', T(180), '']]);
    job(1, tm, '07:30', 'งานสัมมนา ไบเทค', 'D1', 'ฮข 4521', '', [['สยามพารากอน', '07:30', ''], ['ไบเทค บางนา', '08:30', '']]);
    PLACES.forEach((p, i) => db.places.push(Object.assign({ id: 'P' + i, map_url: `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`, used_count: 1, last_used: '' }, p)));
    return db;
  }

  function load() {
    try {
      const db = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (db && db.jobs) return db;
    } catch (e) { /* สร้างใหม่ */ }
    const db = seed();
    save(db);
    return db;
  }
  function save(db) {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { fail('พื้นที่เก็บข้อมูลตัวอย่างเต็ม — กด "รีเซ็ตข้อมูลตัวอย่าง" ด้านบน'); }
  }
  function fail(msg, code) { const e = new Error(msg); e.app = true; e.code = code || ''; throw e; }
  const uid = () => Math.random().toString(36).slice(2, 12);
  const clean = (v, max) => String(v === null || v === undefined ? '' : v).trim().slice(0, max || 200);
  const num = (v) => (v === '' || v === null || v === undefined || !isFinite(Number(v)) ? null : Number(v));
  const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));

  function auth(db, req, role) {
    const s = db.sessions.find((x) => x.token === req.token);
    if (!s) fail('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่', 'AUTH');
    if (role && s.role !== role) fail('ไม่มีสิทธิ์ใช้งานส่วนนี้', 'FORBIDDEN');
    return s;
  }
  const radius = (db) => (db.settings.checkin_radius_m === undefined ? 100 : Number(db.settings.checkin_radius_m) || 0);
  function decorate(db, j) {
    const stops = db.stops.filter((s) => s.job_id === j.id).sort((a, b) => a.seq - b.seq)
      .map((s) => Object.assign({}, s, { photos: s.photos || (s.photo_url ? [s.photo_url] : []) }));
    const d = db.drivers.find((x) => x.id === j.driver_id);
    return Object.assign({}, j, { driver_name: d ? d.name : '(ไม่พบคนขับ)', stops,
      total_count: stops.length, done_count: stops.filter((s) => s.status === 'arrived').length, checkin_radius_m: radius(db) });
  }
  const sortJobs = (a, b) => ((a.date + (a.time || '99:99') + a.job_no) < (b.date + (b.time || '99:99') + b.job_no) ? -1 : 1);

  const A = {
    ping: (db) => ({ app: 'Smart Tracking Jobs', version: 'demo', company: db.settings.company_name, checkin_radius_m: radius(db) }),
    publicDrivers: (db) => db.drivers.filter((d) => d.active === 'true').map((d) => ({ id: d.id, name: d.name }))
      .sort((a, b) => a.name.localeCompare(b.name, 'th')),
    login(db, req) {
      if (!/^\d{6}$/.test(String(req.pin || ''))) fail('PIN ต้องเป็นตัวเลข 6 หลัก');
      let user, role = req.role;
      if (role === 'admin') {
        if (req.pin !== db.settings.admin_pin) fail('PIN ไม่ถูกต้อง', 'BAD_PIN');
        user = { id: 'admin', name: 'แอดมิน' };
      } else {
        const d = db.drivers.find((x) => x.id === req.driverId && x.active === 'true');
        if (!d) fail('ไม่พบชื่อคนขับนี้ หรือถูกปิดการใช้งานแล้ว');
        if (req.pin !== d.pin) fail('PIN ไม่ถูกต้อง', 'BAD_PIN');
        user = { id: d.id, name: d.name };
      }
      const token = uid() + uid();
      db.sessions.push({ token, role, user_id: user.id, name: user.name });
      const out = { token, role, user, company: db.settings.company_name };
      if (role === 'admin') out.pinDefault = db.settings.admin_pin_default === 'true';
      return out;
    },
    logout(db, req) { db.sessions = db.sessions.filter((s) => s.token !== req.token); return true; },
    me(db, req) {
      const s = auth(db, req);
      return { role: s.role, user: { id: s.user_id, name: s.name }, company: db.settings.company_name,
        pinDefault: s.role === 'admin' ? db.settings.admin_pin_default === 'true' : undefined };
    },
    changeAdminPin(db, req) {
      auth(db, req, 'admin');
      if (req.oldPin !== db.settings.admin_pin) fail('PIN เดิมไม่ถูกต้อง');
      if (!/^\d{6}$/.test(String(req.newPin || ''))) fail('PIN ใหม่ต้องเป็นตัวเลข 6 หลัก');
      if (req.newPin === '000000') fail('ห้ามใช้ 000000 เป็น PIN ใหม่');
      db.settings.admin_pin = req.newPin;
      db.settings.admin_pin_default = 'false';
      return true;
    },
    saveSettings(db, req) {
      auth(db, req, 'admin');
      if (req.company_name !== undefined) {
        const name = clean(req.company_name, 80);
        if (!name) fail('กรุณาใส่ชื่อบริษัท');
        db.settings.company_name = name;
      }
      if (req.checkin_radius_m !== undefined) {
        const r = Number(req.checkin_radius_m);
        if (!isFinite(r) || r < 0 || r > 5000 || Math.round(r) !== r) fail('รัศมีเช็คอินต้องเป็นตัวเลข 0–5000 เมตร');
        db.settings.checkin_radius_m = String(r);
      }
      return { company: db.settings.company_name, checkin_radius_m: radius(db) };
    },
    listDrivers(db, req) {
      auth(db, req, 'admin');
      return db.drivers.map((d) => ({ id: d.id, name: d.name, active: d.active === 'true', created_at: d.created_at }))
        .sort((a, b) => (a.active !== b.active ? (a.active ? -1 : 1) : a.name.localeCompare(b.name, 'th')));
    },
    saveDriver(db, req) {
      auth(db, req, 'admin');
      const d = req.driver || {};
      const name = clean(d.name, 60).replace(/\s+/g, ' ');
      const pin = d.pin ? String(d.pin) : '';
      const active = !(d.active === false || d.active === 'false');
      if (!name) fail('กรุณาใส่ชื่อคนขับ');
      if (pin && !/^\d{6}$/.test(pin)) fail('PIN ต้องเป็นตัวเลข 6 หลัก');
      if (active && db.drivers.some((x) => x.active === 'true' && x.id !== d.id && x.name.toLowerCase() === name.toLowerCase())) fail(`มีคนขับชื่อ "${name}" อยู่แล้ว`);
      if (d.id) {
        const cur = db.drivers.find((x) => x.id === d.id);
        if (!cur) fail('ไม่พบคนขับ');
        cur.name = name; cur.active = active ? 'true' : 'false';
        if (pin) cur.pin = pin;
        if (pin || !active) db.sessions = db.sessions.filter((s) => !(s.role === 'driver' && s.user_id === cur.id));
        return { id: cur.id, name, active };
      }
      if (!pin) fail('กรุณาตั้ง PIN 6 หลักให้คนขับ');
      const id = 'D' + uid();
      db.drivers.push({ id, name, pin, active: 'true', created_at: UI.bkkNow().stamp });
      return { id, name, active: true };
    },
    listJobs(db, req) {
      const s = auth(db, req);
      const t = UI.today();
      if (s.role === 'driver') {
        const from = UI.addDays(t, -1), to = UI.addDays(t, 30);
        return db.jobs.filter((j) => j.driver_id === s.user_id && j.status !== 'cancelled' &&
          ((j.date >= from && j.date <= to) || (j.date < t && j.status !== 'done'))).map((j) => decorate(db, j)).sort(sortJobs);
      }
      let f = String(req.from || t), to = String(req.to || f);
      if (!isDate(f) || !isDate(to)) fail('วันที่ไม่ถูกต้อง');
      if (to < f) [f, to] = [to, f];
      return db.jobs.filter((j) => j.date >= f && j.date <= to).map((j) => decorate(db, j)).sort(sortJobs);
    },
    getJob(db, req) {
      const s = auth(db, req);
      const j = db.jobs.find((x) => x.id === req.id);
      if (!j) fail('ไม่พบ Job นี้');
      if (s.role === 'driver' && j.driver_id !== s.user_id) fail('Job นี้ไม่ใช่งานของคุณ', 'FORBIDDEN');
      return decorate(db, j);
    },
    saveJob(db, req) {
      auth(db, req, 'admin');
      const inp = req.job || {}, stopsIn = req.stops || [];
      if (!isDate(inp.date)) fail('กรุณาเลือกวันที่');
      if (!inp.driver_id) fail('กรุณาเลือกคนขับ');
      const plate = clean(inp.plate, 20);
      if (!plate) fail('กรุณาใส่ทะเบียนรถ');
      if (!stopsIn.length) fail('กรุณาเพิ่มสถานที่อย่างน้อย 1 จุด');
      if (stopsIn.length > 25) fail('เพิ่มสถานที่ได้สูงสุด 25 จุดต่อ Job');
      const drv = db.drivers.find((d) => d.id === inp.driver_id);
      if (!drv) fail('ไม่พบคนขับที่เลือก');
      let job = inp.id ? db.jobs.find((j) => j.id === inp.id) : null;
      if (inp.id && !job) fail('ไม่พบ Job นี้');
      if (job && job.status === 'cancelled') fail('Job นี้ถูกยกเลิกแล้ว แก้ไขไม่ได้');
      if (drv.active !== 'true' && !(job && job.driver_id === drv.id)) fail('คนขับคนนี้ถูกปิดการใช้งาน');
      const old = job ? db.stops.filter((s) => s.job_id === job.id) : [];
      const keep = new Set(stopsIn.map((s) => s.id).filter(Boolean));
      old.forEach((o) => { if (o.status === 'arrived' && !keep.has(o.id)) fail(`ลบ "${o.name}" ไม่ได้ เพราะคนขับเช็คอินแล้ว`); });
      if (job && job.driver_id !== drv.id && job.status !== 'pending') fail('เปลี่ยนคนขับไม่ได้ เพราะเริ่มงานไปแล้ว');
      const id = job ? job.id : 'J' + uid();
      let jobNo = job && job.job_no;
      if (!jobNo) {
        const prefix = 'JOB-' + inp.date.slice(2).replace(/-/g, '') + '-';
        const max = db.jobs.filter((j) => j.job_no.startsWith(prefix)).reduce((m, j) => Math.max(m, Number(j.job_no.slice(prefix.length)) || 0), 0);
        jobNo = prefix + String(max + 1).padStart(2, '0');
      }
      const now = UI.bkkNow().stamp;
      db.stops = db.stops.filter((s) => s.job_id !== id);
      let arrived = 0;
      stopsIn.forEach((s, i) => {
        const name = clean(s.name, 120);
        if (!name) fail(`สถานที่จุดที่ ${i + 1} ยังไม่มีชื่อ`);
        const o = old.find((x) => x.id === s.id);
        if (o && o.status === 'arrived') arrived++;
        db.stops.push(Object.assign({}, o || {}, {
          id: o ? o.id : 'S' + uid(), job_id: id, seq: i + 1, name, address: clean(s.address, 250),
          lat: num(s.lat), lng: num(s.lng), map_url: clean(s.map_url, 1500), note: clean(s.note, 300),
          planned_time: /^\d{2}:\d{2}$/.test(s.planned_time || '') ? s.planned_time : '',
          status: o ? o.status : 'pending'
        }, o ? {} : { arrived_at: '', arrive_lat: null, arrive_lng: null, photo_id: '', photo_url: '', checkin_note: '' }));
      });
      const status = arrived === 0 ? 'pending' : arrived === stopsIn.length ? 'done' : 'in_progress';
      const rec = { id, job_no: jobNo, date: inp.date, time: /^\d{2}:\d{2}$/.test(inp.time || '') ? inp.time : '', title: clean(inp.title, 120),
        driver_id: drv.id, plate, note: clean(inp.note, 500), status, route_polyline: '', distance_km: null, duration_min: null,
        created_at: job ? job.created_at : now, updated_at: now, started_at: job ? job.started_at : '',
        finished_at: status === 'done' ? (job && job.finished_at) || now : '' };
      if (job) Object.assign(job, rec); else db.jobs.push(rec);
      stopsIn.forEach((s) => {
        const hit = db.places.find((p) => p.name === clean(s.name, 120));
        if (hit) { hit.used_count = (hit.used_count || 0) + 1; hit.last_used = now; }
        else db.places.push({ id: 'P' + uid(), name: clean(s.name, 120), address: clean(s.address, 250), lat: num(s.lat), lng: num(s.lng), map_url: clean(s.map_url, 1500), used_count: 1, last_used: now });
      });
      return decorate(db, db.jobs.find((j) => j.id === id));
    },
    cancelJob(db, req) {
      auth(db, req, 'admin');
      const j = db.jobs.find((x) => x.id === req.id);
      if (!j) fail('ไม่พบ Job นี้');
      if (j.status === 'done') fail('Job นี้เสร็จแล้ว ยกเลิกไม่ได้');
      j.status = 'cancelled';
      return decorate(db, j);
    },
    deleteJob(db, req) {
      auth(db, req, 'admin');
      const j = db.jobs.find((x) => x.id === req.id);
      if (!j) fail('ไม่พบ Job นี้');
      if (db.stops.some((s) => s.job_id === j.id && s.status === 'arrived')) fail('มีการเช็คอินแล้ว ลบไม่ได้ — ใช้ "ยกเลิก Job" แทน');
      db.stops = db.stops.filter((s) => s.job_id !== j.id);
      db.jobs = db.jobs.filter((x) => x.id !== j.id);
      return true;
    },
    checkIn(db, req) {
      const s = auth(db, req, 'driver');
      const photos = Array.isArray(req.photos) ? req.photos : (req.photo ? [req.photo] : []);
      if (!photos.length) fail('กรุณาถ่ายรูปเช็คอินอย่างน้อย 1 รูป');
      if (photos.length > 5) fail('แนบรูปได้สูงสุด 5 รูปต่อจุด');
      if (photos.some((p) => !/^data:image\//.test(String(p)))) fail('รูปเช็คอินไม่ถูกต้อง กรุณาถ่ายใหม่');
      const st = db.stops.find((x) => x.id === req.stopId);
      if (!st) fail('ไม่พบสถานที่นี้ใน Job');
      const j = db.jobs.find((x) => x.id === st.job_id);
      if (!j || j.driver_id !== s.user_id) fail('สถานที่นี้ไม่ใช่งานของคุณ', 'FORBIDDEN');
      if (j.status === 'cancelled') fail('Job นี้ถูกยกเลิกแล้ว');
      if (st.status === 'arrived') fail('จุดนี้เช็คอินไปแล้ว');
      const now = UI.bkkNow().stamp;
      // โหมดตัวอย่างไม่บังคับรัศมี (ผู้ทดลองอยู่ไกลจากสถานที่ตัวอย่าง) แต่บันทึกระยะไว้ให้ดู
      const d = UI.distanceM(st, { lat: num(req.lat), lng: num(req.lng) });
      Object.assign(st, { status: 'arrived', arrived_at: now, arrive_lat: num(req.lat), arrive_lng: num(req.lng),
        photo_id: 'demo', photo_url: photos[0], photos, checkin_note: clean(req.note, 300),
        checkin_dist_m: d, checkin_acc_m: num(req.acc) === null ? null : Math.round(num(req.acc)) });
      const all = db.stops.filter((x) => x.job_id === j.id);
      const done = all.filter((x) => x.status === 'arrived').length;
      if (!j.started_at) j.started_at = now;
      j.status = done >= all.length ? 'done' : 'in_progress';
      if (j.status === 'done') j.finished_at = now;
      j.updated_at = now;
      return decorate(db, j);
    },
    searchPlace(db, req) {
      auth(db, req, 'admin');
      const q = clean(req.q, 150);
      if (q.length < 2) fail('พิมพ์คำค้นหาอย่างน้อย 2 ตัวอักษร');
      const co = UI.parseMapsUrl(q);
      if (co.lat !== null) return [{ name: 'พิกัด ' + q, address: '', lat: co.lat, lng: co.lng, map_url: `https://www.google.com/maps/search/?api=1&query=${co.lat},${co.lng}` }];
      const words = q.toLowerCase().split(/\s+/).filter(Boolean);
      return PLACES.filter((p) => words.every((w) => (p.name + ' ' + p.address).toLowerCase().includes(w))).slice(0, 6)
        .map((p) => ({ name: p.name, address: p.address, lat: p.lat, lng: p.lng, map_url: `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}` }));
    },
    resolveLink(db, req) {
      auth(db, req, 'admin');
      const m = String(req.url || '').match(/https:\/\/\S+/) || [String(req.url || '').trim()];
      const info = UI.parseMapsUrl(m[0]);
      if (info.lat === null && /goo\.gl|g\.co/.test(m[0])) {
        fail('โหมดตัวอย่างอ่านลิงก์แบบย่อ (maps.app.goo.gl) ไม่ได้ — ระบบจริงอ่านได้ ลองลิงก์แบบเต็มหรือพิกัด เช่น 13.7462, 100.5347');
      }
      if (info.lat === null && !/^https:\/\//.test(m[0])) fail('กรุณาวางลิงก์จาก Google Maps (ขึ้นต้นด้วย https://)');
      return { name: info.name, lat: info.lat, lng: info.lng, map_url: /^https:/.test(m[0]) ? m[0] : `https://www.google.com/maps/search/?api=1&query=${info.lat},${info.lng}` };
    },
    listPlaces(db, req) {
      auth(db, req, 'admin');
      return db.places.slice().sort((a, b) => (b.used_count || 0) - (a.used_count || 0));
    }
  };

  window.DemoBackend = {
    reset() { localStorage.removeItem(KEY); },
    async handle(req) {
      await new Promise((r) => setTimeout(r, req.action === 'checkIn' ? 700 : 180));
      const db = load();
      try {
        const fn = A[req.action];
        if (!fn) fail('ไม่รู้จักคำสั่ง: ' + req.action);
        const data = fn(db, req);
        save(db);
        return { ok: true, data: JSON.parse(JSON.stringify(data === undefined ? null : data)) };
      } catch (e) {
        if (e.app) return { ok: false, error: e.message, code: e.code };
        console.error(e);
        return { ok: false, error: 'เกิดข้อผิดพลาด: ' + e.message };
      }
    }
  };
})();

</script>
<script>/* ---- assets/api.js ---- */
/* เชื่อมต่อระบบหลังบ้าน (Google Apps Script) หรือโหมดตัวอย่าง */
(function () {
  'use strict';
  const CONFIG = window.STJ_CONFIG || {};
  const K = { api: 'stj_api_url', demo: 'stj_demo_mode', sess: 'stj_session' };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* โหมดส่วนตัว */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* โหมดส่วนตัว */ } }
  };

  // รับลิงก์ระบบจาก ?api=... (ลิงก์ที่แอดมินส่งให้คนขับ) หรือ ?demo=1
  (function readParams() {
    const p = new URLSearchParams(location.search);
    let changed = false;
    if (p.get('api')) { store.set(K.api, p.get('api').trim()); store.del(K.demo); p.delete('api'); changed = true; }
    if (p.get('demo') === '1') { store.set(K.demo, '1'); p.delete('demo'); changed = true; }
    if (changed) {
      const q = p.toString();
      history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
    }
  })();

  const isDemo = () => store.get(K.demo) === '1';
  const apiUrl = () => (CONFIG.API_URL || store.get(K.api) || '').trim();
  const scope = () => (isDemo() ? 'demo' : apiUrl());

  function session() {
    try {
      const s = JSON.parse(store.get(K.sess) || 'null');
      return s && s.scope === scope() ? s : null;
    } catch (e) { return null; }
  }
  function setSession(data) {
    store.set(K.sess, JSON.stringify(Object.assign({}, data, { scope: scope() })));
  }
  function patchSession(patch) {
    const s = session();
    if (s) setSession(Object.assign(s, patch));
  }
  const clearSession = () => store.del(K.sess);

  class ApiError extends Error {
    constructor(msg, code) { super(msg); this.code = code || ''; }
  }

  async function call(action, payload) {
    const s = session();
    const body = Object.assign({ action }, payload || {}, s ? { token: s.token } : {});
    let res;
    if (isDemo()) {
      res = await window.DemoBackend.handle(body);
    } else {
      const url = apiUrl();
      if (!url) throw new ApiError('ยังไม่ได้เชื่อมต่อระบบหลังบ้าน', 'SETUP');
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), action === 'checkIn' ? 120000 : 45000);
      try {
        const r = await fetch(url, {
          method: 'POST', redirect: 'follow', signal: ctrl.signal,
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body)
        });
        const text = await r.text();
        try { res = JSON.parse(text); } catch (e) {
          throw new ApiError('ระบบหลังบ้านตอบกลับไม่ถูกต้อง — ตรวจสอบว่าตั้งสิทธิ์เว็บแอปเป็น "ทุกคน"', 'BAD_RESPONSE');
        }
      } catch (e) {
        if (e instanceof ApiError) throw e;
        if (e.name === 'AbortError') throw new ApiError('ใช้เวลานานเกินไป ลองใหม่อีกครั้ง', 'TIMEOUT');
        throw new ApiError('เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', 'NETWORK');
      } finally {
        clearTimeout(timer);
      }
    }
    if (!res || !res.ok) {
      const err = new ApiError((res && res.error) || 'เกิดข้อผิดพลาด', res && res.code);
      if (err.code === 'AUTH' && action !== 'login') {
        clearSession();
        setTimeout(() => { location.hash = '#/login'; }, 0);
      }
      throw err;
    }
    return res.data;
  }

  async function testUrl(url) {
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/i.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(url)) {
      throw new ApiError('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/macros/s/… และลงท้ายด้วย /exec');
    }
    let r;
    try {
      r = await fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'ping' }) });
    } catch (e) {
      throw new ApiError('เชื่อมต่อไม่ได้ — ตรวจสอบว่าตั้ง "ผู้ที่มีสิทธิ์เข้าถึง: ทุกคน" แล้ว');
    }
    let j;
    try { j = JSON.parse(await r.text()); } catch (e) {
      throw new ApiError('ลิงก์นี้ไม่ใช่ระบบ Smart Tracking หรือยังไม่ได้ตั้งสิทธิ์เป็น "ทุกคน"');
    }
    if (!j.ok) throw new ApiError(j.error || 'ระบบหลังบ้านมีปัญหา');
    return j.data;
  }

  window.API = {
    call, testUrl, isDemo, apiUrl, session, setSession, patchSession, clearSession, ApiError,
    ready: () => isDemo() || !!apiUrl(),
    lockedUrl: () => !!CONFIG.API_URL,
    setApiUrl(url) { store.set(K.api, url.trim()); store.del(K.demo); clearSession(); },
    enableDemo() { store.set(K.demo, '1'); clearSession(); },
    disableDemo() { store.del(K.demo); clearSession(); },
    driverLink() {
      const base = location.origin + location.pathname;
      return isDemo() ? base + '?demo=1#/login' : base + (CONFIG.API_URL ? '' : '?api=' + encodeURIComponent(apiUrl())) + '#/login';
    }
  };
})();

</script>
<script>/* ---- assets/admin.js ---- */
/* หน้าจอฝั่งเจ้าของ / แอดมิน */
(function () {
  'use strict';
  const { $, $$, esc, icon, chip, toast, busy } = UI;
  const V = (window.Views = window.Views || {});

  /* ---------- โครงหน้า ---------- */
  function shell(active, inner) {
    const s = API.session() || {};
    const items = [['#/admin', 'ภาพรวม', 'home', 'home'], ['#/admin/jobs', 'Job', 'list', 'jobs'],
      ['#/admin/drivers', 'คนขับ', 'users', 'drivers'], ['#/admin/settings', 'ตั้งค่า', 'settings', 'settings']];
    return `${App.demoBar()}
    <header class="topbar"><div class="topbar-in">
      <a class="brand" href="#/admin">${UI.brandMark()}<span class="brand-text"><b>Smart Tracking</b><span>${esc(s.company || '')}</span></span></a>
      <nav class="nav" aria-label="เมนูหลัก">${items.map(([h, t, ic, key]) =>
        `<a href="${h}" class="${key === active ? 'on' : ''}" ${key === active ? 'aria-current="page"' : ''}>${icon(ic, 18)}${t}</a>`).join('')}</nav>
      <div class="top-user"><span class="avatar" aria-hidden="true">A</span>
        <span class="who" style="display:flex;flex-direction:column;line-height:1.2"><b style="font-size:14px">แอดมิน</b><span style="font-size:12px;color:#A9B8C8">เจ้าของ</span></span>
        <button type="button" class="icon-btn" data-logout aria-label="ออกจากระบบ" title="ออกจากระบบ">${icon('logout')}</button></div>
    </div></header>
    <main class="page">${inner}</main>`;
  }
  function mount(active, inner) {
    $('#app').innerHTML = shell(active, inner);
    App.bindCommon();
  }
  const loading = (t) => `<div class="loading-block"><span class="spinner"></span>${esc(t || 'กำลังโหลด…')}</div>`;
  const errorBox = (e) => `<div class="banner bad">${esc(e.message || e)}</div>`;
  function pinBanner() {
    const s = API.session();
    return s && s.pinDefault ? `<div class="banner warn">${icon('lock', 18)}<span>ยังใช้ PIN แอดมินเริ่มต้น <b>000000</b> — เพื่อความปลอดภัยควรเปลี่ยนทันที</span><a href="#/admin/settings">เปลี่ยน PIN</a></div>` : '';
  }
  function isOverdue(job, stop) {
    if (stop.status === 'arrived' || job.status === 'cancelled') return false;
    const now = UI.bkkNow();
    if (job.date < now.date) return true;
    return job.date === now.date && stop.planned_time && stop.planned_time < now.time;
  }
  function overdueMin(job, stop) {
    if (!isOverdue(job, stop) || job.date !== UI.today() || !stop.planned_time) return null;
    const [h, m] = stop.planned_time.split(':').map(Number);
    const [nh, nm] = UI.bkkNow().time.split(':').map(Number);
    return nh * 60 + nm - (h * 60 + m);
  }
  const dotColor = (st) => ({ pending: '#8A96A3', in_progress: 'var(--brand)', done: 'var(--good)', cancelled: 'var(--bad)' }[st]);

  /* ====================== ภาพรวม ====================== */
  V.dashboard = async function () {
    const st = { date: App.state.dashDate || UI.today(), jobs: [], sel: App.state.dashSel || null, at: '' };
    mount('home', `
      ${pinBanner()}
      <div class="page-head">
        <div><h1>ภาพรวม</h1><div class="sub" id="d-sub">${esc(UI.fmtDate(st.date))}</div></div>
        <div class="actions">
          <label class="sr-only" for="d-date">เลือกวันที่</label>
          <input type="date" id="d-date" class="input" style="width:auto" value="${esc(st.date)}">
          <button type="button" class="btn" id="d-refresh">${icon('refresh', 18)}รีเฟรช</button>
          <a href="#/admin/jobs/new" class="btn btn-primary">${icon('plus', 18)}สร้าง Job</a>
        </div>
      </div>
      <div class="tiles" id="d-tiles">${loading()}</div>
      <div class="split stretch">
        <section class="main card map-card" aria-label="แผนที่เส้นทาง">
          <div class="card-head"><h2 id="d-maptitle">เส้นทาง</h2>
            <div class="legend"><span><i class="dot" style="background:var(--good)"></i>เช็คอินแล้ว</span><span><i class="dot" style="background:var(--brand)"></i>จุดถัดไป</span><span><i class="dot" style="background:#fff;border:2px solid var(--brand)"></i>ยังไม่ถึง</span><span><i class="dot" style="background:#7C3AED"></i>ตำแหน่งที่เช็คอิน</span></div>
          </div>
          <div class="map" id="d-map"></div>
        </section>
        <aside class="side" aria-label="รายละเอียด Job" id="d-side">${loading()}</aside>
      </div>
      <section class="card" aria-label="Job ของวัน">
        <div class="card-head"><h2>Job ของวัน</h2><span class="muted small" id="d-at"></span></div>
        <div id="d-table">${loading()}</div>
      </section>`);

    async function load(silent) {
      if (!silent) $('#d-refresh').disabled = true;
      try {
        st.jobs = await API.call('listJobs', { from: st.date, to: st.date });
        st.at = UI.bkkNow().time;
        if (!st.jobs.some((j) => j.id === st.sel)) {
          const pick = st.jobs.find((j) => j.status === 'in_progress') || st.jobs.find((j) => j.status === 'pending') || st.jobs[0];
          st.sel = pick ? pick.id : null;
        }
        draw();
      } catch (e) {
        if (!silent) { $('#d-table').innerHTML = errorBox(e); $('#d-side').innerHTML = ''; $('#d-tiles').innerHTML = ''; }
      } finally {
        const b = $('#d-refresh'); if (b) b.disabled = false;
      }
    }

    function draw() {
      const live = st.jobs.filter((j) => j.status !== 'cancelled');
      const overdue = live.reduce((n, j) => n + j.stops.filter((s) => isOverdue(j, s)).length, 0);
      $('#d-tiles').innerHTML = `
        <div class="tile"><span class="k">Job ทั้งหมด</span><span class="v">${live.length}</span></div>
        <div class="tile blue"><span class="k">กำลังทำ</span><span class="v">${live.filter((j) => j.status === 'in_progress').length}</span></div>
        <div class="tile green"><span class="k">เสร็จแล้ว</span><span class="v">${live.filter((j) => j.status === 'done').length}</span></div>
        <div class="tile ${overdue ? 'orange' : ''}"><span class="k">จุดที่เลยเวลานัด</span><span class="v">${overdue}</span></div>`;
      $('#d-at').textContent = `อัปเดตล่าสุด ${st.at} น. · กดรีเฟรชเพื่อดูข้อมูลใหม่`;
      $('#d-sub').textContent = UI.fmtDate(st.date) + (st.date === UI.today() ? ' (วันนี้)' : '');
      drawSide();
      drawMap();
      drawTable();
    }

    function drawMap() {
      const job = st.jobs.find((j) => j.id === st.sel);
      $('#d-maptitle').innerHTML = job ? `เส้นทาง · <span class="mono">${esc(job.job_no)}</span>` : 'เส้นทาง';
      UI.renderMap($('#d-map'), job ? job.stops : [], {
        polyline: job && job.route_polyline, showCheckins: true, markNext: true, radius: job && job.checkin_radius_m,
        emptyText: job ? 'Job นี้ยังไม่มีพิกัดสถานที่' : 'ไม่มี Job ในวันที่เลือก'
      });
    }

    function drawSide() {
      const job = st.jobs.find((j) => j.id === st.sel);
      let html = '';
      if (job) {
        const nx = UI.nextStop(job);
        const last = UI.lastCheckin(job);
        const late = nx ? overdueMin(job, nx) : null;
        html += `<div class="card card-pad" style="display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="mono" style="font-size:16px">${esc(job.job_no)}</span>${chip(job.status)}</div>
          <div style="font-size:18px;font-weight:700;line-height:1.35">${esc(UI.jobTitle(job))}</div>
          <div class="kv">
            <div><span class="k">คนขับ</span><span class="v">${esc(job.driver_name)}</span></div>
            <div><span class="k">ทะเบียนรถ</span><span class="v mono">${esc(job.plate)}</span></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;justify-content:space-between;font-size:14px"><span class="muted">ความคืบหน้า</span><b>${job.done_count}/${job.total_count} จุด</b></div>
            ${UI.progressBar(job)}
          </div>
          <div class="kv">
            <div><span class="k">จุดถัดไป</span><span class="v">${nx ? esc(nx.name) : '— ครบทุกจุด'}</span></div>
            <div><span class="k">เวลานัด</span><span class="v">${nx && nx.planned_time ? esc(nx.planned_time) + ' น.' : '-'}</span></div>
          </div>
          ${late !== null && late > 0 ? `<div class="banner warn">${icon('clock', 18)}เลยเวลานัด ${UI.fmtMin(late)} ยังไม่เช็คอิน</div>` : ''}
          ${last ? `<div style="display:flex;gap:12px;align-items:center">
              ${last.photo_url ? `<button type="button" class="tl-photo-btn" data-photo="${esc(last.photo_url)}" data-cap="${esc(last.name)}" style="padding:0;border:0;background:none;cursor:zoom-in;border-radius:10px;overflow:hidden;flex:none"><img src="${esc(last.photo_url)}" alt="รูปเช็คอินล่าสุด" style="width:88px;height:66px;object-fit:cover;background:#E8EDF1"></button>` : ''}
              <div class="info-row"><span class="k">เช็คอินล่าสุด</span><span class="v">${esc(UI.hhmm(last.arrived_at))} น. · ${esc(last.name)}</span></div></div>` : ''}
          <div class="actions">
            <a class="btn btn-primary" href="#/admin/jobs/${esc(job.id)}">ดูรายละเอียด</a>
            <a class="btn" href="${esc(UI.routeUrl(job.stops))}" target="_blank" rel="noopener">${icon('nav', 18)}Google Maps</a>
          </div>
        </div>`;
      }
      html += `<div class="card"><div class="card-head"><h2>Job ทั้งหมดของวัน</h2><span class="muted small">${st.jobs.length} งาน</span></div>`;
      if (!st.jobs.length) {
        html += `<div class="empty">${icon('route', 36)}<div>ยังไม่มี Job ในวันนี้</div><a class="btn btn-primary btn-sm" href="#/admin/jobs/new">${icon('plus', 16)}สร้าง Job</a></div>`;
      } else {
        html += '<div class="job-list">' + st.jobs.map((j) => `
          <button type="button" class="job-row ${j.id === st.sel ? 'on' : ''}" data-sel="${esc(j.id)}" aria-pressed="${j.id === st.sel}">
            <i class="dot" style="background:${dotColor(j.status)}"></i>
            <span class="grow"><span class="t"><span class="mono" style="font-size:14px">${esc(j.plate)}</span> · ${esc(UI.jobTitle(j))}</span>
            <span class="s">${esc(j.driver_name)}${j.time ? ' · ' + esc(j.time) + ' น.' : ''}</span></span>
            <span class="muted small" style="flex:none">${j.status === 'cancelled' ? 'ยกเลิก' : j.done_count + '/' + j.total_count}</span>
          </button>`).join('') + '</div>';
      }
      html += '</div>';
      $('#d-side').innerHTML = html;
      $$('[data-sel]', $('#d-side')).forEach((b) => b.addEventListener('click', () => {
        st.sel = b.dataset.sel; App.state.dashSel = st.sel; drawSide(); drawMap();
      }));
      $$('[data-photo]', $('#d-side')).forEach((b) => b.addEventListener('click', () => UI.showPhoto(b.dataset.photo, b.dataset.cap)));
    }

    function drawTable() {
      if (!st.jobs.length) { $('#d-table').innerHTML = `<div class="empty">ไม่มี Job ในวันที่เลือก</div>`; return; }
      $('#d-table').innerHTML = jobTable(st.jobs);
      bindJobTable($('#d-table'));
    }

    $('#d-date').addEventListener('change', (e) => {
      if (!e.target.value) return;
      st.date = e.target.value; App.state.dashDate = st.date; st.sel = null;
      load();
    });
    $('#d-refresh').addEventListener('click', () => load());
    const timer = setInterval(() => { if (document.visibilityState === 'visible' && st.date === UI.today()) load(true); }, 120000);
    App.onLeave(() => clearInterval(timer));
    load();
  };

  function jobTable(jobs) {
    return `<div class="table-wrap"><table class="tbl"><thead><tr>
      <th>เลข Job</th><th>วันที่</th><th>ชื่องาน / เส้นทาง</th><th>คนขับ</th><th>ทะเบียน</th><th>เวลาเริ่ม</th><th>ความคืบหน้า</th><th>สถานะ</th>
      </tr></thead><tbody>${jobs.map((j) => `
      <tr class="click" data-go="#/admin/jobs/${esc(j.id)}" tabindex="0">
        <td class="mono small">${esc(j.job_no)}</td>
        <td style="white-space:nowrap">${esc(UI.fmtDate(j.date, { short: true }))}</td>
        <td>${esc(UI.jobTitle(j))}<div class="muted small">${j.total_count} จุด</div></td>
        <td>${esc(j.driver_name)}</td>
        <td class="mono small" style="white-space:nowrap">${esc(j.plate)}</td>
        <td>${esc(j.time || '-')}</td>
        <td style="min-width:120px"><div class="small" style="margin-bottom:4px">${j.done_count}/${j.total_count} จุด</div>${UI.progressBar(j)}</td>
        <td>${chip(j.status)}</td>
      </tr>`).join('')}</tbody></table></div>`;
  }
  function bindJobTable(root) {
    $$('tr[data-go]', root).forEach((tr) => {
      tr.addEventListener('click', () => { location.hash = tr.dataset.go; });
      tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') location.hash = tr.dataset.go; });
    });
  }

  /* ====================== รายการ Job ====================== */
  V.jobs = async function () {
    const t = UI.today();
    const f = App.state.jobsFilter || (App.state.jobsFilter = { from: UI.addDays(t, -7), to: UI.addDays(t, 14), status: '', q: '' });
    let jobs = [];
    mount('jobs', `
      <div class="page-head">
        <div><h1>Job</h1><div class="sub">สร้าง แก้ไข และดูประวัติการเช็คอิน</div></div>
        <div class="actions"><a href="#/admin/jobs/new" class="btn btn-primary">${icon('plus', 18)}สร้าง Job</a></div>
      </div>
      <div class="card card-pad">
        <div class="grid g4">
          <label class="field"><span>ตั้งแต่วันที่</span><input type="date" class="input" id="f-from" value="${esc(f.from)}"></label>
          <label class="field"><span>ถึงวันที่</span><input type="date" class="input" id="f-to" value="${esc(f.to)}"></label>
          <label class="field"><span>สถานะ</span><select class="input" id="f-status">
            <option value="">ทั้งหมด</option>${['pending', 'in_progress', 'done', 'cancelled'].map((s) => `<option value="${s}" ${f.status === s ? 'selected' : ''}>${UI.STATUS[s]}</option>`).join('')}
          </select></label>
          <label class="field"><span>ค้นหา</span><input type="search" class="input" id="f-q" value="${esc(f.q)}" placeholder="เลข Job, ทะเบียน, คนขับ, สถานที่"></label>
        </div>
      </div>
      <section class="card"><div class="card-head"><h2 id="j-count">รายการ</h2><span class="muted small">กดที่แถวเพื่อดูรายละเอียด</span></div><div id="j-list">${loading()}</div></section>`);

    function draw() {
      const q = f.q.trim().toLowerCase();
      const list = jobs.filter((j) => (!f.status || j.status === f.status) && (!q ||
        [j.job_no, j.plate, j.driver_name, j.title, j.note].concat(j.stops.map((s) => s.name)).join(' ').toLowerCase().includes(q)));
      $('#j-count').textContent = `รายการ (${list.length})`;
      $('#j-list').innerHTML = list.length ? jobTable(list) : `<div class="empty">${icon('search', 36)}<div>ไม่พบ Job ตามเงื่อนไข</div></div>`;
      bindJobTable($('#j-list'));
    }
    async function load() {
      $('#j-list').innerHTML = loading();
      try { jobs = await API.call('listJobs', { from: f.from, to: f.to }); jobs.reverse(); draw(); }
      catch (e) { $('#j-list').innerHTML = errorBox(e); }
    }
    $('#f-from').addEventListener('change', (e) => { f.from = e.target.value || t; load(); });
    $('#f-to').addEventListener('change', (e) => { f.to = e.target.value || t; load(); });
    $('#f-status').addEventListener('change', (e) => { f.status = e.target.value; draw(); });
    $('#f-q').addEventListener('input', (e) => { f.q = e.target.value; draw(); });
    load();
  };

  /* ====================== สร้าง / แก้ไข Job ====================== */
  V.jobEdit = async function (params, query) {
    const editId = params[0] || null;
    const copyId = query.get('copy');
    mount('jobs', loading('กำลังเตรียมข้อมูล…'));
    let drivers, places, recent, src = null;
    try {
      const t = UI.today();
      [drivers, places, recent, src] = await Promise.all([
        API.call('listDrivers'), API.call('listPlaces'),
        API.call('listJobs', { from: UI.addDays(t, -60), to: UI.addDays(t, 30) }),
        editId || copyId ? API.call('getJob', { id: editId || copyId }) : Promise.resolve(null)
      ]);
    } catch (e) { mount('jobs', errorBox(e)); return; }

    const plates = Array.from(new Set(recent.map((j) => j.plate).filter(Boolean)));
    const st = {
      job: { id: editId || '', date: App.state.dashDate || UI.today(), time: '', title: '', driver_id: '', plate: '', note: '' },
      stops: [], tab: 'search', results: null, preview: null, dirtyRoute: !editId, original: editId ? src : null
    };
    if (src) {
      const keep = ['time', 'title', 'driver_id', 'plate', 'note'];
      keep.forEach((k) => { st.job[k] = src[k] || ''; });
      if (editId) st.job.date = src.date;
      st.stops = src.stops.map((s) => ({
        id: editId ? s.id : '', name: s.name, address: s.address, lat: s.lat, lng: s.lng, map_url: s.map_url,
        note: s.note, planned_time: s.planned_time, status: editId ? s.status : 'pending', arrived_at: editId ? s.arrived_at : ''
      }));
    }
    if (editId && src.status === 'cancelled') { mount('jobs', `<div class="banner bad">Job นี้ถูกยกเลิกแล้ว แก้ไขไม่ได้</div><a class="back" href="#/admin/jobs/${esc(editId)}">← กลับ</a>`); return; }
    const activeDrivers = drivers.filter((d) => d.active || d.id === st.job.driver_id);
    const started = editId && src.status !== 'pending';

    mount('jobs', `
      <div class="page-head">
        <div><a class="back" href="${editId ? '#/admin/jobs/' + esc(editId) : '#/admin/jobs'}">${icon('back', 16)}${editId ? 'กลับไปหน้า Job' : 'รายการ Job'}</a>
          <h1>${editId ? 'แก้ไข ' + esc(src.job_no) : 'สร้าง Job ใหม่'}</h1>
          <div class="sub">${copyId ? 'คัดลอกจาก ' + esc(src.job_no) + ' — ตรวจสอบวันที่ก่อนบันทึก' : 'กำหนดสถานที่ตามลำดับ คนขับจะเห็นงานนี้ในแอปทันทีที่บันทึก'}</div></div>
        <div class="actions"><a class="btn" href="${editId ? '#/admin/jobs/' + esc(editId) : '#/admin/jobs'}">ยกเลิก</a>
          <button type="button" class="btn btn-primary" data-save>${icon('check', 18)}บันทึก Job</button></div>
      </div>
      <div class="split">
        <div class="main">
          <section class="card card-pad" aria-label="ข้อมูล Job">
            <h2 class="title">ข้อมูล Job</h2>
            <div class="grid g3">
              <label class="field"><span>วันที่ *</span><input type="date" class="input" data-j="date" value="${esc(st.job.date)}" required></label>
              <label class="field"><span>เวลาเริ่มงาน</span><input type="time" class="input" data-j="time" value="${esc(st.job.time)}"></label>
              <label class="field"><span>คนขับ *</span><select class="input" data-j="driver_id" ${started ? 'disabled' : ''}>
                <option value="">— เลือกคนขับ —</option>
                ${activeDrivers.map((d) => `<option value="${esc(d.id)}" ${d.id === st.job.driver_id ? 'selected' : ''}>${esc(d.name)}${d.active ? '' : ' (ปิดใช้งาน)'}</option>`).join('')}
              </select>${started ? '<span class="hint">เริ่มงานแล้ว เปลี่ยนคนขับไม่ได้</span>' : (activeDrivers.length ? '' : '<span class="hint">ยังไม่มีคนขับ — <a href="#/admin/drivers">เพิ่มคนขับ</a></span>')}</label>
            </div>
            <div class="grid g2" style="margin-top:16px">
              <label class="field"><span>ทะเบียนรถ *</span><input class="input" data-j="plate" list="plate-list" value="${esc(st.job.plate)}" placeholder="เช่น ฮข 4521" maxlength="20">
                <datalist id="plate-list">${plates.map((p) => `<option value="${esc(p)}">`).join('')}</datalist></label>
              <label class="field"><span>ชื่องาน</span><input class="input" data-j="title" value="${esc(st.job.title)}" placeholder="เช่น รับพนักงานกะเช้า, ทัวร์อยุธยา" maxlength="120"></label>
            </div>
            <label class="field" style="margin-top:16px"><span>หมายเหตุถึงคนขับ</span><textarea class="input" data-j="note" maxlength="500" placeholder="เช่น โทรแจ้งลูกค้าก่อนถึง 5 นาที">${esc(st.job.note)}</textarea></label>
          </section>

          <section class="card card-pad" aria-label="สถานที่" style="display:flex;flex-direction:column;gap:14px">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
              <h2 style="font-size:18px">สถานที่ตามลำดับ <span class="muted" style="font-weight:500;font-size:15px" id="s-count"></span></h2>
              <span class="muted small">คนขับต้องถ่ายรูปเช็คอินทุกจุด</span>
            </div>
            <div id="s-list" style="display:flex;flex-direction:column;gap:10px"></div>
            <div class="add-box" id="add-box"></div>
          </section>
        </div>
        <aside class="side sticky">
          <section class="card map-card" aria-label="ตัวอย่างเส้นทาง">
            <div class="card-head"><h2>ตัวอย่างเส้นทาง</h2></div>
            <div class="map sm" id="p-map"></div>
          </section>
          <section class="card card-pad" style="display:flex;flex-direction:column;gap:10px;font-size:14px" id="summary"></section>
          <button type="button" class="btn btn-primary btn-lg" data-save>${icon('check', 18)}บันทึก Job</button>
        </aside>
      </div>`);

    $$('[data-j]').forEach((el) => el.addEventListener('input', () => { st.job[el.dataset.j] = el.value; drawSummary(); }));
    $$('[data-j]').forEach((el) => el.addEventListener('change', () => { st.job[el.dataset.j] = el.value; drawSummary(); }));

    function drawStops() {
      $('#s-count').textContent = `(${st.stops.length} จุด)`;
      if (!st.stops.length) {
        $('#s-list').innerHTML = `<div class="empty" style="padding:22px">${icon('pin', 32)}<div>ยังไม่มีสถานที่ — เพิ่มจากกล่องด้านล่าง</div></div>`;
      } else {
        $('#s-list').innerHTML = st.stops.map((s, i) => {
          const locked = s.status === 'arrived';
          return `<div class="stop-edit ${locked ? 'locked' : ''}">
            <div class="num ${locked ? 'done' : ''}">${i + 1}</div>
            <div class="body">
              <input class="input" data-i="${i}" data-f="name" value="${esc(s.name)}" aria-label="ชื่อสถานที่ จุดที่ ${i + 1}" maxlength="120" placeholder="ชื่อสถานที่">
              <div class="meta">
                ${s.address ? `<span>${esc(s.address)}</span>` : ''}
                ${UI.hasXY(s) ? '<span class="tag good">มีพิกัด</span>' : '<span class="tag warn">ไม่มีพิกัด · นำทางด้วยลิงก์</span>'}
                <a href="${esc(UI.placeUrl(s))}" target="_blank" rel="noopener">ดูใน Google Maps</a>
                ${locked ? `<span class="tag good">${icon('check', 12)}เช็คอินแล้ว ${esc(UI.hhmm(s.arrived_at))}</span>` : ''}
              </div>
              <div class="grid g2" style="gap:10px">
                <label class="field"><span class="small">เวลานัด</span><input type="time" class="input sm" data-i="${i}" data-f="planned_time" value="${esc(s.planned_time)}"></label>
                <label class="field"><span class="small">หมายเหตุจุดนี้</span><input class="input sm" data-i="${i}" data-f="note" value="${esc(s.note)}" maxlength="300" placeholder="เช่น รับ 3 คน, รอหน้าป้อม"></label>
              </div>
            </div>
            <div class="tools">
              <button type="button" class="btn sq btn-sm" data-move="${i}" data-d="-1" aria-label="เลื่อนจุดที่ ${i + 1} ขึ้น" ${i === 0 ? 'disabled' : ''}>${icon('up', 18)}</button>
              <button type="button" class="btn sq btn-sm" data-move="${i}" data-d="1" aria-label="เลื่อนจุดที่ ${i + 1} ลง" ${i === st.stops.length - 1 ? 'disabled' : ''}>${icon('down', 18)}</button>
              <button type="button" class="btn sq btn-sm btn-danger" data-del="${i}" aria-label="ลบจุดที่ ${i + 1}" ${locked ? 'disabled title="เช็คอินแล้ว ลบไม่ได้"' : ''}>${icon('trash', 18)}</button>
            </div>
          </div>`;
        }).join('');
      }
      $$('#s-list [data-f]').forEach((el) => el.addEventListener('input', () => {
        st.stops[Number(el.dataset.i)][el.dataset.f] = el.value; drawSummary();
      }));
      $$('#s-list [data-move]').forEach((b) => b.addEventListener('click', () => {
        const i = Number(b.dataset.move), j = i + Number(b.dataset.d);
        if (j < 0 || j >= st.stops.length) return;
        [st.stops[i], st.stops[j]] = [st.stops[j], st.stops[i]];
        st.dirtyRoute = true; drawStops(); drawMap(); drawSummary();
      }));
      $$('#s-list [data-del]').forEach((b) => b.addEventListener('click', () => {
        st.stops.splice(Number(b.dataset.del), 1);
        st.dirtyRoute = true; drawStops(); drawMap(); drawSummary();
      }));
    }

    function drawMap() {
      UI.renderMap($('#p-map'), st.stops.map((s, i) => Object.assign({}, s, { seq: i + 1 })), {
        polyline: !st.dirtyRoute && st.original ? st.original.route_polyline : '', emptyText: 'เพิ่มสถานที่เพื่อดูเส้นทาง'
      });
    }

    function drawSummary() {
      const times = st.stops.map((s) => s.planned_time).filter(Boolean);
      const o = st.original;
      const drv = drivers.find((d) => d.id === st.job.driver_id);
      $('#summary').innerHTML = `<b style="font-size:16px">สรุป</b>
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">วันที่</span><b>${esc(UI.fmtDate(st.job.date))}${st.job.time ? ' · ' + esc(st.job.time) : ''}</b></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">คนขับ / รถ</span><b>${esc(drv ? drv.name : '-')} · ${esc(st.job.plate || '-')}</b></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">จำนวนสถานที่</span><b>${st.stops.length} จุด</b></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">ช่วงเวลานัด</span><b>${times.length ? esc(times[0]) + ' – ' + esc(times[times.length - 1]) : '-'}</b></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="muted">ระยะทางประมาณ</span><b>${!st.dirtyRoute && o && o.distance_km ? o.distance_km + ' กม. · ' + o.duration_min + ' นาที' : 'คำนวณหลังบันทึก'}</b></div>`;
    }

    function addStop(p) {
      st.stops.push({ id: '', name: p.name || '', address: p.address || '', lat: p.lat, lng: p.lng, map_url: p.map_url || '', note: '', planned_time: '', status: 'pending' });
      st.dirtyRoute = true;
      drawStops(); drawMap(); drawSummary();
      toast(`เพิ่ม "${p.name || 'สถานที่'}" เป็นจุดที่ ${st.stops.length} แล้ว`, 'good');
    }

    function drawAdd() {
      const tabs = [['search', 'ค้นหาสถานที่', 'search'], ['link', 'วางลิงก์ Google Maps', 'link'], ['saved', 'สถานที่ที่เคยใช้', 'pin']];
      let body = '';
      if (st.tab === 'search') {
        body = `<form class="row" id="f-search">
            <label class="field grow"><span>ค้นหาชื่อสถานที่หรือที่อยู่</span><input class="input" id="q" placeholder="เช่น เซ็นทรัล บางนา, สนามบินสุวรรณภูมิ" value="${esc(st.lastQ || '')}" autocomplete="off"></label>
            <button class="btn btn-dark" type="submit">${icon('search', 18)}ค้นหา</button>
          </form>
          ${API.isDemo() ? '<div class="muted small">โหมดตัวอย่างค้นได้เฉพาะสถานที่ตัวอย่าง เช่น บางนา, สนามบิน, อยุธยา — ระบบจริงค้นจาก Google</div>' : '<div class="muted small">ผลค้นหาจาก Google · ถ้าไม่เจอ ให้เปิดค้นใน Google Maps แล้วคัดลอกลิงก์มาวางในแท็บ "วางลิงก์"</div>'}
          <div id="results" style="display:flex;flex-direction:column;gap:8px">${resultsHtml()}</div>`;
      } else if (st.tab === 'link') {
        body = `<form class="row" id="f-link">
            <label class="field grow"><span>ลิงก์จาก Google Maps หรือพิกัด</span><input class="input" id="link" placeholder="https://maps.app.goo.gl/… หรือ 13.7462, 100.5347" autocomplete="off"></label>
            <button class="btn btn-dark" type="submit">${icon('link', 18)}อ่านลิงก์</button>
          </form>
          <div class="muted small">ใน Google Maps: เลือกสถานที่ → กด "แชร์" → "คัดลอกลิงก์" แล้วนำมาวางที่นี่</div>
          <div id="preview">${previewHtml()}</div>`;
      } else {
        body = `<label class="field"><span>ค้นหาในสถานที่ที่เคยใช้ (${places.length})</span><input class="input" id="pq" placeholder="พิมพ์เพื่อกรอง" autocomplete="off"></label>
          <div id="saved" style="display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto"></div>`;
      }
      $('#add-box').innerHTML = `<b>เพิ่มสถานที่</b>
        <div class="tabs" role="tablist">${tabs.map(([k, t, ic]) => `<button type="button" role="tab" aria-selected="${st.tab === k}" class="${st.tab === k ? 'on' : ''}" data-tab="${k}">${t}</button>`).join('')}</div>${body}`;
      $$('[data-tab]', $('#add-box')).forEach((b) => b.addEventListener('click', () => { st.tab = b.dataset.tab; drawAdd(); }));

      if (st.tab === 'search') {
        $('#f-search').addEventListener('submit', async (e) => {
          e.preventDefault();
          const q = $('#q').value.trim();
          if (q.length < 2) { toast('พิมพ์คำค้นหาอย่างน้อย 2 ตัวอักษร', 'bad'); return; }
          st.lastQ = q;
          const btn = e.submitter || $('#f-search button');
          busy(btn, true, 'กำลังค้นหา…');
          try { st.results = await API.call('searchPlace', { q }); }
          catch (err) { toast(err.message, 'bad'); st.results = null; }
          busy(btn, false);
          $('#results').innerHTML = resultsHtml();
          bindResults();
        });
        bindResults();
      } else if (st.tab === 'link') {
        $('#f-link').addEventListener('submit', async (e) => {
          e.preventDefault();
          const url = $('#link').value.trim();
          if (!url) { toast('กรุณาวางลิงก์', 'bad'); return; }
          const btn = e.submitter || $('#f-link button');
          busy(btn, true, 'กำลังอ่าน…');
          try {
            const r = await API.call('resolveLink', { url });
            st.preview = Object.assign({ address: '' }, r, { name: r.name || '' });
          } catch (err) { toast(err.message, 'bad'); }
          busy(btn, false);
          $('#preview').innerHTML = previewHtml();
          bindPreview();
        });
        bindPreview();
      } else {
        const drawSaved = () => {
          const q = ($('#pq').value || '').trim().toLowerCase();
          const list = places.filter((p) => !q || (p.name + ' ' + (p.address || '')).toLowerCase().includes(q)).slice(0, 60);
          $('#saved').innerHTML = list.length ? list.map((p, i) => `<div class="result"><span class="grow"><span class="t">${esc(p.name)}</span><div class="s">${esc(p.address || (UI.hasXY(p) ? p.lat + ', ' + p.lng : 'มีแค่ลิงก์'))}</div></span>
            <button type="button" class="btn btn-sm" data-add-saved="${places.indexOf(p)}">${icon('plus', 16)}เพิ่ม</button></div>`).join('')
            : '<div class="muted small">ยังไม่มีสถานที่ที่เคยใช้ — สถานที่จะถูกบันทึกอัตโนมัติเมื่อบันทึก Job</div>';
          $$('[data-add-saved]').forEach((b) => b.addEventListener('click', () => addStop(places[Number(b.dataset.addSaved)])));
        };
        $('#pq').addEventListener('input', drawSaved);
        drawSaved();
      }
    }
    function resultsHtml() {
      if (st.results === null) return '';
      const gq = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(st.lastQ || '')}`;
      if (!st.results.length) return `<div class="banner info">ไม่พบสถานที่ — <a href="${esc(gq)}" target="_blank" rel="noopener">ลองค้นใน Google Maps</a> แล้วคัดลอกลิงก์มาวาง</div>`;
      return st.results.map((r, i) => `<div class="result">
          <span class="grow"><span class="t">${esc(r.name)}</span><div class="s">${esc(r.address)}</div></span>
          <a class="btn btn-sm btn-ghost" href="${esc(r.map_url)}" target="_blank" rel="noopener" aria-label="ดู ${esc(r.name)} ใน Google Maps">${icon('external', 16)}</a>
          <button type="button" class="btn btn-sm btn-primary" data-add-res="${i}">${icon('plus', 16)}เพิ่ม</button></div>`).join('') +
        `<a class="small" href="${esc(gq)}" target="_blank" rel="noopener">ไม่ใช่ที่ต้องการ? เปิดค้นใน Google Maps</a>`;
    }
    function bindResults() {
      $$('[data-add-res]').forEach((b) => b.addEventListener('click', () => addStop(st.results[Number(b.dataset.addRes)])));
    }
    function previewHtml() {
      const p = st.preview;
      if (!p) return '';
      const xy = UI.hasXY(p);
      return `<div class="card card-pad" style="display:flex;flex-direction:column;gap:12px;background:#FAFBFC">
        ${xy ? `<iframe class="embed" title="ตัวอย่างตำแหน่ง" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${p.lat},${p.lng}&z=16&output=embed"></iframe>
               <div class="small muted">พิกัด ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>`
             : '<div class="banner warn">อ่านพิกัดจากลิงก์นี้ไม่ได้ — ยังเพิ่มได้ คนขับจะนำทางด้วยลิงก์เดิม แต่จะไม่แสดงบนแผนที่</div>'}
        <div class="grid g2">
          <label class="field"><span>ชื่อสถานที่ *</span><input class="input" id="pv-name" value="${esc(p.name)}" placeholder="ตั้งชื่อให้คนขับเข้าใจง่าย" maxlength="120"></label>
          <label class="field"><span>ที่อยู่ / จุดสังเกต</span><input class="input" id="pv-addr" value="${esc(p.address)}" maxlength="250"></label>
        </div>
        <div class="actions"><button type="button" class="btn btn-primary" id="pv-add">${icon('plus', 18)}เพิ่มจุดนี้</button><a href="${esc(p.map_url)}" target="_blank" rel="noopener" class="small">เปิดลิงก์</a></div>
      </div>`;
    }
    function bindPreview() {
      const b = $('#pv-add');
      if (!b) return;
      b.addEventListener('click', () => {
        const name = $('#pv-name').value.trim();
        if (!name) { toast('กรุณาตั้งชื่อสถานที่', 'bad'); $('#pv-name').focus(); return; }
        addStop(Object.assign({}, st.preview, { name, address: $('#pv-addr').value.trim() }));
        st.preview = null;
        drawAdd();
      });
    }

    async function save(btn) {
      const j = st.job;
      if (!j.date) return toast('กรุณาเลือกวันที่', 'bad');
      if (!j.driver_id) return toast('กรุณาเลือกคนขับ', 'bad');
      if (!j.plate.trim()) return toast('กรุณาใส่ทะเบียนรถ', 'bad');
      if (!st.stops.length) return toast('กรุณาเพิ่มสถานที่อย่างน้อย 1 จุด', 'bad');
      const empty = st.stops.findIndex((s) => !String(s.name || '').trim());
      if (empty >= 0) return toast(`สถานที่จุดที่ ${empty + 1} ยังไม่มีชื่อ`, 'bad');
      $$('[data-save]').forEach((b) => busy(b, true));
      try {
        const saved = await API.call('saveJob', {
          job: j,
          stops: st.stops.map((s) => ({ id: s.id, name: s.name, address: s.address, lat: s.lat, lng: s.lng, map_url: s.map_url, note: s.note, planned_time: s.planned_time }))
        });
        toast(`บันทึก ${saved.job_no} แล้ว`, 'good');
        location.hash = '#/admin/jobs/' + saved.id;
      } catch (e) {
        toast(e.message, 'bad');
        $$('[data-save]').forEach((b) => busy(b, false));
      }
    }
    $$('[data-save]').forEach((b) => b.addEventListener('click', () => save(b)));

    drawStops(); drawAdd(); drawMap(); drawSummary();
  };

  /* ====================== รายละเอียด Job ====================== */
  V.jobDetail = async function (params) {
    const id = params[0];
    mount('jobs', loading());
    let job;

  function stopTimeline(job, s) {
    const done = s.status === 'arrived';
    const diff = done ? UI.minutesDiff(s.planned_time, s.arrived_at) : null;
    const late = overdueMin(job, s);
    let timing = s.planned_time ? `นัด ${esc(s.planned_time)} น.` : 'ไม่ได้กำหนดเวลานัด';
    if (done) {
      timing += ` · <b style="color:var(--good-ink)">เช็คอิน ${esc(UI.fmtStamp(s.arrived_at))}</b>`;
      if (diff !== null && diff > 5) timing += ` <span class="tag warn">ช้า ${UI.fmtMin(diff)}</span>`;
      else if (diff !== null && diff < -5) timing += ` <span class="tag">ก่อนเวลา ${UI.fmtMin(-diff)}</span>`;
    } else if (late !== null && late > 0) {
      timing += ` <span class="tag warn">เลยเวลานัด ${UI.fmtMin(late)}</span>`;
    } else if (job.status !== 'cancelled' && isOverdue(job, s)) {
      timing += ' <span class="tag warn">ยังไม่เช็คอิน</span>';
    }
    const dist = done ? (s.checkin_dist_m !== null && s.checkin_dist_m !== undefined ? s.checkin_dist_m : UI.distanceM(s, { lat: s.arrive_lat, lng: s.arrive_lng })) : null;
    const radius = Number(job.checkin_radius_m) || 0;
    const photos = s.photos && s.photos.length ? s.photos : (s.photo_url ? [s.photo_url] : []);
    let distTag = '';
    if (done && dist !== null) {
      const inside = radius > 0 ? dist <= radius : dist <= 300;
      distTag = `<span class="tag ${inside ? 'good' : 'warn'}">${icon(inside ? 'check' : 'pin', 12)}เช็คอินห่างจุดนัด ${UI.fmtDist(dist)}${radius > 0 ? (inside ? ` · ในรัศมี ${radius} ม.` : ` · นอกรัศมี ${radius} ม.`) : ''}</span>`;
    } else if (done && s.arrive_lat === null) {
      distTag = `<span class="tag">${UI.hasXY(s) ? 'ไม่มีตำแหน่งตอนเช็คอิน' : 'จุดนี้ไม่ได้ปักหมุด'}</span>`;
    }
    return `<div class="tl-item ${done ? 'done' : ''}">
      <div class="num ${done ? 'done' : 'idle'}">${done ? icon('check', 16) : s.seq}</div>
      <div class="body">
        <span class="name">${esc(s.name)}</span>
        ${s.address ? `<span class="muted small">${esc(s.address)}</span>` : ''}
        <span class="small">${timing}</span>
        ${s.note ? `<span class="small muted">${icon('note', 14)} ${esc(s.note)}</span>` : ''}
        ${done ? `<div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
            ${photos.length ? `<div class="tl-photos">${photos.map((u, i) => `<button type="button" data-photo="${esc(u)}" data-cap="${esc(s.seq + '. ' + s.name + ' · รูปที่ ' + (i + 1) + '/' + photos.length)}" aria-label="ดูรูปเช็คอินที่ ${i + 1} ของ ${esc(s.name)}"><img src="${esc(u)}" alt="" loading="lazy" class="${i === 0 ? 'first' : ''}"></button>`).join('')}</div>` : ''}
            <div style="display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px">
              ${distTag}
              ${photos.length > 1 ? `<span class="tag">${photos.length} รูป</span>` : ''}
              ${s.arrive_lat !== null ? `<a class="small" href="https://www.google.com/maps/search/?api=1&query=${s.arrive_lat},${s.arrive_lng}" target="_blank" rel="noopener">ดูตำแหน่งที่เช็คอิน</a>` : ''}
            </div>
            ${s.checkin_note ? `<span style="font-size:14px">“${esc(s.checkin_note)}”</span>` : ''}
          </div>` : ''}
        <a class="small" href="${esc(UI.placeUrl(s))}" target="_blank" rel="noopener">ดูสถานที่ใน Google Maps</a>
      </div></div>`;
  }
